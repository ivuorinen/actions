# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
# permissions:
#   - contents: read          # Required for checking out repository
---
name: 'C# Lint Check'
description: 'Runs linters like StyleCop or dotnet-format for C# code style checks.'
author: 'Ismo Vuorinen'

branding:
  icon: 'code'
  color: 'blue'

inputs:
  dotnet-version:
    description: 'Version of .NET SDK to use.'
    required: false
  project:
    description: 'Project or solution file, relative to the workspace. Empty uses the one in the repository root.'
    required: false
    default: ''
  token:
    description: 'GitHub token for authentication. Defaults to the workflow token.'
    required: false
    default: ''

outputs:
  lint_status:
    description: 'Overall lint status (success/failure)'
    value: ${{ steps.dotnet-format.outcome == 'success' && 'success' || 'failure' }}
  errors_count:
    description: 'Number of formatting changes dotnet format would make'
    value: ${{ steps.dotnet-format.outputs.errors_count || '0' }}
  warnings_count:
    description: 'Always 0; the dotnet format report has no severity, so all changes count as errors'
    value: ${{ steps.dotnet-format.outputs.warnings_count || '0' }}

runs:
  using: composite
  steps:
    - name: Validate Inputs
      shell: sh
      working-directory: ${{ github.action_path }}
      env:
        INPUT_DOTNET_VERSION: ${{ inputs.dotnet-version }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_TOKEN: ${{ inputs.token }}
      run: |
        set -eu
        if ! command -v python3 >/dev/null 2>&1; then
          echo "::error::python3 is required to validate inputs"
          exit 1
        fi
        python3 validate.py

    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ inputs.token || github.token }}
        persist-credentials: false

    - name: Detect .NET SDK Version
      id: detect-dotnet-version
      shell: sh
      env:
        ACTION_PATH: ${{ github.action_path }}
        DEFAULT_VERSION: ${{ inputs.dotnet-version || '7.0' }}
      run: |
        set -eu
        command -v python3 >/dev/null 2>&1 || { echo "::error::python3 is required to validate detected versions"; exit 1; }

        # Repository files are untrusted: the rule lives in _validation/kit/versions.py and ships in
        # validate.py. Run from the action directory so the checkout cannot steer python3.
        validate_version() {
          (cd "$ACTION_PATH" && python3 validate.py --detected-version "$1")
        }

        # Function to clean version string
        clean_version() {
          printf '%s' "$1" | sed -E 's/^[vV]//' | tr -d ' \n\r'
        }

        detected_version=""

        # Parse .tool-versions file
        if [ -f .tool-versions ]; then
          echo "Checking .tool-versions for dotnet..." >&2
          version=$(awk '/^dotnet[[:space:]]/ {gsub(/#.*/, ""); print $2; exit}' .tool-versions 2>/dev/null || echo "")
          if [ -n "$version" ]; then
            version=$(clean_version "$version")
            if validate_version "$version"; then
              echo "Found .NET version in .tool-versions: $version" >&2
              detected_version="$version"
            fi
          fi
        fi

        # Parse Dockerfile
        if [ -z "$detected_version" ] && [ -f Dockerfile ]; then
          echo "Checking Dockerfile for dotnet..." >&2
          version=$(grep -iF "FROM" Dockerfile | grep -F "dotnet:" | head -1 | \
            sed -n -E "s/.*dotnet:([0-9]+(\.[0-9]+)*)(-[^:]*)?.*/\1/p" || echo "")
          if [ -n "$version" ]; then
            version=$(clean_version "$version")
            if validate_version "$version"; then
              echo "Found .NET version in Dockerfile: $version" >&2
              detected_version="$version"
            fi
          fi
        fi

        # Parse devcontainer.json
        if [ -z "$detected_version" ] && [ -f .devcontainer/devcontainer.json ]; then
          echo "Checking devcontainer.json for dotnet..." >&2
          if command -v jq >/dev/null 2>&1; then
            version=$(jq -r '.image // empty' .devcontainer/devcontainer.json 2>/dev/null | sed -n -E "s/.*dotnet:([0-9]+(\.[0-9]+)*)(-[^:]*)?.*/\1/p" || echo "")
            if [ -n "$version" ]; then
              version=$(clean_version "$version")
              if validate_version "$version"; then
                echo "Found .NET version in devcontainer: $version" >&2
                detected_version="$version"
              fi
            fi
          else
            echo "jq not found; skipping devcontainer.json parsing" >&2
          fi
        fi

        # Parse global.json
        if [ -z "$detected_version" ] && [ -f global.json ]; then
          echo "Checking global.json..." >&2
          if command -v jq >/dev/null 2>&1; then
            version=$(jq -r '.sdk.version // empty' global.json 2>/dev/null || echo "")
            if [ -n "$version" ]; then
              version=$(clean_version "$version")
              if validate_version "$version"; then
                echo "Found .NET version in global.json: $version" >&2
                detected_version="$version"
              fi
            fi
          else
            echo "jq not found; skipping global.json parsing" >&2
          fi
        fi

        # Use default version if nothing detected
        if [ -z "$detected_version" ]; then
          detected_version="$DEFAULT_VERSION"
          echo "Using default .NET version: $detected_version" >&2
        fi

        # Set output
        printf 'detected-version=%s\n' "$detected_version" >> "$GITHUB_OUTPUT"
        echo "Final detected .NET version: $detected_version" >&2

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: ${{ steps.detect-dotnet-version.outputs.detected-version }}
        # setup-dotnet saves its cache from any event; the NuGet packages are restored and saved below.
        cache: false

    # The packages hold the assemblies and MSBuild targets the build runs, and csharp-build,
    # csharp-lint-check and csharp-publish share them. Save NuGet Packages writes them only from a
    # trusted event: a pull_request_target, issue_comment or workflow_run run builds pull-request
    # code under the default branch's cache scope, and a later run there would restore and run
    # what it saved. Both steps need a lock file, which the key hashes, and take the folder NuGet
    # reports, NUGET_PACKAGES when the caller sets it, in the runner's own path form.
    - name: Locate NuGet Packages
      id: nuget-folder
      if: hashFiles('**/packages.lock.json') != ''
      shell: sh
      run: |
        set -eu
        command -v dotnet >/dev/null 2>&1 || { echo "::error::dotnet is required to locate the NuGet packages"; exit 1; }
        folder=$(dotnet nuget locals global-packages --list | sed -E -n 's/^global-packages: //p')
        printf 'path=%s\n' "$folder" >> "$GITHUB_OUTPUT"

    - name: Restore NuGet Packages
      id: nuget-cache
      if: hashFiles('**/packages.lock.json') != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.nuget-folder.outputs.path }}
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}

    - name: Run dotnet-format
      id: dotnet-format
      shell: sh
      env:
        PROJECT: ${{ inputs.project }}
      run: |
        set -eu

        command -v jq >/dev/null 2>&1 || { echo "::error::jq is required to read the dotnet format report" >&2; exit 1; }

        # dotnet format --report takes a directory and writes format-report.json (a JSON
        # array of files with FileChanges); it does not produce SARIF.
        command -v mktemp >/dev/null 2>&1 || { echo "::error::mktemp is required to create the report directory"; exit 1; }
        report_dir=$(mktemp -d)
        trap 'rm -rf "$report_dir"' EXIT

        command -v dotnet >/dev/null 2>&1 || { echo "::error::dotnet is required to check the formatting"; exit 1; }

        # Restore in locked mode first, as csharp-build does, so a packages.lock.json that no
        # longer matches the projects fails here. The implicit restore of dotnet format does
        # not run in locked mode, so format runs without it.
        if ! dotnet restore ${PROJECT:+"$PROJECT"} --locked-mode; then
          echo "::error::dotnet restore --locked-mode failed"
          exit 1
        fi

        # --verify-no-changes exits 0 when clean and 2 when files would be reformatted; any
        # other status is a run that did not finish, with no counts to report.
        status=0
        dotnet format ${PROJECT:+"$PROJECT"} --verify-no-changes --no-restore --report "$report_dir" || status=$?
        case "$status" in
          0 | 2) ;;
          *)
            echo "::error::dotnet format failed with exit code $status"
            exit 1
            ;;
        esac

        errors_count=0
        if [ -f "$report_dir/format-report.json" ]; then
          errors_count=$(jq '[.[].FileChanges[]?] | length' "$report_dir/format-report.json")
        fi

        printf 'errors_count=%s\n' "$errors_count" >> "$GITHUB_OUTPUT"
        # The report carries no severity, so every change is counted as an error.
        printf 'warnings_count=%s\n' "0" >> "$GITHUB_OUTPUT"

        if [ "$status" -eq 2 ]; then
          echo "::error::Code formatting issues found ($errors_count). Run 'dotnet format' to fix them."
          exit 1
        fi

    # Also after formatting issues failed the step: the count is written only once the restore
    # and dotnet format have finished.
    - name: Save NuGet Packages
      if: >-
        always() && hashFiles('**/packages.lock.json') != '' && steps.dotnet-format.outputs.errors_count != ''
        && steps.nuget-cache.outputs.cache-hit != 'true'
        && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name)
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.nuget-folder.outputs.path }}
        key: ${{ steps.nuget-cache.outputs.cache-primary-key }}
