# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
# permissions:
#   - security-events: write  # Required for uploading SARIF results
#   - contents: read          # Required for checking out repository
---
name: CodeQL Analysis
description: 'Run CodeQL security analysis for a single language with configurable query suites'
author: Ismo Vuorinen

branding:
  icon: shield
  color: blue

inputs:
  language:
    description: 'Language to analyze (javascript, python, actions, java, csharp, cpp, ruby, go, etc.)'
    required: true

  queries:
    description: 'Comma-separated list of additional queries to run'
    required: false
    default: ''

  packs:
    description: 'Comma-separated list of CodeQL query packs to run'
    required: false
    default: ''

  config-file:
    description: 'Path to CodeQL configuration file'
    required: false
    default: ''

  config:
    description: 'Configuration passed as a YAML string'
    required: false
    default: ''

  build-mode:
    description: 'The build mode for compiled languages (none, manual, autobuild)'
    required: false
    default: ''

  source-root:
    description: 'Path of the root source code directory'
    required: false
    default: ''

  category:
    description: 'Analysis category (default: /language:<language>)'
    required: false
    default: ''

  checkout-ref:
    description: 'Git reference to checkout (default: current ref). Any value fails on pull_request_target and workflow_run, which run with base repository privileges.'
    required: false
    default: ''

  token:
    description: 'GitHub token for checking out the repository. Defaults to the workflow token.'
    required: false
    default: ''

  working-directory:
    description: 'Working directory for the analysis'
    required: false
    default: '.'

  upload-results:
    description: "Upload results to GitHub Security tab (lowercase true or false). 'false' disables the upload entirely, including on failure."
    required: false
    default: 'true'

  ram:
    description: 'Amount of memory in MB that can be used by CodeQL'
    required: false
    default: ''

  threads:
    description: 'Number of threads that can be used by CodeQL'
    required: false
    default: ''

  output:
    description: >-
      Workspace-relative directory for the SARIF results. Absolute paths, .. and paths through a symlink,
      committed or made by the build, are rejected. The analysis deletes and recreates this directory,
      so it must not hold tracked files.
    required: false
    default: 'codeql-results'

  skip-queries:
    description: 'Build database but skip running queries (lowercase true or false)'
    required: false
    default: 'false'

outputs:
  language-analyzed:
    description: 'Language that was analyzed'
    value: ${{ inputs.language }}

  analysis-category:
    description: 'Category used for the analysis'
    value: ${{ steps.set-category.outputs.category }}

  sarif-file:
    description: 'Absolute path to the directory containing the generated SARIF file'
    value: ${{ steps.analysis.outputs.sarif-output }}

runs:
  using: composite
  steps:
    - name: Validate Inputs
      shell: sh
      working-directory: ${{ github.action_path }}
      env:
        INPUT_BUILD_MODE: ${{ inputs.build-mode }}
        INPUT_CATEGORY: ${{ inputs.category }}
        INPUT_CHECKOUT_REF: ${{ inputs.checkout-ref }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_LANGUAGE: ${{ inputs.language }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_PACKS: ${{ inputs.packs }}
        INPUT_QUERIES: ${{ inputs.queries }}
        INPUT_RAM: ${{ inputs.ram }}
        INPUT_SKIP_QUERIES: ${{ inputs.skip-queries }}
        INPUT_SOURCE_ROOT: ${{ inputs.source-root }}
        INPUT_THREADS: ${{ inputs.threads }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_UPLOAD_RESULTS: ${{ inputs.upload-results }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -eu
        if ! command -v python3 >/dev/null 2>&1; then
          echo "::error::python3 is required to validate inputs"
          exit 1
        fi
        python3 validate.py

    - name: Validate checkout safety
      id: checkout-safety
      shell: sh
      env:
        CHECKOUT_REF: ${{ inputs.checkout-ref }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        set -eu
        # Autobuild runs the checked-out code with this job's token and secrets, so these triggers
        # only analyze the commit GitHub selected. actions/checkout v7 refuses fork pull request
        # code here but lets same-repository refs through, so this refuses every custom ref.
        case "$EVENT_NAME" in
          pull_request_target | workflow_run)
            if [ -n "$CHECKOUT_REF" ]; then
              echo "::error::checkout-ref is not allowed on $EVENT_NAME, which runs with base repository privileges. Remove the input, or analyze the ref on pull_request."
              exit 1
            fi
            ;;
        esac

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.checkout-ref || github.sha }}
        token: ${{ inputs.token || github.token }}
        persist-credentials: false

    - name: Set analysis category
      id: set-category
      shell: sh
      env:
        CATEGORY: ${{ inputs.category }}
        LANGUAGE: ${{ inputs.language }}
      run: |
        set -eu
        if [ -n "$CATEGORY" ]; then
          category="$CATEGORY"
        else
          category="/language:$LANGUAGE"
        fi
        printf 'category=%s\n' "$category" >> "$GITHUB_OUTPUT"
        echo "Using analysis category: $category"

    - name: Set build mode
      id: set-build-mode
      shell: sh
      env:
        BUILD_MODE: ${{ inputs.build-mode }}
        LANGUAGE: ${{ inputs.language }}
      run: |
        set -eu
        build_mode="$BUILD_MODE"
        if [ -z "$build_mode" ]; then
          # Auto-detect build mode based on language
          case "$LANGUAGE" in
            javascript|python|ruby|actions)
              build_mode="none"
              ;;
            java|csharp|cpp|c|go|swift|kotlin)
              build_mode="autobuild"
              ;;
          esac
        fi
        printf 'build-mode=%s\n' "$build_mode" >> "$GITHUB_OUTPUT"
        echo "Using build mode: $build_mode"

    - name: Initialize CodeQL
      uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        languages: ${{ inputs.language }}
        queries: ${{ inputs.queries }}
        packs: ${{ inputs.packs }}
        config-file: ${{ inputs.config-file }}
        config: ${{ inputs.config }}
        build-mode: ${{ steps.set-build-mode.outputs.build-mode }}
        source-root: ${{ inputs.source-root || inputs.working-directory }}
        ram: ${{ inputs.ram }}
        threads: ${{ inputs.threads }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      if: ${{ steps.set-build-mode.outputs.build-mode == 'autobuild' }}

    # The analysis deletes the output directory before writing to it, and a symlink anywhere on
    # the path would point that deletion outside the workspace. validate.py sees only the text
    # of the path, before checkout, so the files are checked here, after the checkout and the
    # build have run. This inspects the path as it is now; it cannot stop a later change.
    - name: Check output path
      id: output-path
      shell: sh
      env:
        OUTPUT: ${{ inputs.output }}
      run: |
        set -eu
        path="$GITHUB_WORKSPACE"
        rest="$OUTPUT"
        while [ -n "$rest" ]; do
          part="${rest%%/*}"
          if [ "$part" = "$rest" ]; then rest=""; else rest="${rest#*/}"; fi
          if [ -z "$part" ] || [ "$part" = "." ]; then continue; fi
          path="$path/$part"
          if [ -L "$path" ]; then
            printf '::error::output must not pass through a symlink, and %s is one\n' "${path#"$GITHUB_WORKSPACE"/}"
            exit 1
          fi
        done

    - name: Perform CodeQL Analysis
      id: analysis
      uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        category: ${{ steps.set-category.outputs.category }}
        upload: ${{ inputs.upload-results == 'true' && 'always' || 'never' }}
        output: ${{ inputs.output }}
        ram: ${{ inputs.ram }}
        threads: ${{ inputs.threads }}
        skip-queries: ${{ inputs.skip-queries }}

    - name: Summary
      shell: sh
      env:
        LANGUAGE: ${{ inputs.language }}
        CATEGORY: ${{ steps.set-category.outputs.category }}
        BUILD_MODE: ${{ steps.set-build-mode.outputs.build-mode }}
        QUERIES: ${{ inputs.queries }}
        PACKS: ${{ inputs.packs }}
        UPLOAD_RESULTS: ${{ inputs.upload-results }}
        OUTPUT: ${{ inputs.output }}
      run: |
        set -eu
        echo "✅ CodeQL analysis completed for language: $LANGUAGE"
        echo "📊 Category: $CATEGORY"
        echo "🏗️ Build mode: $BUILD_MODE"
        echo "🔍 Queries: ${QUERIES:-default}"
        echo "📦 Packs: ${PACKS:-none}"
        if [ "$UPLOAD_RESULTS" = "true" ]; then
          echo "📤 Results uploaded to GitHub Security tab"
        fi
        if [ -n "$OUTPUT" ]; then
          echo "💾 SARIF saved to: $OUTPUT"
        fi
