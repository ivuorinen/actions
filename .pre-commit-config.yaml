---
# Configure pre-commit to use uv for Python hooks
# Pre-commit 3.6.0+ automatically detects and uses uv when available
default_install_hook_types: [pre-commit, commit-msg]

# Each rev is the commit its tag pointed to, in the format `pre-commit autoupdate --freeze`
# writes: a tag can be moved to other code, a commit cannot. Renovate's pre-commit manager
# keeps this format when it bumps a hook.
repos:
  - repo: local
    hooks:
      - id: generate-docs-format-lint
        name: Run format, and lint
        # Runs the docs/format/lint targets directly — NOT `make all`, whose
        # `precommit` step would re-invoke pre-commit and recurse infinitely.
        entry: bash -c 'make format lint'
        language: system
        pass_filenames: false
        # types_or (any of), not types (which is an AND — no file is markdown
        # AND python AND yaml, so the hook never matched and never ran).
        types_or: [markdown, python, yaml]
        files: ^(docs/.*|README\.md|CONTRIBUTING\.md|CHANGELOG\.md|.*\.py|.*\.ya?ml)$
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: d1df990f871e616da38bb602a2671d5e840b9989 # frozen: 0.13.7
    hooks:
      - id: uv-lock
      - id: uv-sync
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: requirements-txt-fixer
      - id: detect-private-key
      - id: destroyed-symlinks
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-ast
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=auto]
      - id: pretty-format-json
        args: [--autofix, --no-sort-keys]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 341e2a331ba578029e66c2e01183e7a6b5ca9ab4 # frozen: v0.24.0
    hooks:
      - id: markdownlint-cli2
        args: [--fix]

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # frozen: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c # frozen: v0.17.3
    hooks:
      # Run the linter with auto-fix
      - id: ruff-check
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 05c1426671b9237fb5e1444dd63aa5731bec0dfb # frozen: v3.13.1-1
    hooks:
      - id: shfmt
        args: ['--apply-ignore']
        exclude: '^_tests/.*\.sh$'

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229 # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: ['-x']
        exclude: '^_tests/.*\.sh$'

  - repo: https://github.com/bridgecrewio/checkov.git
    rev: af20f73b3f9ef72c04c8a524ed41f6c5f39a3490 # frozen: 3.4.5
    hooks:
      - id: checkov
        args:
          - '--quiet'

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  # The project's own hook builds the checker from source at this tag; the Python wrapper
  # downloads a prebuilt binary without verifying it.
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: 0adfdb012938ada0cf563a40f2fceaf9466290ca # frozen: v4.0.2
    hooks:
      - id: editorconfig-checker

  # pre-commit puts the file names after each entry; the -- keeps a path that starts with - from
  # being read as an option.
  - repo: local
    hooks:
      - id: action-validator
        name: action-validator
        language: system
        entry: action-validator --
        files: '(^\.github/workflows/.*\.ya?ml$|.*/action\.ya?ml$)'
      # The jactionlint on PATH, with the profile in .github/jactionlint.yaml, on the files jactionlint's own
      # hooks take. Those hooks clone jdx/jactionlint, whose mise.toml a mise-managed git refuses to read.
      - id: jactionlint
        name: jactionlint
        language: system
        entry: jactionlint --shellcheck= --
        types: [yaml]
        files: '^(\.github/workflows/|\.github/dependabot\.ya?ml$|(.*/)?action\.ya?ml$)'
