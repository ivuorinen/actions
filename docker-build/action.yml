# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
# permissions:
#   - contents: read   # Required for checking out repository
#   - packages: write  # Required for pushing the image and build cache to ghcr.io (push: true)
#   - id-token: write  # Required for keyless image signing with cosign (sign-image: true)
---
name: Docker Build
description: 'Builds a Docker image for multiple architectures with enhanced security and reliability.'
author: 'Ismo Vuorinen'

branding:
  icon: 'package'
  color: 'blue'

inputs:
  image-name:
    description: 'The name of the Docker image to build. Defaults to the repository name.'
    required: false
  tag:
    description: 'Docker image tag: letters, digits, _ . and -, up to 128 characters, not starting with . or -'
    required: true
  architectures:
    description: 'Comma-separated list of architectures to build for.'
    required: false
    default: 'linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6'
  dockerfile:
    description: 'Path to the Dockerfile, relative to the workspace. Remote sources are rejected.'
    required: false
    default: 'Dockerfile'
  context:
    description: 'Docker build context path, relative to the workspace. Remote sources are rejected.'
    required: false
    default: '.'
  build-args:
    description: 'Build arguments in format KEY=VALUE,KEY2=VALUE2, on one line. A VALUE may contain spaces, but no comma or newline.'
    required: false
  cache-from:
    description: 'External cache source, one spec on one line (e.g., type=registry,ref=user/app:cache)'
    required: false
  push:
    description: 'Whether to push the image after building (lowercase true or false). Also enables the per-ref registry build cache on ghcr.io.'
    required: false
    default: 'true'
  max-retries:
    description: 'Maximum number of retry attempts for build and push operations (1-10, must not be empty)'
    required: false
    default: '3'
  token:
    description: 'GitHub token for authentication'
    required: false
    default: ''
  buildx-version:
    description: 'Docker Buildx version to install (e.g., v0.38.2). Empty uses the release this action pins.'
    required: false
  buildkit-version:
    description: 'BuildKit image tag (e.g., v0.34.2), optionally with @sha256:<digest>. Empty uses the digest this action pins.'
    required: false
  cache-mode:
    description: 'Cache mode for build layers (min, max, or inline)'
    required: false
    default: 'max'
  build-contexts:
    description: 'Additional build contexts as name=value,name2=value2, on one line. Each value is a workspace-relative path (spaces allowed, no comma or newline), oci-layout://relative-path, docker-image://, target:, or a Git/HTTP URL.'
    required: false
  network:
    description: 'Network mode for build (host, none, or default)'
    required: false
    default: 'default'
  secrets:
    description: 'Build secrets in format id=path,id2=path2, on one line. Each path is a file relative to the workspace (spaces allowed, no comma or newline).'
    required: false
  auto-detect-platforms:
    description: 'Automatically detect and build for all available platforms (lowercase true or false)'
    required: false
    default: 'false'
  platform-build-args:
    description: 'Platform-specific build args in JSON format'
    required: false
  parallel-builds:
    description: 'Number of parallel platform builds (0 for auto)'
    required: false
    default: '0'
  cache-export:
    description: 'Export cache destination, one spec on one line (e.g., type=gha,mode=max). Replaces the per-ref registry cache export.'
    required: false
  cache-import:
    description: 'Import cache source, one spec on one line (e.g., type=gha)'
    required: false
  dry-run:
    description: 'Perform a dry run without actually building (lowercase true or false)'
    required: false
    default: 'false'
  verbose:
    description: 'Enable plain build progress and print BuildKit daemon debug logs in the job log (lowercase true or false)'
    required: false
    default: 'false'
  platform-fallback:
    description: 'Continue building other platforms if one fails (lowercase true or false)'
    required: false
    default: 'true'
  scan-image:
    description: 'Scan built image for vulnerabilities (lowercase true or false)'
    required: false
    default: 'false'
  sign-image:
    description: 'Sign the built image with cosign (lowercase true or false)'
    required: false
    default: 'false'
  sbom-format:
    description: >-
      DEPRECATED, has no effect: BuildKit SBOM attestations are always SPDX JSON, so only spdx-json is accepted.
      The SBOM and provenance attestations are attached only when push is true.
    required: false
    default: 'spdx-json'

outputs:
  image-digest:
    description: >-
      When push is true, the digest of the pushed manifest. Attestations make that an OCI index even for one platform,
      so it is the digest the tag points at, not a per-platform image. When push is false, the local image ID.
    value: ${{ steps.build.outputs.digest }}
  metadata:
    description: 'Build metadata in JSON format'
    value: ${{ steps.build.outputs.metadata }}
  platforms:
    description: 'Comma-separated platforms in the built image, e.g. linux/amd64,linux/arm/v7. Attestation manifests are not listed.'
    value: ${{ steps.verify.outputs.built }}
  platform-matrix:
    description: 'Build status per platform in JSON format'
    value: ${{ steps.build.outputs.platform-matrix }}
  build-time:
    description: 'Total build time in seconds'
    value: ${{ steps.build.outputs.build-time }}
  scan-results:
    description: 'Vulnerability scan results if scanning enabled'
    value: ${{ steps.scan-output.outputs.results }}
  signature:
    description: 'Digest reference (image@sha256:...) of the signed image if signing enabled'
    value: ${{ steps.sign.outputs.signature }}
  sbom-location:
    description: >-
      DEPRECATED, always empty: buildx reports no SBOM location. The SBOM is an attestation on the pushed image;
      read it with docker buildx imagetools inspect IMAGE --format "{{ json .SBOM.SPDX }}", or for a multi-platform image
      --format '{{ json (index .SBOM "linux/amd64").SPDX }}'.
    value: ''

runs:
  using: composite
  steps:
    - name: Validate Inputs
      shell: sh
      working-directory: ${{ github.action_path }}
      env:
        INPUT_ARCHITECTURES: ${{ inputs.architectures }}
        INPUT_AUTO_DETECT_PLATFORMS: ${{ inputs.auto-detect-platforms }}
        INPUT_BUILD_ARGS: ${{ inputs.build-args }}
        INPUT_BUILD_CONTEXTS: ${{ inputs.build-contexts }}
        INPUT_BUILDKIT_VERSION: ${{ inputs.buildkit-version }}
        INPUT_BUILDX_VERSION: ${{ inputs.buildx-version }}
        INPUT_CACHE_EXPORT: ${{ inputs.cache-export }}
        INPUT_CACHE_FROM: ${{ inputs.cache-from }}
        INPUT_CACHE_IMPORT: ${{ inputs.cache-import }}
        INPUT_CACHE_MODE: ${{ inputs.cache-mode }}
        INPUT_CONTEXT: ${{ inputs.context }}
        INPUT_DOCKERFILE: ${{ inputs.dockerfile }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_IMAGE_NAME: ${{ inputs.image-name }}
        INPUT_MAX_RETRIES: ${{ inputs.max-retries }}
        INPUT_NETWORK: ${{ inputs.network }}
        INPUT_PARALLEL_BUILDS: ${{ inputs.parallel-builds }}
        INPUT_PLATFORM_BUILD_ARGS: ${{ inputs.platform-build-args }}
        INPUT_PLATFORM_FALLBACK: ${{ inputs.platform-fallback }}
        INPUT_PUSH: ${{ inputs.push }}
        INPUT_SBOM_FORMAT: ${{ inputs.sbom-format }}
        INPUT_SCAN_IMAGE: ${{ inputs.scan-image }}
        INPUT_SECRETS: ${{ inputs.secrets }}
        INPUT_SIGN_IMAGE: ${{ inputs.sign-image }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
      run: |
        set -eu
        if ! command -v python3 >/dev/null 2>&1; then
          echo "::error::python3 is required to validate inputs"
          exit 1
        fi
        python3 validate.py

    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ inputs.token || github.token }}
        persist-credentials: false

    - name: Check Dockerfile Exists
      shell: sh
      env:
        DOCKERFILE: ${{ inputs.dockerfile }}
      run: |
        set -eu
        if [ ! -f "$DOCKERFILE" ]; then
          echo "::error::Dockerfile not found at $DOCKERFILE"
          exit 1
        fi

    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        platforms: ${{ inputs.architectures }}

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      env:
        # These pins live here rather than in the input defaults, because a default is
        # copied into the generated README and a bump would then fail the docs drift check.
        # renovate: datasource=github-releases depName=docker/buildx
        DEFAULT_BUILDX_VERSION: 'v0.38.2'
        # renovate: datasource=docker depName=moby/buildkit
        DEFAULT_BUILDKIT_IMAGE_TAG: 'v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe'
      with:
        version: ${{ inputs.buildx-version || env.DEFAULT_BUILDX_VERSION }}
        platforms: ${{ inputs.architectures }}
        # setup-buildx prints the daemon log in the job log whenever --debug is set, so only
        # on request. The other arm is a no-op flag that has to stay non-empty: an empty value
        # restores setup-buildx's defaults, which allow insecure entitlements on the daemon.
        buildkitd-flags: ${{ inputs.verbose == 'true' && '--debug' || '--oci-worker=auto' }}
        driver-opts: |
          network=${{ inputs.network }}
          image=moby/buildkit:${{ inputs.buildkit-version || env.DEFAULT_BUILDKIT_IMAGE_TAG }}

    - name: Detect Available Platforms
      id: detect-platforms
      shell: sh
      env:
        ARCHITECTURES: ${{ inputs.architectures }}
        AUTO_DETECT: ${{ inputs.auto-detect-platforms }}
      run: |
        set -eu

        # When auto-detect is enabled, try to detect available platforms
        if [ "$AUTO_DETECT" = "true" ]; then
          available_platforms=$(docker buildx ls | grep -o 'linux/[^ ]*' | sort -u | tr '\n' ',' | sed -E 's/,$//' || true)

          if [ -n "$available_platforms" ]; then
            printf 'platforms=%s\n' "$available_platforms" >> "$GITHUB_OUTPUT"
            echo "Detected platforms: ${available_platforms}"
          else
            printf 'platforms=%s\n' "$ARCHITECTURES" >> "$GITHUB_OUTPUT"
            echo "Using default platforms (detection failed): $ARCHITECTURES"
          fi
        else
          # Auto-detect disabled, use configured architectures
          printf 'platforms=%s\n' "$ARCHITECTURES" >> "$GITHUB_OUTPUT"
          echo "Using configured platforms: $ARCHITECTURES"
        fi

    - name: Determine Image Name
      id: image-name
      shell: sh
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
      run: |
        set -eu

        if [ -z "$IMAGE_NAME" ]; then
          repo_name=$(basename "${GITHUB_REPOSITORY}")
          printf 'name=%s\n' "$repo_name" >> "$GITHUB_OUTPUT"
        else
          printf 'name=%s\n' "$IMAGE_NAME" >> "$GITHUB_OUTPUT"
        fi

    - name: Check Build Paths
      id: build-paths
      shell: sh
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_BUILD_CONTEXTS: ${{ inputs.build-contexts }}
        INPUT_CONTEXT: ${{ inputs.context }}
        INPUT_DOCKERFILE: ${{ inputs.dockerfile }}
        INPUT_SECRETS: ${{ inputs.secrets }}
      run: |
        set -eu
        # Buildx reads through a symlink that leaves the workspace. validate.py sees only the
        # text of each path, so such a link can only be caught once the files exist.
        python3 -I -B - <<'PY'
        import os
        import sys

        sys.path.insert(0, os.environ["ACTION_PATH"])
        from validate import _docker_context_runner_path

        TRIM = " \t\n\v\f\r"
        paths = [("Context", os.environ["INPUT_CONTEXT"]), ("Dockerfile", os.environ["INPUT_DOCKERFILE"])]
        for entry in os.environ["INPUT_SECRETS"].split(","):
            name, _, path = entry.strip(TRIM).partition("=")
            paths.append((f"Secret {name}", path))
        for entry in os.environ["INPUT_BUILD_CONTEXTS"].split(","):
            name, _, value = entry.strip(TRIM).partition("=")
            paths.append((f"Build context {name}", _docker_context_runner_path(value)))

        workspace = os.path.realpath(".")
        for label, path in paths:
            if path and os.path.commonpath([workspace, os.path.realpath(path)]) != workspace:
                print(f"::error::{label} resolves outside the workspace")
                sys.exit(1)
        PY

    - name: Login to GitHub Container Registry
      if: ${{ inputs.push == 'true' }}
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token || github.token }}

    - name: Build Multi-Architecture Docker Image
      id: build
      shell: sh
      env:
        AUTO_DETECT_PLATFORMS: ${{ inputs.auto-detect-platforms }}
        DETECTED_PLATFORMS: ${{ steps.detect-platforms.outputs.platforms }}
        ARCHITECTURES: ${{ inputs.architectures }}
        PUSH: ${{ inputs.push }}
        DRY_RUN: ${{ inputs.dry-run }}
        MAX_RETRIES: ${{ inputs.max-retries }}
        VERBOSE: ${{ inputs.verbose }}
        IMAGE_NAME: ${{ steps.image-name.outputs.name }}
        TAG: ${{ inputs.tag }}
        BUILD_ARGS: ${{ inputs.build-args }}
        BUILD_CONTEXTS: ${{ inputs.build-contexts }}
        SECRETS: ${{ inputs.secrets }}
        CACHE_IMPORT: ${{ inputs.cache-import }}
        CACHE_FROM: ${{ inputs.cache-from }}
        CACHE_EXPORT: ${{ inputs.cache-export }}
        CACHE_MODE: ${{ inputs.cache-mode }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        CONTEXT: ${{ inputs.context }}
      run: |
        set -eu

        # Track build start time
        build_start=$(date +%s)

        # Determine platforms to build
        if [ "$AUTO_DETECT_PLATFORMS" = "true" ] && [ -n "$DETECTED_PLATFORMS" ]; then
          platforms="$DETECTED_PLATFORMS"
        else
          platforms="$ARCHITECTURES"
        fi

        # For local load (push=false), restrict to single platform
        if [ "$PUSH" != "true" ]; then
          # Extract first platform only for local load
          platforms=$(echo "$platforms" | cut -d',' -f1)
          echo "Local build mode: restricting to single platform: $platforms"
        fi

        # Initialize platform matrix tracking
        platform_matrix="{}"

        # Check for dry run
        if [ "$DRY_RUN" = "true" ]; then
          echo "[DRY RUN] Would build for platforms: $platforms"
          printf 'digest=%s\n' "dry-run-no-digest" >> "$GITHUB_OUTPUT"
          printf 'platform-matrix=%s\n' "{}" >> "$GITHUB_OUTPUT"
          printf 'build-time=%s\n' "0" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ "$PUSH" = "true" ] && ! command -v jq >/dev/null 2>&1; then
          echo "::error::jq is required to read the digest of a pushed image"
          exit 1
        fi

        attempt=1
        max_attempts="$MAX_RETRIES"

        # RUNNER_TEMP belongs to this job, so a concurrent build on the same machine cannot replace
        # the digest read below, as it could in a shared /tmp. The file is read only after a build
        # succeeds, and buildx rewrites it then, so an earlier attempt's file is never read.
        metadata_file="$RUNNER_TEMP/docker-build-metadata.json"

        # Whitespace around a value is not part of it: `A=1, B=2`, or the trailing
        # newline of a YAML block scalar.
        trim() {
          _trimmed="${1#"${1%%[![:space:]]*}"}"
          printf '%s' "${_trimmed%"${_trimmed##*[![:space:]]}"}"
        }

        cache_source=$(trim "${CACHE_IMPORT:-$CACHE_FROM}")
        cache_export=$(trim "$CACHE_EXPORT")
        cache_mode="${CACHE_MODE:-min}"

        # Registry cache, only when the login step above has run. Every ref reads the default
        # branch's tag for a warm start, and writes only its own, so another ref's build does
        # not change what the default branch restores. Tags of other refs start with "refs-",
        # so no ref name can reduce to the reserved "default-branch" tag.
        default_cache_ref=""
        registry_cache_ref=""
        if [ "$PUSH" = "true" ] && [ -n "${GITHUB_REF:-}" ]; then
          normalized_repo=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._\/-]/-/g')
          cache_image="ghcr.io/${normalized_repo}/cache"
          default_cache_ref="$cache_image:default-branch"
          registry_cache_ref="$default_cache_ref"
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            ref_tag=$(printf '%s' "$GITHUB_REF" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-128)
            registry_cache_ref="$cache_image:$ref_tag"
          fi
        fi

        while [ "$attempt" -le "$max_attempts" ]; do
          echo "Build attempt $attempt of $max_attempts"

          # Build command with platform restriction for local load
          if [ "$PUSH" = "true" ]; then
            build_action="--push"
          else
            build_action="--load"
          fi

          # Build argument list safely using positional parameters (POSIX, no arrays)
          set -- docker buildx build \
            --platform="${platforms}" \
            --tag "$IMAGE_NAME:$TAG"

          # One input item is one argv entry: split on commas only, never on whitespace.
          # set -f keeps glob characters in a value (`*.go`) from expanding.
          _oi="$IFS"; IFS=','; set -f
          for _flag in --build-arg --build-context --secret; do
            case "$_flag" in
              --build-arg) _items="$BUILD_ARGS" ;;
              --build-context) _items="$BUILD_CONTEXTS" ;;
              --secret) _items="$SECRETS" ;;
            esac
            for _item in $_items; do
              _item=$(trim "$_item")
              [ -n "$_item" ] || continue
              # The input says id=path; buildx wants id=id,src=path
              [ "$_flag" != "--secret" ] || _item="id=${_item%%=*},src=${_item#*=}"
              set -- "$@" "$_flag" "$_item"
            done
          done
          set +f; IFS="$_oi"

          [ -z "$cache_source" ] || set -- "$@" --cache-from "$cache_source"
          [ -z "$default_cache_ref" ] || set -- "$@" --cache-from "type=registry,ref=$default_cache_ref"
          [ "$registry_cache_ref" = "$default_cache_ref" ] || set -- "$@" --cache-from "type=registry,ref=$registry_cache_ref"

          if [ -n "$cache_export" ]; then
            set -- "$@" --cache-to "$cache_export"
          elif [ -n "$registry_cache_ref" ]; then
            set -- "$@" --cache-to "type=registry,ref=$registry_cache_ref,mode=$cache_mode"
          fi

          set -- "$@" \
            --file "$DOCKERFILE" \
            "${build_action}"

          # Attestations go with a registry push only: --load uses the docker exporter,
          # which fails on them unless the daemon runs the containerd image store.
          [ "$PUSH" != "true" ] || set -- "$@" --provenance=true --sbom=true
          [ "$VERBOSE" != "true" ] || set -- "$@" --progress=plain

          set -- "$@" --metadata-file="$metadata_file" -- "$CONTEXT"

          if "$@"; then

            # Later steps address the image through image-ref. A pushed image uses the digest
            # buildx recorded for this build, because the tag can move. A loaded image has no
            # registry digest and cannot be looked up by one, so it stays on its local tag.
            if [ "$PUSH" = "true" ]; then
              digest=$(jq -r '."containerimage.digest" // empty' "$metadata_file")
              if [ -z "$digest" ]; then
                echo "::error::buildx reported no digest for the pushed image"
                exit 1
              fi
              image_ref="${IMAGE_NAME}@${digest}"
            else
              if ! digest=$(docker inspect "$IMAGE_NAME:$TAG" --format='{{.Id}}'); then
                echo "::error::could not read the ID of the loaded image"
                exit 1
              fi
              image_ref="${IMAGE_NAME}:${TAG}"
            fi
            printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
            printf 'image-ref=%s\n' "$image_ref" >> "$GITHUB_OUTPUT"

            # Parse metadata
            if [ -f "$metadata_file" ]; then
              # Use a random delimiter to avoid collision if JSON contains a line equal to the delimiter
              _delim="$(head -c 16 /dev/urandom | base64 | tr -d '=+/\n')"
              {
                printf 'metadata<<%s\n' "$_delim"
                cat "$metadata_file"
                # buildx ends the file without a newline; the delimiter needs a line of its own
                printf '\n%s\n' "$_delim"
              } >> "$GITHUB_OUTPUT"
            fi

            # Calculate build time
            build_end=$(date +%s)
            build_time=$((build_end - build_start))
            printf 'build-time=%s\n' "$build_time" >> "$GITHUB_OUTPUT"

            # Build platform matrix
            # Deliberate split on commas; set -f keeps glob characters literal.
            OLD_IFS="$IFS"
            IFS=','
            set -f
            set -- $platforms
            set +f
            IFS="$OLD_IFS"
            platform_matrix="{"
            for p in "$@"; do
              platform_matrix="${platform_matrix}\"${p}\":\"success\","
            done
            platform_matrix="${platform_matrix%,}}"
            printf 'platform-matrix=%s\n' "$platform_matrix" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          attempt=$((attempt + 1))
          if [ "$attempt" -le "$max_attempts" ]; then
            echo "Build failed, waiting 10 seconds before retry..."
            sleep 10
          else
            echo "::error::Build failed after $max_attempts attempts"
            exit 1
          fi
        done

        # Every attempt above exits, so this runs only when the loop test itself errored. An error
        # there does not trip set -e, and without this the step would pass having built nothing.
        echo "::error::No build attempted: max-retries is not a usable number"
        exit 1

    - name: Scan Image for Vulnerabilities
      id: scan
      if: inputs.scan-image == 'true' && inputs.dry-run != 'true'
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'image'
        image-ref: ${{ steps.build.outputs.image-ref }}
        format: 'json'
        output: 'trivy-results.json'
        severity: 'HIGH,CRITICAL'

    - name: Process Scan Results
      id: scan-output
      if: inputs.scan-image == 'true' && inputs.dry-run != 'true'
      shell: sh
      run: |
        set -eu

        # Read and format scan results for output
        scan_results=$(cat trivy-results.json | jq -c '.')
        printf 'results=%s\n' "$scan_results" >> "$GITHUB_OUTPUT"

        # Check for critical vulnerabilities
        critical_count=$(cat trivy-results.json | jq '.Results[] | (.Vulnerabilities // [])[] | select(.Severity == "CRITICAL") | .VulnerabilityID' | wc -l)
        if [ "$critical_count" -gt 0 ]; then
          echo "::warning::Found $critical_count critical vulnerabilities in image"
        fi

    - name: Install Cosign
      if: inputs.sign-image == 'true' && inputs.push == 'true' && inputs.dry-run != 'true'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Sign Image
      id: sign
      if: inputs.sign-image == 'true' && inputs.push == 'true' && inputs.dry-run != 'true'
      shell: sh
      env:
        IMAGE_NAME: ${{ steps.image-name.outputs.name }}
        IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        set -eu

        # Sign the image (using keyless signing with OIDC)
        export COSIGN_EXPERIMENTAL=1
        cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"

        # Emit the signed image reference so callers know what was signed
        printf 'signature=%s\n' "${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

    - name: Verify Build
      id: verify
      if: inputs.dry-run != 'true'
      shell: sh
      env:
        PUSH: ${{ inputs.push }}
        IMAGE_REF: ${{ steps.build.outputs.image-ref }}
      run: |
        set -eu

        # Verify image exists
        if [ "$PUSH" = "true" ]; then
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq is required to read the platforms of a pushed image"
            exit 1
          fi

          if ! manifest=$(docker buildx imagetools inspect "$IMAGE_REF" --raw); then
            echo "::error::Built image not found"
            exit 1
          fi

          # Get and verify platform support. The index lists each attestation as a manifest
          # with platform unknown/unknown, which is not a platform that was built.
          platforms=$(printf '%s' "$manifest" | jq -r '[.manifests[]? | .platform | select(.os != "unknown") | [.os, .architecture, .variant // empty] | join("/")] | join(",")')
          if [ -z "$platforms" ]; then
            echo "::error::Built image lists no platforms"
            exit 1
          fi
          printf 'built=%s\n' "$platforms" >> "$GITHUB_OUTPUT"
        else
          # For local builds, verify it exists and extract platform
          if ! docker image inspect "$IMAGE_REF" >/dev/null 2>&1; then
            echo "::error::Built image not found locally"
            exit 1
          fi
          platforms=$(docker image inspect --format '{{.Os}}/{{.Architecture}}{{if .Variant}}/{{.Variant}}{{end}}' "$IMAGE_REF")
          printf 'built=%s\n' "$platforms" >> "$GITHUB_OUTPUT"
        fi
