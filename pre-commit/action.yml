# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
# permissions:
#   - contents: write  # Required for pushing fixes back to repository
---
name: pre-commit
description: 'Runs pre-commit on the repository and pushes the fixes back to the repository'
author: 'Ismo Vuorinen'

branding:
  icon: check-square
  color: green

inputs:
  pre-commit-config:
    description: 'pre-commit configuration file (empty: .pre-commit-config.yaml)'
    required: false
    default: '.pre-commit-config.yaml'
  base-branch:
    description: 'Base branch name (for example main); only files changed since it diverged from HEAD are checked, and the full history is fetched'
    required: false
  token:
    description: 'GitHub token for authentication. Only the step that pushes fixes gets it, never git config; run on trusted refs only. Defaults to the workflow token.'
    required: false
    default: ''
  commit_user:
    description: 'Commit user'
    required: false
    default: 'GitHub Actions'
  commit_email:
    description: 'Commit email'
    required: false
    default: 'github-actions@github.com'

outputs:
  hooks_passed:
    description: 'Whether all pre-commit hooks passed (true/false)'
    value: ${{ steps.pre-commit.outcome == 'success' }}
  files_changed:
    description: 'Whether any files were changed by pre-commit hooks'
    value: ${{ steps.push-fixes.outputs.changes_detected || 'false' }}

runs:
  using: composite
  steps:
    - name: Validate Inputs
      shell: sh
      working-directory: ${{ github.action_path }}
      env:
        INPUT_BASE_BRANCH: ${{ inputs.base-branch }}
        INPUT_COMMIT_EMAIL: ${{ inputs.commit_email }}
        INPUT_COMMIT_USER: ${{ inputs.commit_user }}
        INPUT_PRE_COMMIT_CONFIG: ${{ inputs.pre-commit-config }}
        INPUT_TOKEN: ${{ inputs.token }}
      run: |
        set -eu
        if ! command -v python3 >/dev/null 2>&1; then
          echo "::error::python3 is required to validate inputs"
          exit 1
        fi
        python3 validate.py

    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ inputs.token || github.token }}
        # base-branch mode diffs origin/<base>...HEAD, which needs the base branch
        # and the history back to the merge base; the default depth of 1 has neither.
        # Strings, not numbers: the expression returns an operand, and the number 0 is
        # falsy, so `&& 0 || 1` would always give 1.
        fetch-depth: ${{ inputs.base-branch != '' && '0' || '1' }}
        # The token reaches git only in the step that pushes, from that step's environment, so
        # code that runs before it, the hooks among it, finds none in .git/config.
        persist-credentials: false

    # The lock holds the wheels for this Python; the cache key below reads its location.
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.14'

    # The next three steps inline pre-commit/action v3.0.1 instead of using it: its
    # action.yml runs a floating actions/cache tag and an unpinned pip install, so
    # pinning it by SHA would not pin what runs.
    - name: Install pre-commit
      id: install-pre-commit
      shell: sh
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -eu
        # requirements.lock.txt is generated from requirements.in by the command in its header.
        # --only-binary keeps a package's setup.py from running, which hash checking alone does not.
        # -P keeps the checkout off sys.path, so a pip directory in it cannot replace pip.
        command -v python3 >/dev/null 2>&1 || { echo "::error::python3 is required to install pre-commit"; exit 1; }
        python3 -P -m pip install --require-hashes --only-binary=:all: -r "$ACTION_PATH/requirements.lock.txt"
        python3 -P -m pip freeze --local

    # The hook environments run as they are restored. Save pre-commit environments writes them
    # only from a trusted event, as docker-build writes its build cache: a pull_request_target,
    # issue_comment or workflow_run run lints pull-request code under the default branch's cache
    # scope, and a later run there would restore and execute what it saved.
    - name: Restore pre-commit environments
      id: pre-commit-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-3|${{ runner.arch }}|${{ env.pythonLocation }}|${{ hashFiles(inputs.pre-commit-config || '.pre-commit-config.yaml') }}

    - name: Run pre-commit
      id: pre-commit
      shell: sh
      env:
        BASE_BRANCH: ${{ inputs.base-branch }}
        CONFIG_FILE: ${{ inputs.pre-commit-config || '.pre-commit-config.yaml' }}
      run: |
        set -eu

        command -v git >/dev/null 2>&1 || { echo "::error::git is required to run pre-commit"; exit 1; }
        command -v python3 >/dev/null 2>&1 || { echo "::error::python3 is required to run pre-commit"; exit 1; }

        if [ -n "$BASE_BRANCH" ]; then
          # The checkout holds the base branch as origin/<base>, not as a local branch.
          # A value that already names a remote ref, such as origin/main, is used as given,
          # even when a branch actually called origin/main exists too.
          # The remote ref is passed by its full name: git resolves a short origin/main to
          # a tag or a local branch of that name before the remote-tracking branch.
          if [ "${BASE_BRANCH#origin/}" != "$BASE_BRANCH" ] \
            && git rev-parse --verify --quiet "refs/remotes/$BASE_BRANCH" >/dev/null; then
            from_ref="refs/remotes/$BASE_BRANCH"
          elif git rev-parse --verify --quiet "refs/remotes/origin/$BASE_BRANCH" >/dev/null; then
            from_ref="refs/remotes/origin/$BASE_BRANCH"
          elif git rev-parse --verify --quiet --end-of-options "$BASE_BRANCH^{commit}" >/dev/null; then
            from_ref="$BASE_BRANCH"
          else
            echo "::error::base-branch '$BASE_BRANCH' is neither origin/$BASE_BRANCH nor a ref in the checkout"
            exit 1
          fi
          set -- --from-ref "$from_ref" --to-ref HEAD
        else
          set -- --all-files
        fi

        # -m runs the pinned install whatever else is on PATH. -P keeps the checkout off
        # sys.path, so a pre_commit directory in it cannot replace the pinned module.
        status=0
        python3 -P -m pre_commit run --show-diff-on-failure --color=always --config "$CONFIG_FILE" "$@" || status=$?

        # Fixes are pushed only after a run that finished, as eslint-lint commits them. pre-commit
        # exits 1 when a hook failed or changed files, and for a fatal error such as an invalid
        # config, which comes before any hook runs. 3 (an unexpected error) and 130 (an
        # interrupt) can stop a hook halfway, so nothing is pushed then.
        if [ "$status" -eq 0 ] || [ "$status" -eq 1 ]; then
          printf 'finished=%s\n' "true" >> "$GITHUB_OUTPUT"
        fi
        exit "$status"

    # A run that finished has installed every hook environment, whether or not a hook failed.
    - name: Save pre-commit environments
      if: >-
        always() && steps.pre-commit.outputs.finished == 'true' && steps.pre-commit-cache.outputs.cache-hit != 'true'
        && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name)
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pre-commit
        key: ${{ steps.pre-commit-cache.outputs.cache-primary-key }}

    - name: Push pre-commit fixes
      id: push-fixes
      # Also after the hooks failed, which is when they leave fixes to push.
      if: always() && steps.pre-commit.outputs.finished == 'true'
      uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
      env:
        GH_TOKEN: ${{ inputs.token || github.token }}
        # The empty helper drops any configured one, and the next answers git's credential request
        # from this step's environment.
        GIT_CONFIG_COUNT: '2'
        GIT_CONFIG_KEY_0: credential.helper
        GIT_CONFIG_VALUE_0: ''
        GIT_CONFIG_KEY_1: credential.helper
        GIT_CONFIG_VALUE_1: '!f() { test "$1" = get || return 0; echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
      with:
        commit_message: 'style(pre-commit): autofix'
        commit_user_name: ${{ inputs.commit_user }}
        commit_user_email: ${{ inputs.commit_email }}
        add_options: -u
