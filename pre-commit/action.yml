# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
# permissions:
#   - contents: write  # Required for pushing fixes back to repository
---
name: pre-commit
description: 'Runs pre-commit on the repository and pushes the fixes back to the repository'
author: 'Ismo Vuorinen'

branding:
  icon: check-square
  color: green

inputs:
  pre-commit-config:
    description: 'pre-commit configuration file'
    required: false
    default: '.pre-commit-config.yaml'
  base-branch:
    description: 'Base branch name (for example main); only files changed since it diverged from HEAD are checked, and the full history is fetched'
    required: false
  token:
    description: 'GitHub token for authentication'
    required: false
    default: ''
  commit_user:
    description: 'Commit user'
    required: false
    default: 'GitHub Actions'
  commit_email:
    description: 'Commit email'
    required: false
    default: 'github-actions@github.com'

outputs:
  hooks_passed:
    description: 'Whether all pre-commit hooks passed (true/false)'
    value: ${{ steps.pre-commit.outcome == 'success' }}
  files_changed:
    description: 'Whether any files were changed by pre-commit hooks'
    value: ${{ steps.push-fixes.outputs.changes_detected || 'false' }}

runs:
  using: composite
  steps:
    - name: Validate Inputs
      shell: sh
      working-directory: ${{ github.action_path }}
      env:
        INPUT_BASE_BRANCH: ${{ inputs.base-branch }}
        INPUT_COMMIT_EMAIL: ${{ inputs.commit_email }}
        INPUT_COMMIT_USER: ${{ inputs.commit_user }}
        INPUT_PRE_COMMIT_CONFIG: ${{ inputs.pre-commit-config }}
        INPUT_TOKEN: ${{ inputs.token }}
      run: |
        set -eu
        if ! command -v python3 >/dev/null 2>&1; then
          echo "::error::python3 is required to validate inputs"
          exit 1
        fi
        python3 validate.py

    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ inputs.token || github.token }}
        # base-branch mode diffs origin/<base>...HEAD, which needs the base branch
        # and the history back to the merge base; the default depth of 1 has neither.
        # Strings, not numbers: the expression returns an operand, and the number 0 is
        # falsy, so `&& 0 || 1` would always give 1.
        fetch-depth: ${{ inputs.base-branch != '' && '0' || '1' }}
        # git-auto-commit-action pushes the auto-fix commit using the token that
        # actions/checkout persists in .git/config; persist-credentials must stay
        # true or the "Commit Fixes" step cannot authenticate its push.
        persist-credentials: true # zizmor: ignore[artipacked]

    # The next three steps inline pre-commit/action v3.0.1 instead of using it: its
    # action.yml runs a floating actions/cache tag and an unpinned pip install, so
    # pinning it by SHA would not pin what runs.
    - name: Install pre-commit
      id: install-pre-commit
      shell: sh
      env:
        # renovate: datasource=pypi depName=pre-commit
        PRE_COMMIT_VERSION: '4.7.0'
      run: |
        set -eu
        python3 -m pip install "pre-commit==$PRE_COMMIT_VERSION"
        python3 -m pip freeze --local

    - name: Cache pre-commit environments
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-3|${{ runner.arch }}|${{ env.pythonLocation }}|${{ hashFiles(inputs.pre-commit-config) }}

    - name: Run pre-commit
      id: pre-commit
      shell: sh
      env:
        BASE_BRANCH: ${{ inputs.base-branch }}
        CONFIG_FILE: ${{ inputs.pre-commit-config }}
      run: |
        set -eu

        if [ -n "$BASE_BRANCH" ]; then
          # The checkout holds the base branch as origin/<base>, not as a local branch.
          # A value that already names a remote ref, such as origin/main, is used as given,
          # even when a branch actually called origin/main exists too.
          # The remote ref is passed by its full name: git resolves a short origin/main to
          # a tag or a local branch of that name before the remote-tracking branch.
          if [ "${BASE_BRANCH#origin/}" != "$BASE_BRANCH" ] \
            && git rev-parse --verify --quiet "refs/remotes/$BASE_BRANCH" >/dev/null; then
            from_ref="refs/remotes/$BASE_BRANCH"
          elif git rev-parse --verify --quiet "refs/remotes/origin/$BASE_BRANCH" >/dev/null; then
            from_ref="refs/remotes/origin/$BASE_BRANCH"
          elif git rev-parse --verify --quiet --end-of-options "$BASE_BRANCH^{commit}" >/dev/null; then
            from_ref="$BASE_BRANCH"
          else
            echo "::error::base-branch '$BASE_BRANCH' is neither origin/$BASE_BRANCH nor a ref in the checkout"
            exit 1
          fi
          set -- --from-ref "$from_ref" --to-ref HEAD
        else
          set -- --all-files
        fi

        # -m runs the pinned install whatever else is on PATH. -P keeps the checkout off
        # sys.path, so a pre_commit directory in it cannot replace the pinned module.
        python3 -P -m pre_commit run --show-diff-on-failure --color=always --config "$CONFIG_FILE" "$@"

    - name: Push pre-commit fixes
      id: push-fixes
      if: always() && steps.pre-commit.outcome != 'skipped' # Push changes even when pre-commit fails
      uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
      with:
        commit_message: 'style(pre-commit): autofix'
        commit_user_name: ${{ inputs.commit_user }}
        commit_user_email: ${{ inputs.commit_email }}
        add_options: -u
