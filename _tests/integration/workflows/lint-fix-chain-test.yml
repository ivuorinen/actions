---
name: Test Lint & Fix Action Chains
on:
  workflow_dispatch:
  push:
    paths:
      - 'eslint-lint/**'
      - 'prettier-lint/**'
      - '_tests/integration/workflows/lint-fix-chain-test.yml'

permissions: {}

jobs:
  test-eslint-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create test JavaScript files
        run: |
          set -eu
          mkdir -p test-project/src

          # Create package.json
          cat > test-project/package.json <<EOF
          {
            "name": "test-project",
            "version": "1.0.0",
            "devDependencies": {
              "eslint": "^8.0.0"
            }
          }
          EOF

          # Create .eslintrc.json
          cat > test-project/.eslintrc.json <<EOF
          {
            "env": {
              "node": true,
              "es2021": true
            },
            "extends": "eslint:recommended",
            "parserOptions": {
              "ecmaVersion": 12
            },
            "rules": {
              "semi": ["error", "always"],
              "quotes": ["error", "single"]
            }
          }
          EOF

          # Create test file with linting issues
          cat > test-project/src/test.js <<EOF
          const x = "double quotes"
          console.log(x)
          EOF

      - name: Test eslint-lint check mode (should find errors)
        id: eslint-check
        uses: ./eslint-lint
        with:
          mode: 'check'
          working-directory: './test-project'
        continue-on-error: true

      - name: Validate eslint-lint check found issues
        env:
          CHECK_OUTCOME: ${{ steps.eslint-check.outcome }}
          ERROR_COUNT: ${{ steps.eslint-check.outputs.error-count }}
          WARNING_COUNT: ${{ steps.eslint-check.outputs.warning-count }}
        run: |
          set -eu
          echo "ESLint check outcome: $CHECK_OUTCOME"
          echo "Error count: $ERROR_COUNT"
          echo "Warning count: $WARNING_COUNT"

          # Check should fail or find issues
          if [[ "$CHECK_OUTCOME" == "success" ]]; then
            if [[ "$ERROR_COUNT" == "0" ]]; then
              echo "⚠️  WARNING: Expected to find linting errors but found none"
            fi
          fi

          echo "✅ ESLint check validated"

      - name: Test eslint-lint fix mode (should fix issues)
        id: eslint-fix
        uses: ./eslint-lint
        with:
          mode: 'fix'
          working-directory: './test-project'
          token: ${{ github.token }}
          email: 'test@example.com'
          username: 'test-user'

      - name: Validate eslint-lint fix ran
        env:
          ERRORS_FIXED: ${{ steps.eslint-fix.outputs.errors-fixed }}
          FILES_CHANGED: ${{ steps.eslint-fix.outputs.files-changed }}
        run: |
          set -eu
          echo "Errors fixed: $ERRORS_FIXED"
          echo "Files changed: $FILES_CHANGED"

          # Check that fixes were attempted
          if [[ -n "$ERRORS_FIXED" ]]; then
            echo "✅ ESLint fixed $ERRORS_FIXED issues"
          else
            echo "⚠️  No fix count reported (may be expected if no fixable issues)"
          fi

          echo "✅ ESLint fix validated"

  test-prettier-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create test files for Prettier
        run: |
          set -eu
          mkdir -p test-prettier

          # Create package.json
          cat > test-prettier/package.json <<EOF
          {
            "name": "test-prettier",
            "version": "1.0.0",
            "devDependencies": {
              "prettier": "^3.0.0"
            }
          }
          EOF

          # Create .prettierrc
          cat > test-prettier/.prettierrc <<EOF
          {
            "semi": true,
            "singleQuote": true,
            "printWidth": 80
          }
          EOF

          # Create badly formatted file
          cat > test-prettier/test.js <<EOF
          const x={"key":"value","another":"data"}
          console.log(x)
          EOF

          # Create badly formatted JSON
          cat > test-prettier/test.json <<EOF
          {"key":"value","nested":{"data":"here"}}
          EOF

      - name: Test prettier-lint check mode (should find issues)
        id: prettier-check
        uses: ./prettier-lint
        with:
          mode: 'check'
          working-directory: './test-prettier'
        continue-on-error: true

      - name: Validate prettier-check found issues
        env:
          CHECK_OUTCOME: ${{ steps.prettier-check.outcome }}
        run: |
          set -eu
          echo "Prettier check outcome: $CHECK_OUTCOME"

          # Check should find formatting issues
          if [[ "$CHECK_OUTCOME" == "failure" ]]; then
            echo "✅ Prettier correctly found formatting issues"
          else
            echo "⚠️  WARNING: Expected Prettier to find formatting issues"
          fi

      - name: Test prettier-lint fix mode (should fix issues)
        id: prettier-fix
        uses: ./prettier-lint
        with:
          mode: 'fix'
          working-directory: './test-prettier'
          token: ${{ github.token }}
          email: 'test@example.com'
          username: 'test-user'

      - name: Validate prettier-lint fix ran
        run: |
          set -eu
          echo "Prettier fix completed"

          # Check that files exist and have been processed
          if [[ -f "test-prettier/test.js" ]]; then
            echo "✅ Test file exists after Prettier fix"
          else
            echo "❌ ERROR: Test file missing after Prettier fix"
            exit 1
          fi

          echo "✅ Prettier fix validated"

  test-action-chain-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create comprehensive test project
        run: |
          set -eu
          mkdir -p test-chain/src

          # Create package.json with both ESLint and Prettier
          cat > test-chain/package.json <<EOF
          {
            "name": "test-chain",
            "version": "1.0.0",
            "devDependencies": {
              "eslint": "^8.0.0",
              "prettier": "^3.0.0"
            }
          }
          EOF

          # Create .eslintrc.json
          cat > test-chain/.eslintrc.json <<EOF
          {
            "env": {
              "node": true,
              "es2021": true
            },
            "extends": "eslint:recommended",
            "parserOptions": {
              "ecmaVersion": 12
            },
            "rules": {
              "semi": ["error", "always"],
              "quotes": ["error", "single"]
            }
          }
          EOF

          # Create .prettierrc
          cat > test-chain/.prettierrc <<EOF
          {
            "semi": true,
            "singleQuote": true,
            "printWidth": 80
          }
          EOF

          # Create test file with both linting and formatting issues
          cat > test-chain/src/app.js <<EOF
          const message="hello world"
          function greet(){console.log(message)}
          greet()
          EOF

      - name: Run ESLint check
        id: lint-check
        uses: ./eslint-lint
        with:
          mode: 'check'
          working-directory: './test-chain'
        continue-on-error: true

      - name: Run Prettier check
        id: format-check
        uses: ./prettier-lint
        with:
          mode: 'check'
          working-directory: './test-chain'
        continue-on-error: true

      - name: Run ESLint fix
        id: lint-fix
        uses: ./eslint-lint
        with:
          mode: 'fix'
          working-directory: './test-chain'
          token: ${{ github.token }}
          email: 'test@example.com'
          username: 'test-user'

      - name: Run Prettier fix
        id: format-fix
        uses: ./prettier-lint
        with:
          mode: 'fix'
          working-directory: './test-chain'
          token: ${{ github.token }}
          email: 'test@example.com'
          username: 'test-user'

      - name: Validate complete chain
        env:
          LINT_CHECK: ${{ steps.lint-check.outcome }}
          FORMAT_CHECK: ${{ steps.format-check.outcome }}
          LINT_FIX: ${{ steps.lint-fix.outcome }}
          FORMAT_FIX: ${{ steps.format-fix.outcome }}
        run: |
          set -eu
          echo "=== Action Chain Results ==="
          echo "Lint Check: $LINT_CHECK"
          echo "Format Check: $FORMAT_CHECK"
          echo "Lint Fix: $LINT_FIX"
          echo "Format Fix: $FORMAT_FIX"

          # Validate that all steps ran. Not ((steps_run++)): it returns 1 when the count was 0,
          # and the step's bash -e stops on that.
          steps_run=0
          for outcome in "$LINT_CHECK" "$FORMAT_CHECK" "$LINT_FIX" "$FORMAT_FIX"; do
            if [[ "$outcome" != "skipped" ]]; then
              steps_run=$((steps_run + 1))
            fi
          done

          if [[ $steps_run -eq 4 ]]; then
            echo "✅ Complete action chain executed successfully"
          else
            echo "❌ ERROR: Not all steps in chain executed (ran: $steps_run/4)"
            exit 1
          fi

          echo "✅ Action chain integration validated"
