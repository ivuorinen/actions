---
name: Integration Test - NPM Publish
on:
  workflow_dispatch:
  push:
    paths:
      - 'npm-publish/**'
      - '_tests/integration/workflows/npm-publish-test.yml'

# A run here publishes with a placeholder token, so it always fails at the publish step, and
# its outcome cannot tell a validation failure from that one. _tests/unit/npm-publish/
# validation.spec.sh tests the inputs against validate.py; this workflow checks only what a
# failed run still shows, the outputs.
permissions: {}

jobs:
  test-npm-publish-outputs:
    name: Test Output Values
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create test package
        run: |
          set -eu
          mkdir -p test-outputs
          cd test-outputs
          cat > package.json <<'EOF'
          {
            "name": "@test/outputs-test",
            "version": "1.5.0",
            "description": "Test outputs"
          }
          EOF

      - name: Run npm-publish
        id: publish-outputs
        uses: ./npm-publish
        continue-on-error: true
        with:
          registry-url: 'https://npm.example.invalid/'
          scope: '@custom-scope'
          package-version: '1.5.0'
          npm_token: 'test-token-outputs'
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}/test-outputs

      - name: Verify outputs
        env:
          REGISTRY: ${{ steps.publish-outputs.outputs.registry-url }}
          SCOPE: ${{ steps.publish-outputs.outputs.scope }}
          VERSION: ${{ steps.publish-outputs.outputs.package-version }}
        run: |
          set -eu
          echo "Registry URL: $REGISTRY"
          echo "Scope: $SCOPE"
          echo "Version: $VERSION"

          # Verify output values match inputs
          if [[ "$REGISTRY" != "https://npm.example.invalid/" ]]; then
            echo "❌ ERROR: Registry URL output mismatch"
            exit 1
          fi

          if [[ "$SCOPE" != "@custom-scope" ]]; then
            echo "❌ ERROR: Scope output mismatch"
            exit 1
          fi

          if [[ "$VERSION" != "1.5.0" ]]; then
            echo "❌ ERROR: Version output mismatch"
            exit 1
          fi

          echo "✓ All outputs match expected values"
