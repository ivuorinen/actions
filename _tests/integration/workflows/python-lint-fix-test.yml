---
name: Integration Test - Python Lint Fix
on:
  workflow_dispatch:
  push:
    paths:
      - 'python-lint-fix/**'
      - '_tests/integration/workflows/python-lint-fix-test.yml'

permissions:
  contents: read

jobs:
  test-fixer-runs-when-lint-fails:
    name: Test Fixer Runs When Lint Fails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@71cf2267d89c5cb81562390fa70a37fa40b1305e # v6-beta

      - name: Create test Python file with style issues
        run: |
          mkdir -p test-project
          printf 'x=1\nprint( x )\n' > test-project/sample.py

      - name: Run python-lint-fix with fail-on-error
        id: lint-fix
        uses: ./python-lint-fix
        continue-on-error: true
        with:
          working-directory: './test-project'
          fail-on-error: 'true'

      - name: Verify the fixer ran and the action still failed
        env:
          LINT_RESULT: ${{ steps.lint-fix.outputs.lint-result }}
          FIXED_FILES: ${{ steps.lint-fix.outputs.fixed-files }}
          OUTCOME: ${{ steps.lint-fix.outcome }}
        run: |
          set -eu
          [ "$LINT_RESULT" = "failure" ] || { echo "::error::lint-result was '$LINT_RESULT'"; exit 1; }
          [ "$FIXED_FILES" -ge 1 ] || { echo "::error::fixer did not run, fixed-files was '$FIXED_FILES'"; exit 1; }
          [ "$OUTCOME" = "failure" ] || { echo "::error::action outcome was '$OUTCOME'"; exit 1; }
          echo "Fixer ran after lint failure and the action failed as requested"
