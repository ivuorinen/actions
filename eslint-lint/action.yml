# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
# permissions:
#   - contents: write         # Required for fix mode to push changes
#   - security-events: write  # Required for check mode to upload SARIF
---
name: ESLint Lint
description: 'Run ESLint in check or fix mode with advanced configuration and reporting'
author: Ismo Vuorinen

branding:
  icon: check-circle
  color: blue

inputs:
  mode:
    description: 'Mode to run: check or fix (empty: check)'
    required: false
    default: 'check'
  working-directory:
    description: 'Directory containing files to lint'
    required: false
    default: '.'
  eslint-version:
    description: >-
      ESLint version to run when the repository has no copy of its own. Empty: the version in this action's
      package-lock.json, installed with its whole dependency tree locked. A version or "latest": installed from the
      registry without lifecycle scripts, with its dependencies unlocked.
    required: false
    default: ''
  config-file:
    description: 'Path to ESLint config file (a path other than the default must exist)'
    required: false
    default: '.eslintrc'
  file-extensions:
    description: 'File extensions to lint (comma-separated)'
    required: false
    default: '.js,.jsx,.ts,.tsx'
  cache:
    description: 'Enable ESLint caching (lowercase true or false)'
    required: false
    default: 'true'
  max-warnings:
    description: 'Maximum number of warnings allowed (check mode only)'
    required: false
    default: '0'
  fail-on-error:
    description: 'Fail the workflow when issues are found; a run that could not lint fails either way (check mode only; lowercase true or false)'
    required: false
    default: 'true'
  report-format:
    description: 'Output format for check mode (stylish, json, sarif)'
    required: false
    default: 'sarif'
  max-retries:
    description: >-
      Deprecated: has no effect, because the action does not retry its installs. A value set here must still be a
      number from 1 to 10.
    deprecationMessage: 'This input has no effect. eslint-lint does not retry its installs.'
    required: false
    default: '3'
  token:
    description: 'GitHub token for authentication. Stays in git config after checkout in fix mode only. Defaults to the workflow token.'
    required: false
    default: ''
  username:
    description: 'GitHub username for commits (fix mode only)'
    required: false
    default: 'github-actions'
  email:
    description: 'GitHub email for commits (fix mode only)'
    required: false
    default: 'github-actions@github.com'

outputs:
  status:
    description: 'Overall status (success/failure)'
    value: ${{ steps.check.outputs.status || steps.fix.outputs.status || steps.ensure-eslint.outputs.status }}
  error-count:
    description: 'Number of errors found (check mode only)'
    value: ${{ steps.check.outputs.error_count }}
  warning-count:
    description: 'Number of warnings found (check mode only)'
    value: ${{ steps.check.outputs.warning_count }}
  sarif-file:
    description: 'Path to SARIF report file (check mode only)'
    value: ${{ steps.check.outputs.sarif_file }}
  files-checked:
    description: 'Number of files ESLint linted (check mode with the sarif report only; 0 otherwise)'
    # The check step does not run in fix mode, and a skipped step's output is empty.
    value: ${{ steps.check.outputs.files_checked || '0' }}
  files-changed:
    description: 'Number of files changed (fix mode only)'
    value: ${{ steps.fix.outputs.files_changed }}
  errors-fixed:
    description: 'Number of errors fixed (fix mode only)'
    value: ${{ steps.fix.outputs.errors_fixed }}

runs:
  using: composite
  steps:
    - name: Validate Inputs
      shell: sh
      working-directory: ${{ github.action_path }}
      env:
        INPUT_CACHE: ${{ inputs.cache }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_EMAIL: ${{ inputs.email }}
        INPUT_ESLINT_VERSION: ${{ inputs.eslint-version }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        INPUT_FILE_EXTENSIONS: ${{ inputs.file-extensions }}
        INPUT_MAX_RETRIES: ${{ inputs.max-retries }}
        INPUT_MAX_WARNINGS: ${{ inputs.max-warnings }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_REPORT_FORMAT: ${{ inputs.report-format }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -eu
        if ! command -v python3 >/dev/null 2>&1; then
          echo "::error::python3 is required to validate inputs"
          exit 1
        fi
        python3 validate.py

    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ inputs.token || github.token }}
        # Only fix mode pushes; git-auto-commit-action authenticates with the
        # credentials actions/checkout leaves in git config.
        persist-credentials: ${{ inputs.mode == 'fix' }}

    - name: Detect Package Manager
      id: detect-pm
      shell: sh
      run: |
        set -eu

        # Detect package manager from lockfiles
        if [ -f bun.lock ] || [ -f bun.lockb ]; then
          package_manager="bun"
        elif [ -f pnpm-lock.yaml ]; then
          package_manager="pnpm"
        elif [ -f yarn.lock ]; then
          package_manager="yarn"
        else
          package_manager="npm"
        fi

        printf 'package-manager=%s\n' "$package_manager" >> "$GITHUB_OUTPUT"
        echo "Detected package manager: $package_manager"

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'

    - name: Enable Corepack
      shell: sh
      run: |
        set -eu
        command -v corepack >/dev/null 2>&1 || { echo "::error::corepack is required to enable the package manager"; exit 1; }
        corepack enable

    - name: Install Package Manager
      id: install-pm
      shell: sh
      env:
        PACKAGE_MANAGER: ${{ steps.detect-pm.outputs.package-manager }}
        # renovate: datasource=npm depName=pnpm
        PNPM_VERSION: '12.18.0'
        # renovate: datasource=npm depName=@yarnpkg/cli-dist
        YARN_VERSION: '4.18.1'
      run: |
        set -eu

        case "$PACKAGE_MANAGER" in
          pnpm)
            command -v corepack >/dev/null 2>&1 || { echo "::error::corepack is required to install pnpm"; exit 1; }
            corepack prepare "pnpm@$PNPM_VERSION" --activate
            ;;
          yarn)
            command -v corepack >/dev/null 2>&1 || { echo "::error::corepack is required to install Yarn"; exit 1; }
            corepack prepare "yarn@$YARN_VERSION" --activate
            ;;
          bun|npm)
            # Bun installed separately, npm built-in
            ;;
        esac

    - name: Setup Bun
      if: steps.detect-pm.outputs.package-manager == 'bun'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      env:
        # renovate: datasource=github-releases depName=oven-sh/bun extractVersion=^bun-v(?<version>.+)$
        BUN_VERSION: '1.4.4'
      with:
        bun-version: ${{ env.BUN_VERSION }}

    - name: Cache Node Dependencies
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: ${{ runner.os }}-eslint-lint-${{ inputs.mode }}-${{ steps.detect-pm.outputs.package-manager }}-${{ hashFiles('package-lock.json', 'yarn.lock', 'pnpm-lock.yaml', 'bun.lock*') }}
        restore-keys: |
          ${{ runner.os }}-eslint-lint-${{ inputs.mode }}-${{ steps.detect-pm.outputs.package-manager }}-
          ${{ runner.os }}-eslint-lint-${{ inputs.mode }}-

    - name: Install Dependencies
      id: install-deps
      if: steps.cache.outputs.cache-hit != 'true'
      shell: sh
      env:
        PACKAGE_MANAGER: ${{ steps.detect-pm.outputs.package-manager }}
      run: |
        set -eu

        echo "Installing dependencies using $PACKAGE_MANAGER..."

        case "$PACKAGE_MANAGER" in
          "pnpm")
            command -v pnpm >/dev/null 2>&1 || { echo "::error::pnpm is required to install dependencies"; exit 1; }
            pnpm install --frozen-lockfile
            ;;
          "yarn")
            command -v yarn >/dev/null 2>&1 || { echo "::error::yarn is required to install dependencies"; exit 1; }
            # The running Yarn decides the flag, as in Ensure ESLint: a Yarn 2+ project needs no .yarnrc.yml.
            case "$(yarn --version)" in
              1.*) yarn install --frozen-lockfile ;;
              *) yarn install --immutable ;;
            esac
            ;;
          "bun")
            command -v bun >/dev/null 2>&1 || { echo "::error::bun is required to install dependencies"; exit 1; }
            bun install --frozen-lockfile
            ;;
          "npm"|*)
            # A repository with no package.json has nothing to install, and npm ci would fail
            # for it; ESLint then comes from this action's lockfile.
            if [ ! -f package.json ]; then
              echo "No package.json: no dependencies to install"
              exit 0
            fi
            command -v npm >/dev/null 2>&1 || { echo "::error::npm is required to install dependencies"; exit 1; }
            npm ci
            ;;
        esac

        echo "✅ Dependencies installed successfully"

    - name: Ensure ESLint
      id: ensure-eslint
      shell: sh
      working-directory: ${{ inputs.working-directory }}
      env:
        ACTION_PATH: ${{ github.action_path }}
        CONFIG_FILE: ${{ inputs.config-file }}
        PACKAGE_MANAGER: ${{ steps.detect-pm.outputs.package-manager }}
        REPORT_FORMAT: ${{ inputs.report-format }}
        REQUESTED_VERSION: ${{ inputs.eslint-version }}
      run: |
        set -eu

        # However this step fails, it writes status=failure, which the action's status output
        # falls back to when neither check nor fix mode runs after it.
        failure_status() {
          printf 'status=%s\n' "failure" >> "$GITHUB_OUTPUT"
        }
        trap '[ "$?" -eq 0 ] || failure_status' EXIT

        # A config file other than the default must be there, for check and fix mode alike,
        # rather than ESLint linting with whatever configuration it finds instead.
        if [ -n "$CONFIG_FILE" ] && [ "$CONFIG_FILE" != ".eslintrc" ] && [ ! -f "$CONFIG_FILE" ]; then
          echo "::error::config-file $CONFIG_FILE does not exist"
          exit 1
        fi

        command -v jq >/dev/null 2>&1 || { echo "::error::jq is required to read package.json"; exit 1; }

        # The repository's own copy wins: its config and plugins are written for it. Running the
        # tool cannot tell, because npx --no-install and pnpm exec also find a global install, so
        # ownership is read from node_modules, or from package.json for Yarn Plug'n'Play, which has
        # none, here and in each parent up to the checkout: Node resolves packages through those,
        # so a working directory below the project root still has the root's copy.
        # owns sets found_in to node_modules or package.json, saying how it found the copy,
        # found_dir to the directory it found it in, and manifest_dir to the nearest directory
        # with a package.json, whose package Yarn 2 and later resolve binaries for.
        owns() {
          _dir=$PWD
          manifest_dir=
          while :; do
            found_dir=$_dir
            if [ -z "$manifest_dir" ] && [ -f "$_dir/package.json" ]; then
              manifest_dir=$_dir
            fi
            if [ -d "$_dir/node_modules/$1" ]; then
              found_in=node_modules
              return 0
            fi
            if [ -f "$_dir/package.json" ] && jq -e --arg name "$1" \
              '(.dependencies // {}) + (.devDependencies // {}) | has($name)' "$_dir/package.json" >/dev/null; then
              found_in=package.json
              return 0
            fi
            case "$_dir" in "${GITHUB_WORKSPACE:-$PWD}" | /) return 1 ;; esac
            _dir=$(dirname -- "$_dir")
          done
        }

        if owns eslint; then
          # None of these fetches a package, so a copy that is not installed fails the run. Yarn 2
          # and later run a package.json script before a binary of the same name, so they are told
          # to run the binary. They only see binaries of the nearest package's own dependencies,
          # so a copy that the root workspace declares for a child one is run with --top-level,
          # which resolves it from the root and still runs it in this directory. Yarn 1 cannot
          # skip the script: a node_modules install runs through npx --no-install instead, and a
          # Plug'n'Play one, which that cannot load, through Yarn as before.
          case "$PACKAGE_MANAGER" in
            "pnpm")
              command -v pnpm >/dev/null 2>&1 || { echo "::error::pnpm is required to run ESLint"; exit 1; }
              set -- pnpm exec eslint
              ;;
            "yarn")
              command -v yarn >/dev/null 2>&1 || { echo "::error::yarn is required to run ESLint"; exit 1; }
              case "$(yarn --version)" in
                1.*)
                  if [ "$found_in" = node_modules ]; then
                    command -v npx >/dev/null 2>&1 || { echo "::error::running ESLint requires npx"; exit 1; }
                    set -- npx --no-install eslint
                  else
                    set -- yarn eslint
                  fi
                  ;;
                *)
                  if [ -n "$manifest_dir" ] && [ "$found_dir" != "$manifest_dir" ]; then
                    set -- yarn run --top-level --binaries-only eslint
                  else
                    set -- yarn run --binaries-only eslint
                  fi
                  ;;
              esac
              ;;
            "bun")
              command -v bunx >/dev/null 2>&1 || { echo "::error::running ESLint requires bunx"; exit 1; }
              set -- bunx --no-install eslint
              ;;
            "npm"|*)
              command -v npx >/dev/null 2>&1 || { echo "::error::running ESLint requires npx"; exit 1; }
              set -- npx --no-install eslint
              ;;
          esac
        else
          set --
        fi
        printf 'command=%s\n' "$*" >> "$GITHUB_OUTPUT"

        # What the repository lacks comes from this action's package-lock.json: npm ci installs
        # each package of the tree at its locked version and integrity hash, with no lifecycle
        # scripts. It goes to a prefix of its own, outside the checkout, and runs by path, so no
        # other copy on PATH can stand in for it. Each prefix is a new directory under RUNNER_TEMP,
        # which the runner empties between jobs except for files it cannot delete, so nothing an
        # earlier job left there, such as an .npmrc npm reads from the prefix, takes part. The
        # same locked install as prettier-lint's and biome-lint's: each action is self-contained.
        # Unlike theirs, it is a function: the SARIF formatter below needs it even when the
        # repository has its own ESLint.
        locked=
        install_locked() {
          if [ -z "$locked" ]; then
            command -v npm >/dev/null 2>&1 || { echo "::error::npm is required to install ESLint"; exit 1; }
            command -v mktemp >/dev/null 2>&1 || { echo "::error::mktemp is required to create the install prefix"; exit 1; }
            tools=$(mktemp -d "$RUNNER_TEMP/eslint-lint-tools.XXXXXX")
            cp "$ACTION_PATH/package.json" "$ACTION_PATH/package-lock.json" "$tools/"
            npm ci --prefix "$tools" --ignore-scripts --no-audit --no-fund
            locked=yes
          fi
        }

        bin=
        if [ -z "$*" ]; then
          # The validator reads a version of only spaces as left out, and so does this step;
          # npm would read it as any version.
          case "$REQUESTED_VERSION" in *[![:space:]]*) ;; *) REQUESTED_VERSION= ;; esac
          if [ -n "$REQUESTED_VERSION" ]; then
            # A version the caller names is not in the lockfile: it comes from the registry
            # without lifecycle scripts, and its dependencies resolve to whatever their ranges allow.
            command -v npm >/dev/null 2>&1 || { echo "::error::npm is required to install ESLint"; exit 1; }
            command -v mktemp >/dev/null 2>&1 || { echo "::error::mktemp is required to create the install prefix"; exit 1; }
            requested=$(mktemp -d "$RUNNER_TEMP/eslint-lint-requested.XXXXXX")
            npm install --prefix "$requested" --no-package-lock --no-audit --no-fund --ignore-scripts \
              "eslint@$REQUESTED_VERSION"
            bin="$requested/node_modules/.bin/eslint"
          else
            install_locked
            bin="$tools/node_modules/.bin/eslint"
          fi
          [ -x "$bin" ] || { echo "::error::eslint is not at $bin after its install"; exit 1; }
          version=$("$bin" --version) || { echo "::error::eslint at $bin does not run"; exit 1; }
          printf 'Running ESLint %s from %s\n' "$version" "$bin"
        fi
        printf 'bin=%s\n' "$bin" >> "$GITHUB_OUTPUT"

        # ESLint loads a formatter named as a package from the working directory, which the
        # action's prefix is outside of and Plug'n'Play limits to declared dependencies. A path it
        # loads as is, so a formatter the repository does not have comes from the lockfile too.
        formatter="@microsoft/eslint-formatter-sarif"
        if [ "$REPORT_FORMAT" = "sarif" ] && ! owns "$formatter"; then
          install_locked
          dir="$tools/node_modules/$formatter"
          formatter="$dir/$(jq -r '.main // "index.js"' "$dir/package.json")"
        fi
        printf 'formatter=%s\n' "$formatter" >> "$GITHUB_OUTPUT"

    - name: Run ESLint Check
      if: (inputs.mode || 'check') == 'check'
      id: check
      shell: sh
      working-directory: ${{ inputs.working-directory }}
      env:
        ESLINT_BIN: ${{ steps.ensure-eslint.outputs.bin }}
        ESLINT_COMMAND: ${{ steps.ensure-eslint.outputs.command }}
        SARIF_FORMATTER: ${{ steps.ensure-eslint.outputs.formatter }}
        CONFIG_FILE: ${{ inputs.config-file }}
        CACHE: ${{ inputs.cache }}
        MAX_WARNINGS: ${{ inputs.max-warnings }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        REPORT_FORMAT: ${{ inputs.report-format }}
        FILE_EXTENSIONS: ${{ inputs.file-extensions }}
      run: |
        set -eu

        echo "Running ESLint check mode..."

        # A report already in the checkout is not this run's result. For a SARIF run, remove it so
        # the counts and the upload below see only a report this run wrote, or none. Other
        # formats never read the file, so it stays. A directory by that name fails the step.
        if [ "$REPORT_FORMAT" = "sarif" ]; then
          rm -f eslint-results.sarif
        fi

        # The copy this action installed runs by its path, which may hold spaces. ESLINT_COMMAND,
        # the repository's own copy through its package manager, is several words, so it is split
        # on purpose.
        set -f
        if [ -n "$ESLINT_BIN" ]; then
          set -- "$ESLINT_BIN" . --ext "$FILE_EXTENSIONS"
        else
          set -- $ESLINT_COMMAND . --ext "$FILE_EXTENSIONS"
        fi

        # A config file other than the default is passed on; the ensure step has made sure it is
        # there.
        if [ -n "$CONFIG_FILE" ] && [ "$CONFIG_FILE" != ".eslintrc" ]; then
          set -- "$@" --config "$CONFIG_FILE"
        fi

        # Add cache option
        if [ "$CACHE" = "true" ]; then
          set -- "$@" --cache
        fi

        # Add max warnings
        set -- "$@" --max-warnings "$MAX_WARNINGS"

        # Add format
        if [ "$REPORT_FORMAT" = "sarif" ]; then
          set -- "$@" --format "$SARIF_FORMATTER" --output-file eslint-results.sarif
        else
          set -- "$@" --format "$REPORT_FORMAT"
        fi

        # Run ESLint and capture exit code
        eslint_exit_code=0
        "$@" || eslint_exit_code=$?

        # Exit status 1 means lint problems, which fail-on-error decides about. Any other, such as
        # 2 for a bad configuration or a crash, means ESLint did not lint, so the step fails
        # either way, with no counts and no report to upload: an incomplete one would close the
        # alerts of the issues it did not see.
        if [ "$eslint_exit_code" -gt 1 ]; then
          echo "::error::ESLint failed with exit status $eslint_exit_code"
          printf 'status=%s\n' "failure" >> "$GITHUB_OUTPUT"
          exit "$eslint_exit_code"
        fi

        # Parse results
        if [ "$REPORT_FORMAT" = "sarif" ] && [ -f eslint-results.sarif ]; then
          command -v jq >/dev/null 2>&1 || {
            echo "::error::jq is required to read the SARIF report"
            printf 'status=%s\n' "failure" >> "$GITHUB_OUTPUT"
            exit 1
          }
          error_count=$(jq '[.runs[]?.results[]? | select(.level == "error")] | length' eslint-results.sarif 2>/dev/null || echo "0")
          warning_count=$(jq '[.runs[]?.results[]? | select(.level == "warning")] | length' eslint-results.sarif 2>/dev/null || echo "0")
          # The SARIF formatter lists every linted file under artifacts, with or without findings;
          # results name only the files that have one.
          files_checked=$(jq '[.runs[]?.artifacts[]?] | length' eslint-results.sarif 2>/dev/null || echo "0")
          sarif_file="eslint-results.sarif"
        else
          error_count="0"
          warning_count="0"
          files_checked="0"
          sarif_file=""
        fi

        # Set outputs
        if [ "$eslint_exit_code" -eq 0 ]; then
          printf 'status=%s\n' "success" >> "$GITHUB_OUTPUT"
        else
          printf 'status=%s\n' "failure" >> "$GITHUB_OUTPUT"
        fi

        printf 'error_count=%s\n' "$error_count" >> "$GITHUB_OUTPUT"
        printf 'warning_count=%s\n' "$warning_count" >> "$GITHUB_OUTPUT"
        printf 'files_checked=%s\n' "$files_checked" >> "$GITHUB_OUTPUT"
        printf 'sarif_file=%s\n' "$sarif_file" >> "$GITHUB_OUTPUT"

        echo "✅ ESLint check completed: $error_count errors, $warning_count warnings"

        if [ "$FAIL_ON_ERROR" = "true" ]; then
          exit "$eslint_exit_code"
        fi

    # Only a report the check step wrote: when an earlier step fails, the check step is skipped,
    # so a report already in the checkout was never removed.
    - name: Upload SARIF Report
      if: always() && (inputs.mode || 'check') == 'check' && inputs.report-format == 'sarif' && steps.check.outputs.sarif_file != ''
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: ${{ inputs.working-directory }}/eslint-results.sarif

    - name: Run ESLint Fix
      if: inputs.mode == 'fix'
      id: fix
      shell: sh
      working-directory: ${{ inputs.working-directory }}
      env:
        ESLINT_BIN: ${{ steps.ensure-eslint.outputs.bin }}
        ESLINT_COMMAND: ${{ steps.ensure-eslint.outputs.command }}
        CONFIG_FILE: ${{ inputs.config-file }}
        FILE_EXTENSIONS: ${{ inputs.file-extensions }}
      run: |
        set -eu

        echo "Running ESLint fix mode..."

        command -v git >/dev/null 2>&1 || {
          echo "::error::git is required to count the files ESLint changes"
          printf 'status=%s\n' "failure" >> "$GITHUB_OUTPUT"
          exit 1
        }

        # The same command and config file as check mode: by path for the copy this action
        # installed, split on purpose for the repository's own.
        set -f
        if [ -n "$ESLINT_BIN" ]; then
          set -- "$ESLINT_BIN" . --ext "$FILE_EXTENSIONS" --fix
        else
          set -- $ESLINT_COMMAND . --ext "$FILE_EXTENSIONS" --fix
        fi
        if [ -n "$CONFIG_FILE" ] && [ "$CONFIG_FILE" != ".eslintrc" ]; then
          set -- "$@" --config "$CONFIG_FILE"
        fi

        # Fix mode commits what the tool fixed only when its exit status shows the run finished,
        # as biome-lint does. Exit status 1 means problems remain that --fix could not fix; what
        # it fixed is still committed. Any other failure, such as 2 for a bad configuration or a
        # crash, means ESLint fixed nothing it can vouch for, so the step fails. Biome exits 1 for
        # both cases, so biome-lint's fix mode fails on any non-zero status.
        eslint_exit_code=0
        "$@" || eslint_exit_code=$?
        if [ "$eslint_exit_code" -gt 1 ]; then
          echo "::error::ESLint failed with exit status $eslint_exit_code"
          printf 'status=%s\n' "failure" >> "$GITHUB_OUTPUT"
          exit "$eslint_exit_code"
        fi

        # Count only files actually modified by ESLint
        files_changed=$(git diff --name-only | wc -l | tr -d ' ')

        # Get number of errors fixed (approximate from diff)
        errors_fixed=$(git diff --numstat | wc -l | tr -d ' ')

        printf 'files_changed=%s\n' "$files_changed" >> "$GITHUB_OUTPUT"
        printf 'errors_fixed=%s\n' "$errors_fixed" >> "$GITHUB_OUTPUT"
        printf 'status=%s\n' "success" >> "$GITHUB_OUTPUT"

        echo "✅ ESLint fix completed. Files changed: $files_changed, Errors fixed: $errors_fixed"

    - name: Commit and Push Fixes
      if: inputs.mode == 'fix' && success()
      uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
      with:
        commit_message: 'style: autofix ESLint violations'
        commit_user_name: ${{ inputs.username }}
        commit_user_email: ${{ inputs.email }}
        add_options: '-u'
