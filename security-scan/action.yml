# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
#
# REQUIRED PERMISSIONS (set these in your workflow file):
#   permissions:
#     security-events: write  # Required for SARIF uploads
#     contents: read          # Required for repository access
#
---
name: Security Scan
description: |
  Comprehensive security scanning for GitHub Actions including actionlint,
  Gitleaks (optional), and Trivy vulnerability scanning. Requires
  'security-events: write' and 'contents: read' permissions in the workflow.
author: Ismo Vuorinen
branding:
  icon: shield
  color: red

inputs:
  gitleaks-license:
    description: 'Gitleaks license key (required for Gitleaks scanning)'
    required: false
    default: ''
  gitleaks-config:
    description: 'Path to Gitleaks config file. If missing, Gitleaks uses a root .gitleaks.toml or its default rules'
    required: false
    default: '.gitleaks.toml'
  trivy-severity:
    description: 'Severity levels to scan for (comma-separated)'
    required: false
    default: 'CRITICAL,HIGH'
  trivy-scanners:
    description: 'Types of scanners to run (comma-separated)'
    required: false
    default: 'vuln,config,secret'
  trivy-timeout:
    description: 'Timeout for Trivy scan'
    required: false
    default: '10m'
  actionlint-enabled:
    description: 'Enable actionlint scanning'
    required: false
    default: 'true'
  token:
    description: 'GitHub token for authentication'
    required: false
    default: ''

outputs:
  has_trivy_results:
    description: 'Whether Trivy scan produced valid results'
    value: ${{ steps.verify-sarif.outputs.has_trivy }}
  has_gitleaks_results:
    description: 'Whether Gitleaks scan produced valid results'
    value: ${{ steps.verify-sarif.outputs.has_gitleaks }}
  total_issues:
    description: 'Total number of security issues found'
    value: ${{ steps.analyze.outputs.total_issues }}
  critical_issues:
    description: 'Number of critical security issues found'
    value: ${{ steps.analyze.outputs.critical_issues }}

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Validate Inputs
      shell: sh
      working-directory: ${{ github.action_path }}
      env:
        INPUT_ACTIONLINT_ENABLED: ${{ inputs.actionlint-enabled }}
        INPUT_GITLEAKS_CONFIG: ${{ inputs.gitleaks-config }}
        INPUT_GITLEAKS_LICENSE: ${{ inputs.gitleaks-license }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_TRIVY_SCANNERS: ${{ inputs.trivy-scanners }}
        INPUT_TRIVY_SEVERITY: ${{ inputs.trivy-severity }}
        INPUT_TRIVY_TIMEOUT: ${{ inputs.trivy-timeout }}
      run: |
        set -eu
        if ! command -v python3 >/dev/null 2>&1; then
          echo "::error::python3 is required to validate inputs"
          exit 1
        fi
        python3 validate.py

    - name: Check Required Configurations
      id: check-configs
      shell: sh
      env:
        ACTIONLINT_ENABLED: ${{ inputs.actionlint-enabled }}
        GITLEAKS_CONFIG: ${{ inputs.gitleaks-config }}
        GITLEAKS_LICENSE: ${{ inputs.gitleaks-license }}
      run: |
        set -eu

        # A report in the checkout is not a scan result. Remove it so that any
        # report found after the scans was written by this run.
        rm -rf results.sarif trivy-results.sarif

        # Initialize flags: Gitleaks stays off unless a license is available
        {
          printf 'run_gitleaks=%s\n' "false"
          printf 'run_trivy=%s\n' "true"
          printf 'run_actionlint=%s\n' "$ACTIONLINT_ENABLED"
        } >> "$GITHUB_OUTPUT"

        # A config file is optional. With no GITLEAKS_CONFIG, gitleaks reads
        # .gitleaks.toml at the repository root, then its default rules. A path
        # that does not exist would make it exit before scanning, so it is not
        # passed on.
        if [ -n "$GITLEAKS_LICENSE" ]; then
          printf 'run_gitleaks=%s\n' "true" >> "$GITHUB_OUTPUT"
          if [ -f "$GITLEAKS_CONFIG" ]; then
            printf 'gitleaks_config=%s\n' "$GITLEAKS_CONFIG" >> "$GITHUB_OUTPUT"
          else
            printf '::warning::Gitleaks config not found - using a root .gitleaks.toml if present, otherwise the default rules\n'
          fi
        else
          printf '::warning::Gitleaks license missing - skipping Gitleaks scan\n'
        fi

    - name: Run actionlint
      if: steps.check-configs.outputs.run_actionlint == 'true'
      uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
      with:
        cache: true
        fail-on-error: true
        shellcheck: false

    - name: Run Gitleaks
      if: steps.check-configs.outputs.run_gitleaks == 'true'
      uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
      env:
        GITHUB_TOKEN: ${{ inputs.token || github.token }}
        GITLEAKS_LICENSE: ${{ inputs.gitleaks-license }}
        GITLEAKS_CONFIG: ${{ steps.check-configs.outputs.gitleaks_config }}

    - name: Run Trivy vulnerability scanner
      if: steps.check-configs.outputs.run_trivy == 'true'
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'fs'
        scanners: ${{ inputs.trivy-scanners }}
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: ${{ inputs.trivy-severity }}
        timeout: ${{ inputs.trivy-timeout }}

    - name: Verify SARIF files
      id: verify-sarif
      # Leaks fail the Gitleaks step and its report is still the scan result, so
      # this also runs after a failure. Reports from the checkout are gone once
      # check-configs has succeeded.
      if: always() && steps.check-configs.outcome == 'success'
      shell: sh
      env:
        RUN_GITLEAKS: ${{ steps.check-configs.outputs.run_gitleaks }}
      run: |
        set -eu

        # Initialize outputs
        {
          printf 'has_trivy=%s\n' "false"
          printf 'has_gitleaks=%s\n' "false"
        } >> "$GITHUB_OUTPUT"

        # Check Trivy results
        if [ -f "trivy-results.sarif" ]; then
          if jq -e . <"trivy-results.sarif" >/dev/null 2>&1; then
            printf 'has_trivy=%s\n' "true" >> "$GITHUB_OUTPUT"
          else
            printf '::warning::Trivy SARIF file exists but is not valid JSON\n'
          fi
        fi

        # Check Gitleaks results if it ran
        if [ "$RUN_GITLEAKS" = "true" ]; then
          if [ -f "results.sarif" ]; then
            if jq -e . <"results.sarif" >/dev/null 2>&1; then
              printf 'has_gitleaks=%s\n' "true" >> "$GITHUB_OUTPUT"
            else
              printf '::warning::Gitleaks SARIF file exists but is not valid JSON\n'
            fi
          else
            printf '::warning::Gitleaks left no report - nothing was scanned or the scan did not finish\n'
          fi
        fi

    - name: Upload Trivy results
      if: steps.verify-sarif.outputs.has_trivy == 'true'
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'trivy'

    - name: Upload Gitleaks results
      if: always() && steps.verify-sarif.outputs.has_gitleaks == 'true'
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: 'results.sarif'
        category: 'gitleaks'

    - name: Archive Trivy results
      if: always() && steps.verify-sarif.outputs.has_trivy == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: security-reports-trivy-${{ github.run_id }}
        path: trivy-results.sarif
        retention-days: 30

    - name: Archive Gitleaks results
      if: always() && steps.verify-sarif.outputs.has_gitleaks == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: security-reports-gitleaks-${{ github.run_id }}
        path: results.sarif
        retention-days: 30

    - name: Analyze Results
      id: analyze
      if: always()
      shell: node {0}
      env:
        HAS_TRIVY: ${{ steps.verify-sarif.outputs.has_trivy }}
        HAS_GITLEAKS: ${{ steps.verify-sarif.outputs.has_gitleaks }}
        RUN_ACTIONLINT: ${{ steps.check-configs.outputs.run_actionlint }}
        RUN_TRIVY: ${{ steps.check-configs.outputs.run_trivy }}
        RUN_GITLEAKS: ${{ steps.check-configs.outputs.run_gitleaks }}
      run: |
        const fs = require('fs');

        try {
          let totalIssues = 0;
          let criticalIssues = 0;

          const isCriticalLevel = r =>
            r.level === 'error' ||
            r.level === 'critical' ||
            (r.ruleId || '').toLowerCase().includes('critical');

          const analyzeSarif = (file, tool, isCritical) => {
            if (!fs.existsSync(file)) {
              console.log(`No results file found for ${tool}`);
              return null;
            }

            try {
              const sarif = JSON.parse(fs.readFileSync(file, 'utf8'));
              return sarif.runs.reduce((acc, run) => {
                if (!run.results) return acc;

                const critical = run.results.filter(isCritical).length;

                return {
                  total: acc.total + run.results.length,
                  critical: acc.critical + critical
                };
              }, { total: 0, critical: 0 });
            } catch (error) {
              console.log(`Error analyzing ${tool} results: ${error.message}`);
              return null;
            }
          };

          // Only analyze reports that verification accepted.
          // Read step outputs via env so apostrophes/backticks in values
          // cannot break the JS literal.
          const results = {
            trivy: process.env.HAS_TRIVY === 'true' ?
              analyzeSarif('trivy-results.sarif', 'trivy', isCriticalLevel) : null,
            // Gitleaks results carry no level, and each one is a detected secret.
            gitleaks: process.env.HAS_GITLEAKS === 'true' ?
              analyzeSarif('results.sarif', 'gitleaks', () => true) : null
          };

          // Aggregate results
          Object.entries(results).forEach(([tool, result]) => {
            if (result) {
              totalIssues += result.total;
              criticalIssues += result.critical;
              console.log(`${tool}: ${result.total} total, ${result.critical} critical issues`);
            }
          });

          // Create summary
          const summary = `## Security Scan Summary

          - Total Issues Found: ${totalIssues}
          - Critical Issues: ${criticalIssues}

          ### Tool Breakdown
          ${Object.entries(results)
            .filter(([_, r]) => r)
            .map(([tool, r]) =>
              `- ${tool}: ${r.total} total, ${r.critical} critical`
            ).join('\n')}

          ### Tools Run Status
          - Actionlint: ${process.env.RUN_ACTIONLINT}
          - Trivy: ${process.env.RUN_TRIVY}
          - Gitleaks: ${process.env.RUN_GITLEAKS}
          `;

          // Set outputs using GITHUB_OUTPUT
          const outputFile = process.env.GITHUB_OUTPUT;
          if (outputFile) {
            fs.appendFileSync(outputFile, `total_issues=${totalIssues}\n`);
            fs.appendFileSync(outputFile, `critical_issues=${criticalIssues}\n`);
          }

          // Add job summary using GITHUB_STEP_SUMMARY
          const summaryFile = process.env.GITHUB_STEP_SUMMARY;
          if (summaryFile) {
            fs.appendFileSync(summaryFile, summary + '\n');
          }

          // Fail if critical issues found
          if (criticalIssues > 0) {
            console.error(`Found ${criticalIssues} critical security issues`);
            process.exit(1);
          }
        } catch (error) {
          console.error(`Analysis failed: ${error.message}`);
          process.exit(1);
        }
