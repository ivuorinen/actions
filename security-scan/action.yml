# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
# permissions:
#   - contents: read          # Required for checking out the repository
#   - security-events: write  # Required for uploading the SARIF reports to code scanning
#   - pull-requests: write    # Required on a pull request for the inline gitleaks:allow comment; without it, a warning
---
name: Security Scan
description: >-
  Security scanning for repositories with GitHub Actions: jactionlint, Gitleaks and Trivy, with the results uploaded to
  code scanning. Requires 'contents: read' and 'security-events: write', and on a pull request 'pull-requests: write'
  for its comment. All three scanners run from release binaries checked against SHA-256 digests pinned in this action,
  on Linux and macOS (x64 and ARM64) and Windows x64. Gitleaks scans the commits a pull request, merge group or push
  adds, two-parent merge commits included, and the whole history on other events and on a push whose earlier commit
  the clone lacks, such as the push that creates a branch, where an older commit can fail the scan. On a pull request,
  its review events or a merge group, Gitleaks and Trivy run from an export of the base commit, so their configs, ignore
  files and git attributes come from the base branch, and jactionlint reads the base branch's config. Inline
  gitleaks:allow comments, and Trivy's trivy:ignore comments, in the changed files still apply; a pull request's scan
  lists the gitleaks:allow comments it adds in a comment when the base branch keeps a Gitleaks config or ignore file.
author: Ismo Vuorinen
branding:
  icon: shield
  color: red

inputs:
  gitleaks-license:
    description: >-
      Deprecated: has no effect, because Gitleaks runs from its own release binary, which needs no license. A value
      set here must still contain no whitespace or control characters, and is masked in the log.
    deprecationMessage: 'This input has no effect. security-scan runs the Gitleaks binary, which needs no license.'
    required: false
  gitleaks-config:
    description: >-
      Path to the Gitleaks config file. If it does not exist, Gitleaks uses a root .gitleaks.toml or its default
      rules. On a pull request or merge group the file is read from the base commit.
    required: false
    default: '.gitleaks.toml'
  trivy-severity:
    description: 'Severity levels to scan for (comma-separated). Also limits the SARIF report'
    required: false
    default: 'CRITICAL,HIGH'
  trivy-scanners:
    description: >-
      Trivy scanners to run (comma-separated): vuln, misconfig, secret, license. config is Trivy's older, deprecated
      name for misconfig
    required: false
    default: 'vuln,misconfig,secret'
  trivy-timeout:
    description: 'Timeout for Trivy scan'
    required: false
    default: '10m'
  actionlint-enabled:
    description: >-
      Lint the workflows with jactionlint, a fork of actionlint (lowercase true or false). jactionlint fails on a key
      its config file does not know, where actionlint ignored one, and applies no baseline the config names, so it
      reports every finding
    required: false
    default: 'true'
  jactionlint-profile:
    description: >-
      jactionlint rule profile: correctness runs the checks of actionlint, default adds jactionlint's other rules, most
      of them security and policy rules. Overrides a profile in the jactionlint or actionlint config file. Either way,
      jactionlint runs without its shellcheck and pyflakes integrations, so it does not check the shell or Python
      scripts of run: steps
    required: false
    default: 'correctness'
  token:
    description: >-
      GitHub token for checking out the repository and, on a pull request, for the inline gitleaks:allow comment.
      Defaults to the workflow token
    required: false
    default: ''

outputs:
  has_trivy_results:
    description: 'Whether Trivy scan produced valid results'
    value: ${{ steps.verify-sarif.outputs.has_trivy }}
  has_gitleaks_results:
    description: 'Whether Gitleaks scan produced valid results'
    value: ${{ steps.verify-sarif.outputs.has_gitleaks }}
  total_issues:
    description: 'Total number of security issues found; empty when a scanner that was to run left no report to count'
    value: ${{ steps.analyze.outputs.total_issues }}
  critical_issues:
    description: 'Number of critical security issues found; empty instead of 0 when a scanner that was to run left no report to count'
    value: ${{ steps.analyze.outputs.critical_issues }}

runs:
  using: composite
  steps:
    - name: Validate Inputs
      shell: sh
      working-directory: ${{ github.action_path }}
      env:
        INPUT_ACTIONLINT_ENABLED: ${{ inputs.actionlint-enabled }}
        INPUT_GITLEAKS_CONFIG: ${{ inputs.gitleaks-config }}
        INPUT_GITLEAKS_LICENSE: ${{ inputs.gitleaks-license }}
        INPUT_JACTIONLINT_PROFILE: ${{ inputs.jactionlint-profile }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_TRIVY_SCANNERS: ${{ inputs.trivy-scanners }}
        INPUT_TRIVY_SEVERITY: ${{ inputs.trivy-severity }}
        INPUT_TRIVY_TIMEOUT: ${{ inputs.trivy-timeout }}
      run: |
        set -eu
        if ! command -v python3 >/dev/null 2>&1; then
          echo "::error::python3 is required to validate inputs"
          exit 1
        fi
        python3 validate.py

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ inputs.token || github.token }}
        fetch-depth: 0
        persist-credentials: false

    - name: Check Required Configurations
      id: check-configs
      shell: sh
      env:
        ACTIONLINT_ENABLED: ${{ inputs.actionlint-enabled }}
        GITLEAKS_CONFIG: ${{ inputs.gitleaks-config }}
      run: |
        set -eu

        # A report in the checkout is not a scan result. Remove it so that any
        # report found after the scans was written by this run.
        rm -rf results.sarif trivy-results.sarif

        {
          printf 'run_gitleaks=%s\n' "true"
          printf 'run_trivy=%s\n' "true"
          printf 'run_actionlint=%s\n' "$ACTIONLINT_ENABLED"
        } >> "$GITHUB_OUTPUT"

        command -v jq >/dev/null 2>&1 || { echo "::error::jq is required to read the event payload"; exit 1; }
        command -v git >/dev/null 2>&1 || { echo "::error::git is required to choose the commits Gitleaks scans"; exit 1; }
        command -v mktemp >/dev/null 2>&1 || { echo "::error::mktemp is required for the scanner configs"; exit 1; }

        # The commits Gitleaks scans: those a pull request or merge group adds, or a push
        # brought, as BASE..HEAD. --remerge-diff makes git log show what a merge commit itself
        # changes, which it otherwise leaves out.
        field() { jq -r "$1 // empty" "$GITHUB_EVENT_PATH"; }
        # A pull request's review events check out its merge commit too, so they are a pull
        # request here.
        case "$GITHUB_EVENT_NAME" in
          pull_request | pull_request_review | pull_request_review_comment)
            base=$(field .pull_request.base.sha)
            head=$(field .pull_request.head.sha)
            ;;
          merge_group)
            base=$(field .merge_group.base_sha)
            head=$(field .merge_group.head_sha)
            ;;
          push)
            base=$(field .before)
            head=$(field .after)
            ;;
          *)
            base=''
            head=''
            ;;
        esac
        is_commit() {
          case "$1" in
            '' | *[!0-9a-f]*) return 1 ;;
          esac
          git cat-file -e "$1^{commit}" 2>/dev/null
        }
        if is_commit "$base" && is_commit "$head"; then
          printf 'gitleaks_range=%s\n' "${base}..${head}" >> "$GITHUB_OUTPUT"
        else
          case "$GITHUB_EVENT_NAME" in
            pull_request | pull_request_review | pull_request_review_comment | merge_group)
              printf '::error::This clone lacks a commit the %s event names, so the base branch configuration cannot be read\n' "$GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac
          # On any other event, or a push whose first commit is not in the clone (the push
          # that creates a branch has none), Gitleaks scans the whole history.
          printf '::notice::Gitleaks scans the whole history on this %s event\n' "$GITHUB_EVENT_NAME"
        fi

        configs=$(mktemp -d "${RUNNER_TEMP}/security-scan-configs.XXXXXX")
        # pick_jactionlint_config DIR: the jactionlint config in DIR, the first regular file of the names
        # jactionlint looks for, never a symlink; an empty one when DIR has none. jactionlint runs on
        # a copy of the workflows outside any repository, so it reads only the config named here,
        # never the checkout's or a user-global one on the runner.
        pick_jactionlint_config() {
          if [ ! -L "$1/.github" ]; then
            for name in jactionlint.yaml jactionlint.yml actionlint.yaml actionlint.yml; do
              if [ -f "$1/.github/${name}" ] && [ ! -L "$1/.github/${name}" ]; then
                printf '%s\n' "$1/.github/${name}"
                return 0
              fi
            done
          fi
          : >"${configs}/jactionlint.yaml"
          printf '%s\n' "${configs}/jactionlint.yaml"
        }

        case "$GITHUB_EVENT_NAME" in
          pull_request | pull_request_review | pull_request_review_comment | merge_group)
            # The changes could allowlist themselves through the files the scanners read, so
            # Gitleaks and Trivy run from an export of the base commit, where their default
            # config and ignore file names, and relative paths inside the configs, resolve.
            # Gitleaks reads git attributes from the base commit for the same reason, through
            # GIT_ATTR_SOURCE, which git reads from 2.41 on.
            command -v tar >/dev/null 2>&1 || { echo "::error::tar is required to export the base commit"; exit 1; }
            git_version=$(git version | sed -E -n 's/^git version ([0-9]+)\.([0-9]+).*/\1 \2/p')
            case "$git_version" in
              [0-9]*' '[0-9]*) ;;
              *) git_version='0 0' ;;
            esac
            if [ "${git_version% *}" -lt 2 ] || { [ "${git_version% *}" -eq 2 ] && [ "${git_version#* }" -lt 41 ]; }; then
              printf '::error::git 2.41 or later is required to read git attributes from the base commit; found %s\n' "$(git version)"
              exit 1
            fi
            scan_dir=$(mktemp -d "${RUNNER_TEMP}/security-scan-base.XXXXXX")
            # git archive applies the export-ignore, export-subst and filter attributes the base
            # tree sets, which can leave a config out of the export, as /.* export-ignore does,
            # or rewrite it. $GIT_DIR/info/attributes overrides them while the export runs, and
            # is put back as it was.
            attributes=$(git rev-parse --git-path info/attributes)
            if [ -e "$attributes" ]; then
              cp "$attributes" "${configs}/info-attributes"
            fi
            mkdir -p "$(dirname "$attributes")"
            printf '* -export-ignore -export-subst -filter -text -eol -ident -working-tree-encoding\n' >"$attributes"
            exported=true
            git archive --format=tar --output="${configs}/base.tar" "$base" || exported=false
            if [ -e "${configs}/info-attributes" ]; then
              mv "${configs}/info-attributes" "$attributes"
            else
              rm -f "$attributes"
            fi
            if [ "$exported" != "true" ]; then
              echo "::error::git archive could not export the base commit"
              exit 1
            fi
            tar -x -f "${configs}/base.tar" -C "$scan_dir"
            rm -f "${configs}/base.tar"

            # Without --config, Gitleaks falls back to the .gitleaks.toml of the repository it
            # scans, the changes' own, so it always gets one: the base commit's, or its
            # default rules.
            if [ -f "${scan_dir}/${GITLEAKS_CONFIG}" ]; then
              gitleaks_config=$GITLEAKS_CONFIG
            elif [ -f "${scan_dir}/.gitleaks.toml" ]; then
              gitleaks_config=.gitleaks.toml
            else
              printf '[extend]\nuseDefault = true\n' >"${configs}/gitleaks.toml"
              gitleaks_config=${configs}/gitleaks.toml
            fi
            # Gitleaks also reads the .gitleaksignore at the root of the repository it scans,
            # whatever --gitleaks-ignore-path names, so the checkout's is removed. The base
            # commit's is read from the export.
            rm -rf .gitleaksignore
            jactionlint_config=$(pick_jactionlint_config "$scan_dir")
            {
              printf 'scan_dir=%s\n' "$scan_dir"
              printf 'base_sha=%s\n' "$base"
              printf 'head_sha=%s\n' "$head"
              printf 'gitleaks_config=%s\n' "$gitleaks_config"
              printf 'jactionlint_config=%s\n' "$jactionlint_config"
            } >> "$GITHUB_OUTPUT"
            ;;
          *)
            jactionlint_config=$(pick_jactionlint_config "$PWD")
            {
              printf 'scan_dir=%s\n' "$PWD"
              printf 'jactionlint_config=%s\n' "$jactionlint_config"
            } >> "$GITHUB_OUTPUT"
            if [ -f "$GITLEAKS_CONFIG" ]; then
              printf 'gitleaks_config=%s\n' "$GITLEAKS_CONFIG" >> "$GITHUB_OUTPUT"
            else
              printf '::warning::Gitleaks config not found - using a root .gitleaks.toml if present, otherwise the default rules\n'
            fi
            ;;
        esac

    - name: Install the scanners
      id: install-tools
      shell: sh
      env:
        ACTION_PATH: ${{ github.action_path }}
        RUN_ACTIONLINT: ${{ steps.check-configs.outputs.run_actionlint }}
        # Update security-scan/tools.sha256 with each version.
        # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v(?<version>.+)$
        GITLEAKS_VERSION: '8.30.1'
        # renovate: datasource=github-releases depName=aquasecurity/trivy extractVersion=^v(?<version>.+)$
        TRIVY_VERSION: '0.70.0'
        # renovate: datasource=github-releases depName=jdx/jactionlint extractVersion=^v(?<version>.+)$
        JACTIONLINT_VERSION: '2.6.0'
      run: |
        set -eu
        command -v python3 >/dev/null 2>&1 || { echo "::error::python3 is required to install the scanners"; exit 1; }
        command -v mktemp >/dev/null 2>&1 || { echo "::error::mktemp is required to install the scanners"; exit 1; }

        # Release archive names: gitleaks says x64, jactionlint amd64 and Trivy 64bit. Trivy
        # publishes no Windows ARM64 build.
        case "${RUNNER_OS}/${RUNNER_ARCH}" in
          Linux/X64) gitleaks_platform=linux_x64 jactionlint_platform=linux_amd64 trivy_platform=Linux-64bit ext=tar.gz exe='' ;;
          Linux/ARM64) gitleaks_platform=linux_arm64 jactionlint_platform=linux_arm64 trivy_platform=Linux-ARM64 ext=tar.gz exe='' ;;
          macOS/X64) gitleaks_platform=darwin_x64 jactionlint_platform=darwin_amd64 trivy_platform=macOS-64bit ext=tar.gz exe='' ;;
          macOS/ARM64) gitleaks_platform=darwin_arm64 jactionlint_platform=darwin_arm64 trivy_platform=macOS-ARM64 ext=tar.gz exe='' ;;
          Windows/X64) gitleaks_platform=windows_x64 jactionlint_platform=windows_amd64 trivy_platform=windows-64bit ext=zip exe=.exe ;;
          *)
            printf '::error::security-scan pins no scanner binaries for %s on %s\n' "$RUNNER_ARCH" "$RUNNER_OS"
            exit 1
            ;;
        esac

        tools=$(mktemp -d "${RUNNER_TEMP}/security-scan-tools.XXXXXX")
        # install_tool NAME VERSION PLATFORM REPO: fetch NAME's archive and install it into
        # $tools once its SHA-256 matches the digest tools.sha256 pins. A scanner whose install
        # fails gets no step output, which skips its scan; the others still install and run,
        # and this step fails at the end.
        failed=''
        install_tool() {
          archive="${tools}/${1}_${2}_${3}.${ext}"
          if python3 "${ACTION_PATH}/install_tool.py" download "https://github.com/${4}/releases/download/v${2}/${archive##*/}" "$archive" &&
            python3 "${ACTION_PATH}/install_tool.py" install "${ACTION_PATH}/tools.sha256" "$archive" "${1}${exe}" "$tools"; then
            return 0
          fi
          failed="${failed} ${1}"
          return 1
        }
        if install_tool gitleaks "$GITLEAKS_VERSION" "$gitleaks_platform" gitleaks/gitleaks; then
          printf 'gitleaks=%s\n' "${tools}/gitleaks${exe}" >> "$GITHUB_OUTPUT"
        fi
        if install_tool trivy "$TRIVY_VERSION" "$trivy_platform" aquasecurity/trivy; then
          printf 'trivy=%s\n' "${tools}/trivy${exe}" >> "$GITHUB_OUTPUT"
        fi
        if [ "$RUN_ACTIONLINT" = "true" ] && install_tool jactionlint "$JACTIONLINT_VERSION" "$jactionlint_platform" jdx/jactionlint; then
          printf 'jactionlint=%s\n' "${tools}/jactionlint${exe}" >> "$GITHUB_OUTPUT"
        fi
        # Trivy's database goes in this step's own new directory, which neither the files a
        # change commits nor anything earlier in the job can have filled: Trivy does not verify
        # the database, and skips downloading one that says it is current. It is downloaded on
        # each run and not cached, since another job could save a cache entry the scan would
        # prefer.
        printf 'trivy_cache=%s\n' "${tools}/trivy-cache" >> "$GITHUB_OUTPUT"
        if [ -n "$failed" ]; then
          printf '::error::Could not install:%s\n' "$failed"
          exit 1
        fi

    - name: Run jactionlint
      if: ${{ !cancelled() && steps.install-tools.outputs.jactionlint != '' && steps.check-configs.outputs.run_actionlint == 'true' }}
      shell: sh
      env:
        JACTIONLINT: ${{ steps.install-tools.outputs.jactionlint }}
        JACTIONLINT_CONFIG: ${{ steps.check-configs.outputs.jactionlint_config }}
        PROFILE: ${{ inputs.jactionlint-profile }}
      run: |
        set -eu
        command -v mktemp >/dev/null 2>&1 || { echo "::error::mktemp is required to copy the workflows"; exit 1; }
        # The workflows GitHub loads: the regular files directly in .github/workflows, never what a
        # symlink points to, and nothing under a .github or .github/workflows that is a symlink.
        for dir in .github .github/workflows; do
          if [ -L "$dir" ]; then
            printf '::warning::%s is a symlink - jactionlint does not follow it\n' "$dir"
            exit 0
          fi
        done
        # jactionlint reads the local actions and reusable workflows a workflow names, following
        # symlinks and .. paths out of the repository, and prints what it cannot parse there. A copy
        # of the workflows outside any repository makes it read none of them, and no config but
        # the one check-configs chose.
        lint_dir=$(mktemp -d "${RUNNER_TEMP}/security-scan-jactionlint.XXXXXX")
        mkdir -p "${lint_dir}/.github/workflows"
        set --
        for file in .github/workflows/*.yml .github/workflows/*.yaml; do
          if [ -f "$file" ] && [ ! -L "$file" ]; then
            cp "$file" "${lint_dir}/${file}"
            set -- "$@" "$file"
          fi
        done
        if [ "$#" -eq 0 ]; then
          printf '::notice::No workflow files in .github/workflows - nothing for jactionlint to check\n'
          exit 0
        fi
        # Without the shellcheck and pyflakes integrations, and never online: the config file it is
        # given counts as the user's own, so its online checks would send a token to the host it
        # names. Without a baseline too: outside the repository jactionlint reads the baseline a
        # config names, through its extends, relative to the copy, where it is missing, so a named
        # one failed the step and "auto" hid nothing; every finding is reported instead. Its
        # github-script-syntax check parses github-script scripts with node --check when the runner
        # has node. A blank jactionlint-profile is the default, correctness. Findings fail this step.
        profile=$(printf '%s' "$PROFILE" | tr -d '[:space:]')
        cd "$lint_dir"
        "$JACTIONLINT" --shellcheck= --pyflakes= --no-online --no-baseline --profile "${profile:-correctness}" \
          --config-file "$JACTIONLINT_CONFIG" "$@"

    - name: Run Gitleaks
      if: ${{ !cancelled() && steps.install-tools.outputs.gitleaks != '' && steps.check-configs.outputs.run_gitleaks == 'true' }}
      shell: sh
      env:
        GITLEAKS: ${{ steps.install-tools.outputs.gitleaks }}
        GITLEAKS_CONFIG_PATH: ${{ steps.check-configs.outputs.gitleaks_config }}
        GITLEAKS_RANGE: ${{ steps.check-configs.outputs.gitleaks_range }}
        SCAN_DIR: ${{ steps.check-configs.outputs.scan_dir }}
        BASE_SHA: ${{ steps.check-configs.outputs.base_sha }}
      run: |
        set -eu
        command -v git >/dev/null 2>&1 || { echo "::error::git is required for Gitleaks to read the history"; exit 1; }
        command -v mktemp >/dev/null 2>&1 || { echo "::error::mktemp is required for the Gitleaks log"; exit 1; }
        workspace=$PWD
        # The commits to scan: the range check-configs chose, or the whole history with the
        # options Gitleaks uses when it is given no --log-opts. --remerge-diff makes git log
        # show what a merge commit itself changes, which it otherwise leaves out.
        if [ -n "$GITLEAKS_RANGE" ]; then
          revisions=$GITLEAKS_RANGE
          log_opts="--remerge-diff ${GITLEAKS_RANGE}"
        else
          revisions=--all
          log_opts="--remerge-diff --full-history --all --diff-filter=tuxdb"
        fi
        # --remerge-diff shows only what a two-parent merge changes. A merge of more parents in a
        # range fails this step, since its own changes would go unscanned; in the whole history,
        # which cannot be changed, it is a warning.
        octopus=$(git -C "$workspace" rev-list --min-parents=3 --count "$revisions")
        if [ "$octopus" != "0" ]; then
          if [ -n "$GITLEAKS_RANGE" ]; then
            printf '::error::%s merge commits with more than two parents in %s; Gitleaks cannot scan what they change\n' "$octopus" "$GITLEAKS_RANGE"
            exit 1
          fi
          printf '::warning::Gitleaks cannot scan what the %s merge commits with more than two parents in the history change\n' "$octopus"
        fi
        log=$(mktemp "${RUNNER_TEMP}/security-scan-gitleaks.XXXXXX")
        # Gitleaks reads its ignore file, and the paths in its config, relative to the working
        # directory: SCAN_DIR, the base commit's export on a pull request or merge group (see
        # check-configs). It scans the checkout's history.
        cd "$SCAN_DIR"
        if [ -n "$BASE_SHA" ]; then
          GIT_ATTR_SOURCE=$BASE_SHA
          export GIT_ATTR_SOURCE
        fi
        # --redact keeps each secret out of the log and the report. Leaks exit 1 and fail this
        # step; the steps after it still verify and upload the report.
        set -- --no-banner --redact --report-format sarif --report-path "${workspace}/results.sarif" --log-opts "$log_opts"
        if [ -n "$GITLEAKS_CONFIG_PATH" ]; then
          set -- "$@" --config "$GITLEAKS_CONFIG_PATH"
        fi
        status=0
        "$GITLEAKS" git "$@" "$workspace" 2>"$log" || status=$?
        cat "$log" >&2
        # When git log writes anything but a known harmless warning to stderr, as a git too old
        # for --remerge-diff or a missing commit does, Gitleaks logs it as an error, stops, and
        # still exits 0 with a report that found nothing. An error in its log fails this step.
        if grep -Eq '(^|[^[:alnum:]_])ERR([^[:alnum:]_]|$)' "$log"; then
          echo "::error::Gitleaks could not read the whole history; its log above names the error"
          # Its report holds what it read before it stopped, so verification must not take it
          # for the scan's result.
          rm -f "${workspace}/results.sarif"
          exit 1
        fi
        exit "$status"

    - name: Comment on inline gitleaks:allow comments
      if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.check-configs.outcome == 'success' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        # inline_allows.mjs runs git by name from the checkout. On Windows, Node looks for a
        # program in the current directory before PATH unless this variable exists, and would
        # run a git.exe the pull request commits.
        NoDefaultCurrentDirectoryInExePath: '1'
        ACTION_PATH: ${{ github.action_path }}
        BASE_SHA: ${{ steps.check-configs.outputs.base_sha }}
        HEAD_SHA: ${{ steps.check-configs.outputs.head_sha }}
        GITLEAKS_CONFIG: ${{ inputs.gitleaks-config }}
      with:
        github-token: ${{ inputs.token || github.token }}
        # A file URL, because import() takes no Windows path.
        script: |
          const { join } = await import('node:path');
          const { pathToFileURL } = await import('node:url');
          const module = await import(pathToFileURL(join(process.env.ACTION_PATH, 'inline_allows.mjs')).href);
          await module.default({ github, context, core });

    # Leaks fail the Gitleaks step; the vulnerability scan still runs unless the job was cancelled.
    - name: Run Trivy vulnerability scanner
      if: ${{ !cancelled() && steps.install-tools.outputs.trivy != '' && steps.check-configs.outputs.run_trivy == 'true' }}
      shell: sh
      env:
        TRIVY: ${{ steps.install-tools.outputs.trivy }}
        CACHE_DIR: ${{ steps.install-tools.outputs.trivy_cache }}
        SCAN_DIR: ${{ steps.check-configs.outputs.scan_dir }}
        SCANNERS: ${{ inputs.trivy-scanners }}
        SEVERITY: ${{ inputs.trivy-severity }}
        SCAN_TIMEOUT: ${{ inputs.trivy-timeout }}
      run: |
        set -eu
        workspace=$PWD
        # The lists without the spaces the validator allows around each item, which Trivy would
        # read as part of a name. An empty input leaves Trivy at its own default.
        scanners=$(printf '%s' "$SCANNERS" | tr -d '[:space:]')
        severity=$(printf '%s' "$SEVERITY" | tr -d '[:space:]')
        set -- fs
        if [ -n "$scanners" ]; then
          set -- "$@" --scanners "$scanners"
        fi
        if [ -n "$severity" ]; then
          set -- "$@" --severity "$severity"
        fi
        if [ -n "$SCAN_TIMEOUT" ]; then
          set -- "$@" --timeout "$SCAN_TIMEOUT"
        fi
        # Trivy reads trivy.yaml, .trivyignore and trivy-secret.yaml, and the paths inside them,
        # relative to the working directory: SCAN_DIR, as for Gitleaks. It scans the checkout.
        # Findings do not fail this step; Analyze Results counts the critical ones.
        cd "$SCAN_DIR"
        "$TRIVY" "$@" --cache-dir "$CACHE_DIR" --format sarif --output "${workspace}/trivy-results.sarif" "$workspace"

    - name: Verify SARIF files
      id: verify-sarif
      # Leaks fail the Gitleaks step and its report is still the scan result, so
      # this also runs after a failure. Reports from the checkout are gone once
      # check-configs has succeeded.
      if: always() && steps.check-configs.outcome == 'success'
      shell: sh
      env:
        RUN_GITLEAKS: ${{ steps.check-configs.outputs.run_gitleaks }}
        RUN_TRIVY: ${{ steps.check-configs.outputs.run_trivy }}
      run: |
        set -eu
        command -v jq >/dev/null 2>&1 || { echo "::error::jq is required to read the scan reports"; exit 1; }

        # valid REPORT: REPORT exists and holds one SARIF document with the runs array the
        # upload and Analyze Results read; an empty one is a scan that found nothing.
        valid() { [ -f "$1" ] && jq -e -s 'length == 1 and (.[0] | type == "object" and (.runs | type == "array"))' <"$1" >/dev/null 2>&1; }
        has_trivy=false
        has_gitleaks=false
        missing=false
        if [ "$RUN_TRIVY" = "true" ]; then
          if valid trivy-results.sarif; then
            has_trivy=true
          else
            printf '::error::Trivy left no valid report - the scan did not run or did not finish\n'
            missing=true
          fi
        fi
        if [ "$RUN_GITLEAKS" = "true" ]; then
          if valid results.sarif; then
            has_gitleaks=true
          else
            printf '::error::Gitleaks left no valid report - the scan did not run or did not finish\n'
            missing=true
          fi
        fi
        {
          printf 'has_trivy=%s\n' "$has_trivy"
          printf 'has_gitleaks=%s\n' "$has_gitleaks"
        } >> "$GITHUB_OUTPUT"
        # A scanner that was to run and left no report gives no result to trust.
        if [ "$missing" = "true" ]; then
          exit 1
        fi

    - name: Upload Trivy results
      if: always() && steps.verify-sarif.outputs.has_trivy == 'true'
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'trivy'

    - name: Upload Gitleaks results
      if: always() && steps.verify-sarif.outputs.has_gitleaks == 'true'
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: 'results.sarif'
        category: 'gitleaks'

    - name: Archive Trivy results
      if: always() && steps.verify-sarif.outputs.has_trivy == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: security-reports-trivy-${{ github.run_id }}
        path: trivy-results.sarif
        retention-days: 30

    - name: Archive Gitleaks results
      if: always() && steps.verify-sarif.outputs.has_gitleaks == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: security-reports-gitleaks-${{ github.run_id }}
        path: results.sarif
        retention-days: 30

    # Counts the findings in the reports verification accepted, writes the totals and a job
    # summary, and fails on a critical finding.
    - name: Analyze Results
      id: analyze
      if: always()
      shell: sh
      env:
        HAS_TRIVY: ${{ steps.verify-sarif.outputs.has_trivy }}
        HAS_GITLEAKS: ${{ steps.verify-sarif.outputs.has_gitleaks }}
        RUN_TRIVY: ${{ steps.check-configs.outputs.run_trivy }}
        RUN_GITLEAKS: ${{ steps.check-configs.outputs.run_gitleaks }}
      run: |
        set -eu
        command -v jq >/dev/null 2>&1 || { echo "::error::jq is required to count the scan results"; exit 1; }
        # tally REPORT CRITICAL: print how many results the SARIF REPORT holds and how many of them
        # meet the jq condition CRITICAL; fail when REPORT is no such document.
        tally() {
          jq -r "[.runs[] | if .results == null then empty
              elif (.results | type) == \"array\" then .results[] else error(\"results is not an array\") end]
            | \"\(length) \(map(select($2)) | length)\"" "$1"
        }
        total=0
        critical=0
        breakdown=
        uncounted=
        # add TOOL REPORT ACCEPTED RUN CRITICAL: count TOOL's REPORT when verification ACCEPTED it.
        # Every scanner is to run unless RUN, from check-configs, is false; RUN is empty when the job
        # stopped before check-configs finished. Totals without such a scanner are not totals.
        add() {
          counts=
          if [ "$3" = "true" ]; then
            if [ ! -f "$2" ]; then
              printf 'No results file found for %s\n' "$1"
            elif ! counts=$(tally "$2" "$5"); then
              printf 'Error analyzing %s results\n' "$1"
              counts=
            fi
          fi
          if [ -z "$counts" ]; then
            if [ "$4" != "false" ]; then
              uncounted="${uncounted:+$uncounted and }$1"
              breakdown="${breakdown}- $1: no report to count
        "
            fi
            return 0
          fi
          tool_total=${counts% *}
          tool_critical=${counts#* }
          total=$((total + tool_total))
          critical=$((critical + tool_critical))
          printf '%s: %s total, %s critical issues\n' "$1" "$tool_total" "$tool_critical"
          breakdown="${breakdown}- $1: ${tool_total} total, ${tool_critical} critical
        "
        }
        add trivy trivy-results.sarif "$HAS_TRIVY" "$RUN_TRIVY" \
          '.level == "error" or .level == "critical" or ((.ruleId // "") | ascii_downcase | contains("critical"))'
        # Gitleaks results carry no level, and each one is a detected secret.
        add gitleaks results.sarif "$HAS_GITLEAKS" "$RUN_GITLEAKS" 'true'

        # No totals when a scanner that was to run has no count, so a caller never reads a scan
        # that did not happen as zero findings. The critical findings the counted reports hold are
        # still written: a count above zero cannot be read as a clean scan.
        if [ -n "$uncounted" ]; then
          printf '::warning::No issue totals: %s left no report to count\n' "$uncounted"
          shown_total="not counted"
          shown_critical="not counted"
          if [ "$critical" -gt 0 ]; then
            printf 'critical_issues=%s\n' "$critical" >>"$GITHUB_OUTPUT"
            shown_critical="at least ${critical}"
          fi
        else
          {
            printf 'total_issues=%s\n' "$total"
            printf 'critical_issues=%s\n' "$critical"
          } >>"$GITHUB_OUTPUT"
          shown_total=$total
          shown_critical=$critical
        fi
        {
          printf '## Security Scan Summary\n\n'
          printf '%s\n' "- Total Issues Found: ${shown_total}" "- Critical Issues: ${shown_critical}"
          printf '\n### Tool Breakdown\n\n%s' "$breakdown"
        } >>"$GITHUB_STEP_SUMMARY"
        if [ "$critical" -gt 0 ]; then
          printf 'Found %s critical security issues\n' "$critical" >&2
          exit 1
        fi
