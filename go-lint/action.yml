# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
# permissions:
#   - contents: read          # Required for checking out repository
#   - security-events: write  # Required for uploading SARIF results
---
name: Go Lint Check
description: 'Run golangci-lint with advanced configuration, caching, and reporting'
author: Ismo Vuorinen

branding:
  icon: code
  color: blue

inputs:
  working-directory:
    description: 'Directory containing Go files'
    required: false
    default: '.'
  golangci-lint-version:
    description: 'Version of golangci-lint v2 to use (empty: the version pinned in this action, "latest": the newest v2 release)'
    required: false
    default: ''
  go-version:
    description: 'Go version to use (empty: the version pinned in this action, "stable": the newest release)'
    required: false
    default: ''
  config-file:
    description: 'Path to golangci-lint config file, relative to working-directory. A built-in default is used when this path is not a regular file.'
    required: false
    default: '.golangci.yml'
  timeout:
    description: 'Timeout for analysis (e.g., 5m, 1h)'
    required: false
    default: '5m'
  cache:
    description: 'Enable golangci-lint caching (lowercase true or false)'
    required: false
    default: 'true'
  fail-on-error:
    description: 'Fail workflow if issues are found (lowercase true or false)'
    required: false
    default: 'true'
  report-format:
    description: 'Output format: sarif, json or text. github-actions, line-number and colored-line-number, the golangci-lint v1 names, also give text.'
    required: false
    default: 'sarif'
  max-retries:
    description: 'Maximum number of retry attempts (1-10, must not be empty)'
    required: false
    default: '3'
  only-new-issues:
    description: 'Report only new issues since main branch (lowercase true or false)'
    required: false
    default: 'true'
  disable-all:
    description: 'Disable all linters, useful with --enable-* (lowercase true or false)'
    required: false
    default: 'false'
  enable-linters:
    description: 'Comma-separated list of linters to enable'
    required: false
  disable-linters:
    description: 'Comma-separated list of linters to disable'
    required: false
  token:
    description: 'GitHub token for authentication'
    required: false
    default: ''

outputs:
  error-count:
    description: 'Number of errors found'
    value: ${{ steps.lint.outputs.error_count }}
  sarif-file:
    description: 'Path to SARIF report file'
    value: ${{ steps.lint.outputs.sarif_file }}
  cache-hit:
    description: 'Indicates if there was a cache hit'
    value: ${{ steps.cache.outputs.cache-hit }}
  analyzed-files:
    description: 'Number of files analyzed'
    value: ${{ steps.lint.outputs.analyzed_files }}

runs:
  using: composite
  steps:
    - name: Validate Inputs
      shell: sh
      working-directory: ${{ github.action_path }}
      env:
        INPUT_CACHE: ${{ inputs.cache }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_DISABLE_ALL: ${{ inputs.disable-all }}
        INPUT_DISABLE_LINTERS: ${{ inputs.disable-linters }}
        INPUT_ENABLE_LINTERS: ${{ inputs.enable-linters }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        INPUT_GO_VERSION: ${{ inputs.go-version }}
        INPUT_GOLANGCI_LINT_VERSION: ${{ inputs.golangci-lint-version }}
        INPUT_MAX_RETRIES: ${{ inputs.max-retries }}
        INPUT_ONLY_NEW_ISSUES: ${{ inputs.only-new-issues }}
        INPUT_REPORT_FORMAT: ${{ inputs.report-format }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -eu
        if ! command -v python3 >/dev/null 2>&1; then
          echo "::error::python3 is required to validate inputs"
          exit 1
        fi
        python3 validate.py

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      env:
        # renovate: datasource=golang-version depName=go
        DEFAULT_GO_VERSION: '1.27.3'
      with:
        go-version: ${{ inputs.go-version || env.DEFAULT_GO_VERSION }}
        cache: true

    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ inputs.token || github.token }}
        persist-credentials: false

    - name: Resolve golangci-lint Version
      id: golangci-version
      shell: sh
      env:
        REQUESTED_VERSION: ${{ inputs.golangci-lint-version }}
        # renovate: datasource=go depName=github.com/golangci/golangci-lint/v2
        DEFAULT_GOLANGCI_LINT_VERSION: 'v2.15.0'
      run: |
        set -eu

        # validate.py lets a blank value through as "use the pin", so whitespace is removed before
        # the fallback applies, not after it.
        requested=$(printf '%s' "$REQUESTED_VERSION" | tr -d '[:space:]')
        version="${requested:-$DEFAULT_GOLANGCI_LINT_VERSION}"

        # go install needs a lowercase 'v' prefix on anything but 'latest'.
        # validate.py allows 'V' and any case of 'latest'.
        case "$version" in
          [Ll][Aa][Tt][Ee][Ss][Tt]) version="latest" ;;
          [Vv]*) version="v${version#[Vv]}" ;;
          *) version="v$version" ;;
        esac

        printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

    - name: Cache golangci-lint
      id: cache
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/golangci-lint
          ~/.cache/go-build
        key: ${{ runner.os }}-golangci-${{ steps.golangci-version.outputs.version }}-${{ hashFiles('go.sum', inputs.config-file) }}
        restore-keys: |
          ${{ runner.os }}-golangci-${{ steps.golangci-version.outputs.version }}-

    - name: Install golangci-lint
      id: install-golangci-lint
      shell: sh
      env:
        MAX_RETRIES: ${{ inputs.max-retries }}
        GOLANGCI_LINT_VERSION: ${{ steps.golangci-version.outputs.version }}
      run: |
        set -eu

        # Function to install golangci-lint with retries
        install_golangci_lint() {
          command -v go >/dev/null 2>&1 || { echo "::error::go is required to install golangci-lint"; exit 1; }
          _attempt=1
          _max_attempts="$MAX_RETRIES"

          while [ "$_attempt" -le "$_max_attempts" ]; do
            echo "Installation attempt $_attempt of $_max_attempts"

            if go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"; then
              return 0
            fi

            _attempt=$((_attempt + 1))
            if [ "$_attempt" -le "$_max_attempts" ]; then
              echo "Installation failed, waiting 10 seconds before retry..."
              sleep 10
            fi
          done

          echo "::error::Failed to install golangci-lint after $_max_attempts attempts"
          return 1
        }

        install_golangci_lint

    - name: Prepare Configuration
      id: config
      shell: sh
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        CONFIG_FILE: ${{ inputs.config-file }}
        TIMEOUT: ${{ inputs.timeout }}
      run: |
        set -eu

        cd -- "$WORKING_DIRECTORY"

        # Without a config, write the default to $RUNNER_TEMP. The configured path is
        # never a write target: this test is also true for a dangling symlink.
        if [ ! -f "$CONFIG_FILE" ]; then
          echo "Creating default golangci-lint configuration..."
          CONFIG_FILE="$RUNNER_TEMP/golangci-lint-default.yml"
          cat > "$CONFIG_FILE" <<EOF
        version: "2"

        linters:
          default: all
          settings:
            govet:
              enable:
                - shadow
            gocyclo:
              min-complexity: 15
            dupl:
              threshold: 100
            goconst:
              min-len: 3
              min-occurrences: 3
          exclusions:
            paths:
              - vendor
              - third_party

        issues:
          max-issues-per-linter: 0
          max-same-issues: 0

        run:
          timeout: $TIMEOUT
          tests: true
        EOF
        fi

        printf 'config_file=%s\n' "$CONFIG_FILE" >> "$GITHUB_OUTPUT"

    - name: Run golangci-lint
      id: lint
      shell: sh
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        DISABLE_ALL: ${{ inputs.disable-all }}
        ENABLE_LINTERS: ${{ inputs.enable-linters }}
        DISABLE_LINTERS: ${{ inputs.disable-linters }}
        CONFIG_FILE: ${{ steps.config.outputs.config_file }}
        TIMEOUT: ${{ inputs.timeout }}
        ONLY_NEW_ISSUES: ${{ inputs.only-new-issues }}
        REPORT_FORMAT: ${{ inputs.report-format }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
      run: |
        set -eu

        cd -- "$WORKING_DIRECTORY"

        # Keep the reports outside the workspace: a repository can commit
        # 'reports' as a symlink, which would redirect the writes and the cleanup.
        command -v mktemp >/dev/null 2>&1 || { echo "::error::mktemp is required to create the reports directory"; exit 1; }
        reports_dir=$(mktemp -d "$RUNNER_TEMP/go-lint.XXXXXX")
        printf 'reports_dir=%s\n' "$reports_dir" >> "$GITHUB_OUTPUT"

        # Build golangci-lint args as positional parameters
        set -- --config "$CONFIG_FILE" --timeout "$TIMEOUT"

        # Prepare new issues flag
        if [ "$ONLY_NEW_ISSUES" = "true" ]; then
          set -- "$@" --new
        fi

        # Prepare linter configuration
        if [ "$DISABLE_ALL" = "true" ]; then
          set -- "$@" --default=none
        fi

        if [ -n "$ENABLE_LINTERS" ]; then
          set -- "$@" "--enable=$ENABLE_LINTERS"
        fi

        if [ -n "$DISABLE_LINTERS" ]; then
          set -- "$@" "--disable=$DISABLE_LINTERS"
        fi

        # v2 has no github-actions, line-number or colored-line-number format; text replaces them
        case "$REPORT_FORMAT" in
          github-actions | line-number | colored-line-number) output_format="text" ;;
          *) output_format="$REPORT_FORMAT" ;;
        esac

        # The issue count reads the linter name that ends each text issue line, so that is not
        # left to the repository's config, which can turn it off.
        if [ "$output_format" = "text" ]; then
          set -- "$@" --output.text.print-linter-name=true
        fi

        # golangci-lint writes the report itself: its stdout also carries run statistics, and
        # any stdout output the repository's own config asks for, which a redirect would mix in
        result_file="$reports_dir/golangci-lint.$REPORT_FORMAT"
        set -- "$@" "--output.${output_format}.path=$result_file" ./...

        # Run golangci-lint
        echo "Running golangci-lint..."

        error_count=0
        exit_code=0

        command -v golangci-lint >/dev/null 2>&1 || { echo "::error::golangci-lint is required to lint the code"; exit 1; }
        GOLANGCI_LINT_CACHE="$HOME/.cache/golangci-lint" \
        golangci-lint run "$@" || exit_code=$?

        # Count errors regardless of exit code or fail-on-error setting. A run that could not
        # start leaves no report, which grep -s reads as no matches. A text report has one line
        # per issue ending in the linter's name, followed by source lines.
        if [ "$exit_code" -ne 0 ]; then
          case "$REPORT_FORMAT" in
            json) issue_pattern='"FromLinter":' ;;
            sarif) issue_pattern='"level": *"error"' ;;
            *) issue_pattern='^[^[:space:]:]+:[0-9]+(:[0-9]+)?: .* \([^ ]+\)$' ;;
          esac
          error_count=$(grep -Eos "$issue_pattern" "$result_file" | wc -l | tr -d ' ')
        fi

        # Always write outputs before any conditional exit
        printf 'error_count=%s\n' "$error_count" >> "$GITHUB_OUTPUT"

        # Count analyzed files
        analyzed_files=$(find . -type f -name "*.go" -not -path "./vendor/*" -not -path "./.git/*" | wc -l)
        printf 'analyzed_files=%s\n' "$analyzed_files" >> "$GITHUB_OUTPUT"
        printf 'sarif_file=%s\n' "$result_file" >> "$GITHUB_OUTPUT"

        if [ "$FAIL_ON_ERROR" = "true" ] && [ "$exit_code" -ne 0 ]; then
          echo "::error::golangci-lint exited with ${exit_code}, ${error_count} issues found"
          exit "$exit_code"
        fi

    - name: Upload Lint Results
      # The output is empty when the lint step never got far enough to write a report.
      if: always() && inputs.report-format == 'sarif' && steps.lint.outputs.sarif_file != ''
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: ${{ steps.lint.outputs.sarif_file }}
        category: golangci-lint

    - name: Cleanup
      if: always()
      shell: sh
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        CACHE: ${{ inputs.cache }}
        REPORTS_DIR: ${{ steps.lint.outputs.reports_dir }}
      run: |-
        set -eu

        cd -- "$WORKING_DIRECTORY"

        # Remove temporary files; empty when the lint step never ran
        if [ -n "$REPORTS_DIR" ]; then
          rm -rf "$REPORTS_DIR"
        fi

        # Clean cache if not being preserved
        if [ "$CACHE" != "true" ]; then
          rm -rf ~/.cache/golangci-lint
        fi
