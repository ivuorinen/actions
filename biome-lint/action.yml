# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
# permissions:
#   - contents: write         # Required for fix mode to push changes
#   - security-events: write  # Required for check mode to upload SARIF
---
name: Biome Lint
description: 'Run Biome linter in check or fix mode'
author: Ismo Vuorinen

branding:
  icon: check-circle
  color: green

inputs:
  mode:
    description: 'Mode to run: check or fix (empty: check)'
    required: false
    default: 'check'
  token:
    description: 'GitHub token for authentication. Stays in git config after checkout in fix mode only. Defaults to the workflow token.'
    required: false
    default: ''
  username:
    description: 'GitHub username for commits (fix mode only)'
    required: false
    default: 'github-actions'
  email:
    description: 'GitHub email for commits (fix mode only)'
    required: false
    default: 'github-actions@github.com'
  max-retries:
    description: 'Maximum number of retry attempts for npm install operations (1-10, must not be empty)'
    required: false
    default: '3'
  fail-on-error:
    description: 'Fail the workflow when issues are found; a run that could not lint fails either way (check mode only; lowercase true or false)'
    required: false
    default: 'true'

outputs:
  status:
    description: 'Overall status (success/failure)'
    value: ${{ steps.check.outputs.status || steps.fix.outputs.status }}
  errors_count:
    description: 'Number of errors found (check mode only)'
    value: ${{ steps.check.outputs.errors }}
  warnings_count:
    description: 'Number of warnings found (check mode only)'
    value: ${{ steps.check.outputs.warnings }}
  files_changed:
    description: 'Number of files changed (fix mode only)'
    value: ${{ steps.fix.outputs.files_changed }}

runs:
  using: composite
  steps:
    - name: Validate Inputs
      shell: sh
      working-directory: ${{ github.action_path }}
      env:
        INPUT_EMAIL: ${{ inputs.email }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        INPUT_MAX_RETRIES: ${{ inputs.max-retries }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_USERNAME: ${{ inputs.username }}
      run: |
        set -eu
        if ! command -v python3 >/dev/null 2>&1; then
          echo "::error::python3 is required to validate inputs"
          exit 1
        fi
        python3 validate.py

    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ inputs.token || github.token }}
        # The token reaches git only in the step that pushes, from that step's environment, so
        # code that runs before it finds none in .git/config.
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'

    - name: Install Biome
      id: install-biome
      shell: sh
      env:
        ACTION_PATH: ${{ github.action_path }}
        MAX_RETRIES: ${{ inputs.max-retries }}
      run: |
        set -eu

        # Biome comes from this action's package-lock.json: npm ci installs each package of the
        # tree, the platform binary included, at its locked version and integrity hash, with no
        # lifecycle scripts. npm whatever the repository uses, since the repository's own package
        # manager is not involved. The prefix is a new directory under RUNNER_TEMP, which the
        # runner empties between jobs except for files it cannot delete, so nothing an earlier
        # job left there, such as an .npmrc npm reads from the prefix, takes part. Check and fix
        # run the binary by its path, so no other Biome on PATH can stand in for it.
        # The same locked install as eslint-lint's and prettier-lint's: each action is self-contained.
        # The binary is an optional dependency, so --include=optional keeps a caller's
        # NPM_CONFIG_OMIT=optional from leaving it out. The launcher runs whatever BIOME_BINARY
        # names instead of the locked binary, so it is cleared here and in check and fix.
        unset BIOME_BINARY
        command -v npm >/dev/null 2>&1 || { echo "::error::npm is required to install Biome"; exit 1; }
        command -v mktemp >/dev/null 2>&1 || { echo "::error::mktemp is required to create the install prefix"; exit 1; }
        prefix=$(mktemp -d "$RUNNER_TEMP/biome-lint-tools.XXXXXX")
        cp "$ACTION_PATH/package.json" "$ACTION_PATH/package-lock.json" "$prefix/"
        bin="$prefix/node_modules/.bin/biome"

        # An install counts only once its Biome runs: npm can leave the launcher without the
        # platform binary it starts.
        attempt=1
        while [ "$attempt" -le "$MAX_RETRIES" ]; do
          echo "Attempt $attempt of $MAX_RETRIES"
          if npm ci --prefix "$prefix" --include=optional --ignore-scripts --no-audit --no-fund; then
            if [ -x "$bin" ] && version=$("$bin" --version); then
              printf 'Running Biome %s from %s\n' "$version" "$bin"
              printf 'bin=%s\n' "$bin" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "npm ci left no Biome that runs at $bin"
          fi

          if [ "$attempt" -lt "$MAX_RETRIES" ]; then
            echo "❌ Installation failed, retrying in 5 seconds..."
            sleep 5
          fi
          attempt=$((attempt + 1))
        done

        echo "::error::Failed to install Biome after $MAX_RETRIES attempts"
        exit 1

    - name: Run Biome Check
      if: (inputs.mode || 'check') == 'check'
      id: check
      shell: sh
      env:
        BIOME_BIN: ${{ steps.install-biome.outputs.bin }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
      run: |
        set -eu

        echo "Running Biome check mode..."

        # A report already in the checkout is not this run's result, so it goes before Biome
        # runs; the upload takes only a report this step names in sarif_file.
        rm -f biome-report.sarif

        # Run the Biome the install step put in its prefix, by its path, with the SARIF reporter.
        # BIOME_BINARY would make the launcher run another binary.
        unset BIOME_BINARY
        [ -n "$BIOME_BIN" ] || {
          echo "::error::the install step named no Biome to run"
          printf 'status=%s\n' "failure" >> "$GITHUB_OUTPUT"
          exit 1
        }
        command -v jq >/dev/null 2>&1 || {
          echo "::error::jq is required to read the SARIF report"
          printf 'status=%s\n' "failure" >> "$GITHUB_OUTPUT"
          exit 1
        }
        command -v mktemp >/dev/null 2>&1 || {
          echo "::error::mktemp is required to hold Biome's diagnostics"
          printf 'status=%s\n' "failure" >> "$GITHUB_OUTPUT"
          exit 1
        }
        diagnostics=$(mktemp "$RUNNER_TEMP/biome-lint-diagnostics.XXXXXX")
        biome_exit_code=0
        "$BIOME_BIN" check . --reporter=sarif > biome-report.sarif 2> "$diagnostics" || biome_exit_code=$?
        cat "$diagnostics" >&2

        # Biome exits 1 for findings, and also for a configuration it rejects (with no report) or
        # for a run that processed no files (with a report of no results, or only of a file it
        # skipped as too large, and its "No files were processed in the specified paths."
        # diagnostic). A status above 1, as when Biome is killed, is no completed run either. So
        # a run counts as a scan only when it exits 0 with a valid report, or exits 1 with
        # findings in a valid report and without that diagnostic. Any other run did not scan: it
        # fails the step whatever fail-on-error says, and leaves nothing to upload, since such a
        # report would close the open alerts. A report is named in sarif_file only once it counts.
        # A valid report is the one SARIF 2.1.0 document Biome writes, each run naming its tool,
        # so other output on stdout makes it invalid. The diagnostic is matched as Biome renders
        # it, on a line of its own, not as words another line can share.
        results=$(jq -s 'if length == 1 and .[0].version == "2.1.0" and (.[0].runs | type) == "array"
          and all(.[0].runs[]; .tool.driver.name != null)
          then [.[0].runs[].results[]?] | length else empty end' biome-report.sarif 2>/dev/null) || results=
        scanned=
        case "$biome_exit_code" in
          0) [ -n "$results" ] && scanned=yes ;;
          1)
            if [ -n "$results" ] && [ "$results" -gt 0 ] &&
              ! grep -qE '^ *× No files were processed in the specified paths\.$' "$diagnostics"; then
              scanned=yes
            fi
            ;;
        esac
        if [ -z "$scanned" ]; then
          rm -f biome-report.sarif
          echo "::error::Biome did not scan the code (exit status $biome_exit_code); see its diagnostics above"
          printf 'status=%s\n' "failure" >> "$GITHUB_OUTPUT"
          [ "$biome_exit_code" -ne 0 ] || biome_exit_code=1
          exit "$biome_exit_code"
        fi
        printf 'sarif_file=%s\n' "biome-report.sarif" >> "$GITHUB_OUTPUT"

        # Biome reports error-severity diagnostics at SARIF level "error" and warn-severity ones
        # at "warning".
        errors=$(jq '[.runs[]?.results[]? | select(.level == "error")] | length' biome-report.sarif)
        warnings=$(jq '[.runs[]?.results[]? | select(.level == "warning")] | length' biome-report.sarif)
        printf 'errors=%s\n' "$errors" >> "$GITHUB_OUTPUT"
        printf 'warnings=%s\n' "$warnings" >> "$GITHUB_OUTPUT"

        if [ "$biome_exit_code" -eq 0 ]; then
          printf 'status=%s\n' "success" >> "$GITHUB_OUTPUT"
          echo "✅ Biome check completed: $errors errors, $warnings warnings"
        else
          printf 'status=%s\n' "failure" >> "$GITHUB_OUTPUT"
          echo "::error::Biome check found $errors errors and $warnings warnings"
        fi

        # Exit with biome's exit code if fail-on-error is true
        if [ "$FAIL_ON_ERROR" = "true" ]; then
          exit "$biome_exit_code"
        fi

    - name: Upload SARIF Report
      if: always() && (inputs.mode || 'check') == 'check' && steps.check.outputs.sarif_file != ''
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: biome-report.sarif

    - name: Run Biome Fix
      if: inputs.mode == 'fix'
      id: fix
      shell: sh
      env:
        BIOME_BIN: ${{ steps.install-biome.outputs.bin }}
      run: |
        set -eu

        echo "Running Biome fix mode..."

        command -v git >/dev/null 2>&1 || {
          echo "::error::git is required to count the files Biome changes"
          printf 'status=%s\n' "failure" >> "$GITHUB_OUTPUT"
          exit 1
        }

        # Run the Biome the install step put in its prefix, by its path, and capture its exit code.
        # BIOME_BINARY would make the launcher run another binary.
        unset BIOME_BINARY
        [ -n "$BIOME_BIN" ] || {
          echo "::error::the install step named no Biome to run"
          printf 'status=%s\n' "failure" >> "$GITHUB_OUTPUT"
          exit 1
        }
        biome_exit_code=0
        "$BIOME_BIN" check --write . || biome_exit_code=$?

        # Count changed files using git diff
        files_changed=$(git diff --name-only | wc -l | tr -d ' ')

        # Fix mode commits what the tool fixed only when its exit status shows the run finished,
        # as eslint-lint does. ESLint tells problems it could not fix (1) from a failed run (2);
        # Biome exits 1 for both, and also for an invalid config or no files to check. The check
        # step tells them apart by the SARIF report Biome writes only for findings, but fix mode
        # asks for no report, so any non-zero status fails the step and nothing is committed.
        if [ "$biome_exit_code" -eq 0 ]; then
          status="success"
          if [ "$files_changed" -eq 0 ]; then
            echo "✅ No changes needed"
          else
            echo "✅ Fixed $files_changed file(s)"
          fi
        else
          status="failure"
          echo "::error::Biome fix failed with exit status $biome_exit_code"
        fi

        printf 'files_changed=%s\n' "$files_changed" >> "$GITHUB_OUTPUT"
        printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"

        [ "$status" != "failure" ] || exit "$biome_exit_code"

    - name: Commit and Push Fixes
      if: inputs.mode == 'fix' && success()
      uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
      env:
        GH_TOKEN: ${{ inputs.token || github.token }}
        # The empty helper drops any configured one, and the next answers git's credential request
        # from this step's environment.
        GIT_CONFIG_COUNT: '2'
        GIT_CONFIG_KEY_0: credential.helper
        GIT_CONFIG_VALUE_0: ''
        GIT_CONFIG_KEY_1: credential.helper
        GIT_CONFIG_VALUE_1: '!f() { test "$1" = get || return 0; echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
      with:
        commit_message: 'style: autofix Biome violations'
        commit_user_name: ${{ inputs.username }}
        commit_user_email: ${{ inputs.email }}
        add_options: '-u'
