# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
# permissions:
#   - contents: write          # Required for committing and pushing fixes
#   - security-events: write   # Required for uploading SARIF results
---
name: Ansible Lint and Fix
description: 'Lints and fixes Ansible playbooks, commits changes, and uploads SARIF report.'
author: 'Ismo Vuorinen'

branding:
  icon: 'play'
  color: 'green'

inputs:
  token:
    description: 'GitHub token for authentication. Stays in git config after checkout. Defaults to the workflow token.'
    required: false
    default: ''
  username:
    description: 'GitHub username for commits'
    required: false
    default: 'github-actions'
  email:
    description: 'GitHub email for commits'
    required: false
    default: 'github-actions@github.com'
  max-retries:
    description: 'Maximum number of retry attempts for pip install operations (1-10, must not be empty)'
    required: false
    default: '3'

outputs:
  files_changed:
    description: 'Number of files changed by linting'
    value: ${{ steps.lint.outputs.files_changed }}
  lint_status:
    description: 'Linting status (success/failure)'
    value: ${{ steps.lint.outputs.status }}
  sarif_path:
    description: 'Path to SARIF report file (empty when there were no Ansible files or ansible-lint did not finish)'
    value: ${{ steps.lint.outputs.finished == 'true' && 'ansible-lint.sarif' || '' }}

runs:
  using: composite
  steps:
    - name: Validate Inputs
      shell: sh
      working-directory: ${{ github.action_path }}
      env:
        INPUT_EMAIL: ${{ inputs.email }}
        INPUT_MAX_RETRIES: ${{ inputs.max-retries }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_USERNAME: ${{ inputs.username }}
      run: |
        set -eu
        if ! command -v python3 >/dev/null 2>&1; then
          echo "::error::python3 is required to validate inputs"
          exit 1
        fi
        python3 validate.py

    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ inputs.token || github.token }}
        # git-auto-commit-action pushes the auto-fix commit using the token that
        # actions/checkout persists in .git/config; persist-credentials must stay
        # true or the "Commit Fixes" step cannot authenticate its push.
        persist-credentials: true # zizmor: ignore[artipacked]

    - name: Check for Ansible Files
      id: check-files
      shell: sh
      run: |
        set -eu

        # Detect Ansible-specific indicators rather than any YAML file
        _has_ansible=false

        # Check for Ansible config or canonical entry-point files
        if find . \( -name "ansible.cfg" -o -name "site.yml" -o -name "playbook.yml" \) -type f | grep -q .; then
          _has_ansible=true
        fi

        # Check for Ansible-specific directories
        if [ "$_has_ansible" = "false" ] && find . \( -name "roles" -o -name "playbooks" -o -name "tasks" -o -name "handlers" \) -type d | grep -q .; then
          _has_ansible=true
        fi

        # Check YAML content for Ansible play syntax
        if [ "$_has_ansible" = "false" ] && find . \( -name "*.yml" -o -name "*.yaml" \) -type f -exec grep -lE "^- hosts:|^  hosts:" {} + 2>/dev/null | grep -q .; then
          _has_ansible=true
        fi

        if [ "$_has_ansible" = "true" ]; then
          printf 'files_found=%s\n' "true" >> "$GITHUB_OUTPUT"
          echo "Found Ansible files, proceeding with lint and fix."
        else
          printf 'files_found=%s\n' "false" >> "$GITHUB_OUTPUT"
          echo "No Ansible files detected. Skipping lint and fix."
        fi

    - name: Setup Python
      if: steps.check-files.outputs.files_found == 'true'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.14'

    - name: Install ansible-lint
      id: install-ansible-lint
      if: steps.check-files.outputs.files_found == 'true'
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
      with:
        timeout_minutes: 5
        max_attempts: ${{ inputs.max-retries }}
        # nick-fields/retry runs PowerShell on Windows unless told otherwise, and refuses sh there.
        shell: bash
        # requirements.lock.txt is generated from requirements.in by the command in its header.
        # --only-binary keeps a package's setup.py from running, which hash checking alone does not.
        command: |
          set -eu
          command -v pip >/dev/null 2>&1 || { echo "::error::pip is required to install ansible-lint"; exit 1; }
          pip install --require-hashes --only-binary=:all: -r "$ACTION_PATH/requirements.lock.txt"

    - name: Run ansible-lint
      if: steps.check-files.outputs.files_found == 'true'
      id: lint
      shell: sh
      run: |
        set -eu

        command -v git >/dev/null 2>&1 || {
          echo "::error::git is required to count the files ansible-lint changes"
          printf 'status=%s\n' "failure" >> "$GITHUB_OUTPUT"
          exit 1
        }

        # Run ansible-lint and capture exit code
        command -v ansible-lint >/dev/null 2>&1 || {
          echo "::error::ansible-lint is required to lint the playbooks"
          printf 'status=%s\n' "failure" >> "$GITHUB_OUTPUT"
          exit 1
        }
        # The report path is a public output, so the report stays there. A branch can commit that
        # path as a symlink, which the redirect would follow, so it is removed first.
        rm -f ansible-lint.sarif
        lint_exit_code=0
        ansible-lint --write --format sarif > ansible-lint.sarif || lint_exit_code=$?

        # ansible-lint exits 2 when violations remain after --write. Any other non-zero status
        # means it did not finish (3 invalid config, 4 lock timeout, 5 no files matched, 1 a
        # crash), so the step fails with no count, nothing committed and no report uploaded: an
        # incomplete one would close the alerts of the issues it did not see.
        if [ "$lint_exit_code" -ne 0 ] && [ "$lint_exit_code" -ne 2 ]; then
          echo "::error::ansible-lint failed with exit status $lint_exit_code"
          printf 'status=%s\n' "failure" >> "$GITHUB_OUTPUT"
          exit "$lint_exit_code"
        fi

        # Count files changed by linting
        files_changed=$(git diff --name-only | wc -l | tr -d '[:space:]')
        printf 'files_changed=%s\n' "$files_changed" >> "$GITHUB_OUTPUT"

        # It finished, so what it fixed is committed and its report uploaded, as eslint-lint
        # does; Fail on Violations then ends the job when violations remain.
        if [ "$lint_exit_code" -eq 0 ]; then
          printf 'status=%s\n' "success" >> "$GITHUB_OUTPUT"
        else
          printf 'status=%s\n' "failure" >> "$GITHUB_OUTPUT"
        fi
        printf 'finished=%s\n' "true" >> "$GITHUB_OUTPUT"

    - name: Commit Fixes
      if: steps.check-files.outputs.files_found == 'true' && steps.lint.outputs.finished == 'true'
      uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
      with:
        commit_message: 'style: apply ansible lint fixes'
        commit_user_name: ${{ inputs.username }}
        commit_user_email: ${{ inputs.email }}
        add_options: '-u'
        # A report committed by an older run is tracked, so -u alone would stage it again.
        file_pattern: '. :(exclude)ansible-lint.sarif'

    - name: Upload SARIF Report
      if: steps.check-files.outputs.files_found == 'true' && steps.lint.outputs.finished == 'true'
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: ansible-lint.sarif

    - name: Fail on Violations
      if: steps.lint.outputs.finished == 'true' && steps.lint.outputs.status == 'failure'
      shell: sh
      run: |
        set -eu
        echo "::error::ansible-lint found violations that --write could not fix"
        exit 1
