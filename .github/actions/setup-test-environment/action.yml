---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Setup Test Environment
description: Common setup for test jobs (Python, Node, system tools, ShellSpec)

inputs:
  install-act:
    description: Whether to install act for integration tests
    required: false
    default: 'false'
  install-kcov:
    description: Whether to build and install kcov v43 for coverage, compiled from its repository
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: pyproject.toml

    - name: Install Python dependencies
      shell: sh
      run: |
        set -eu
        command -v uv >/dev/null 2>&1 || { echo "::error::uv is required to install the Python dependencies"; exit 1; }
        uv sync --frozen

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: npm

    - name: Install Node dependencies
      shell: sh
      run: |
        set -eu
        command -v npm >/dev/null 2>&1 || { echo "::error::npm is required to install the Node dependencies"; exit 1; }
        # No package in the lock needs an install script.
        npm ci --ignore-scripts

    - name: Install system tools
      shell: sh
      run: |
        set -eu
        command -v sudo >/dev/null 2>&1 || { echo "::error::sudo is required to install system tools"; exit 1; }
        command -v apt-get >/dev/null 2>&1 || { echo "::error::apt-get is required to install system tools"; exit 1; }
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends jq shellcheck

    - name: Install shfmt
      shell: sh
      env:
        # Update the SHA-256 values below with each version.
        # renovate: datasource=github-releases depName=mvdan/sh extractVersion=^v(?<version>.+)$
        SHFMT_VERSION: '3.14.1'
      run: |
        set -eu

        # The posix-shell tests parse each run: script with shfmt (_tests/unit/posix-shell/find_unchecked_tools.py).
        # The release publishes no checksum file, so each binary's SHA-256 is pinned here.
        case "$(uname -m)" in
          x86_64) SHFMT_ARCH="amd64"; EXPECTED_CHECKSUM="76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf" ;;
          aarch64 | arm64) SHFMT_ARCH="arm64"; EXPECTED_CHECKSUM="5f2db09dae91fca848f7adbdd014632e921a383863a2ad7e0450ad3aba0c6489" ;;
          *) echo "::error::shfmt has no pinned binary for $(uname -m)"; exit 1 ;;
        esac
        SHFMT_URL="https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_${SHFMT_ARCH}"

        command -v curl >/dev/null 2>&1 || { echo "::error::curl is required to download shfmt"; exit 1; }
        command -v sha256sum >/dev/null 2>&1 || { echo "::error::sha256sum is required to verify shfmt"; exit 1; }
        command -v sudo >/dev/null 2>&1 || { echo "::error::sudo is required to install shfmt into /usr/local/bin"; exit 1; }
        command -v install >/dev/null 2>&1 || { echo "::error::install is required to install shfmt into /usr/local/bin"; exit 1; }

        # RUNNER_TEMP belongs to this job, so no other user of the machine can swap the file
        # between the checksum and the install, as it could at a fixed path in /tmp.
        shfmt_file="${RUNNER_TEMP:?}/shfmt"
        curl --proto '=https' --tlsv1.2 -fsSL "$SHFMT_URL" -o "$shfmt_file"
        ACTUAL_CHECKSUM="$(sha256sum "$shfmt_file" | awk '{print $1}')"
        if [ "$ACTUAL_CHECKSUM" != "$EXPECTED_CHECKSUM" ]; then
          echo "::error::Checksum mismatch for shfmt ${SHFMT_VERSION}: expected ${EXPECTED_CHECKSUM}, got ${ACTUAL_CHECKSUM}"
          rm -f "$shfmt_file"
          exit 1
        fi
        sudo install -m 755 "$shfmt_file" /usr/local/bin/shfmt
        rm -f "$shfmt_file"

        command -v shfmt >/dev/null 2>&1 || { echo "::error::shfmt is not on PATH after its install"; exit 1; }
        shfmt --version

    - name: Install kcov from source
      if: inputs.install-kcov == 'true'
      shell: sh
      run: |
        set -eu
        command -v sudo >/dev/null 2>&1 || { echo "::error::sudo is required to install the kcov build dependencies"; exit 1; }
        command -v apt-get >/dev/null 2>&1 || { echo "::error::apt-get is required to install the kcov build dependencies"; exit 1; }
        echo "Installing kcov build dependencies..."
        sudo apt-get install -y --no-install-recommends \
          cmake \
          libcurl4-openssl-dev \
          libdw-dev \
          libelf-dev \
          libiberty-dev \
          libssl-dev \
          pkg-config \
          zlib1g-dev

        # v43: v42 asks for CMake below 3.5, which CMake 4 on the runner image no longer accepts.
        echo "Building kcov from source..."
        # A new directory of this step's own, which nothing else on the machine can fill
        # before the build, as it could a fixed path in /tmp.
        command -v mktemp >/dev/null 2>&1 || { echo "::error::mktemp is required to build kcov"; exit 1; }
        work=$(mktemp -d "${RUNNER_TEMP:?}/kcov.XXXXXX")
        cd "$work"
        command -v git >/dev/null 2>&1 || { echo "::error::git is required to fetch the kcov source"; exit 1; }
        git clone --depth 1 --branch v43 https://github.com/SimonKagstrom/kcov.git
        git -C kcov checkout a39874f938ce13f7a65f253120d1ec946b349ffe
        cd kcov
        mkdir build
        cd build
        command -v cmake >/dev/null 2>&1 || { echo "::error::cmake is required to build kcov"; exit 1; }
        cmake ..
        make
        sudo make install
        cd /
        rm -rf "$work"

        echo "Verifying kcov installation..."
        command -v kcov >/dev/null 2>&1 || { echo "::error::kcov is not on PATH after its install"; exit 1; }
        kcov --version

    - name: Install ShellSpec
      shell: sh
      env:
        # Update EXPECTED_CHECKSUM below with each version.
        # renovate: datasource=github-tags depName=shellspec/shellspec
        SHELLSPEC_VERSION: '0.28.1'
      run: |
        set -eu

        SHELLSPEC_URL="https://github.com/shellspec/shellspec/archive/refs/tags/${SHELLSPEC_VERSION}.tar.gz"
        # SHA-256 of the 0.28.1 source archive at SHELLSPEC_URL.
        EXPECTED_CHECKSUM="400d835466429a5fe6c77a62775a9173729d61dd43e05dfa893e8cf6cb511783"

        command -v curl >/dev/null 2>&1 || { echo "::error::curl is required to download ShellSpec"; exit 1; }
        command -v sha256sum >/dev/null 2>&1 || { echo "::error::sha256sum is required to verify ShellSpec"; exit 1; }
        command -v tar >/dev/null 2>&1 || { echo "::error::tar is required to unpack ShellSpec"; exit 1; }
        command -v sudo >/dev/null 2>&1 || { echo "::error::sudo is required to link ShellSpec into /usr/local/bin"; exit 1; }
        command -v mktemp >/dev/null 2>&1 || { echo "::error::mktemp is required to download ShellSpec"; exit 1; }

        # A new directory of this step's own: nothing else on the machine can swap the archive
        # between the checksum and the unpack, as it could at a fixed path in /tmp.
        work=$(mktemp -d "${RUNNER_TEMP:?}/shellspec.XXXXXX")
        echo "Downloading ShellSpec ${SHELLSPEC_VERSION}..."
        curl --proto '=https' --tlsv1.2 -fsSL "${SHELLSPEC_URL}" -o "${work}/shellspec.tar.gz"

        echo "Verifying checksum..."
        ACTUAL_CHECKSUM="$(sha256sum "${work}/shellspec.tar.gz" | awk '{print $1}')"
        if [ "${ACTUAL_CHECKSUM}" != "${EXPECTED_CHECKSUM}" ]; then
          echo "::error::Checksum mismatch for ShellSpec ${SHELLSPEC_VERSION}: expected ${EXPECTED_CHECKSUM}, got ${ACTUAL_CHECKSUM}"
          rm -rf "$work"
          exit 1
        fi
        echo "Checksum verified successfully"

        echo "Installing ShellSpec..."
        mkdir -p ~/.local/lib
        tar -xzf "${work}/shellspec.tar.gz" -C ~/.local/lib
        mv ~/.local/lib/shellspec-"${SHELLSPEC_VERSION}" ~/.local/lib/shellspec
        rm -rf "$work"

        sudo ln -s ~/.local/lib/shellspec/shellspec /usr/local/bin/shellspec

    - name: Install act
      if: inputs.install-act == 'true'
      shell: sh
      env:
        # Update the SHA-256 values below with each version.
        # renovate: datasource=github-releases depName=nektos/act extractVersion=^v(?<version>.+)$
        ACT_VERSION: '0.2.82'
      run: |
        set -eu

        # The release's checksums.txt would be replaced along with an archive, so each archive's
        # SHA-256 is pinned here.
        case "$(uname -m)" in
          x86_64) ACT_ARCH="x86_64"; EXPECTED_CHECKSUM="76645c0bbe4bb69a8f0ba3caefa681b2f4c04babd4679c67861af9a276a3561f" ;;
          aarch64 | arm64) ACT_ARCH="arm64"; EXPECTED_CHECKSUM="ebf375e700f6f2c139fe3c5508af2ec85032a75e7d29f6a388a58c0fab76e951" ;;
          *) echo "::error::act has no pinned archive for $(uname -m)"; exit 1 ;;
        esac
        ACT_TARBALL="act_Linux_${ACT_ARCH}.tar.gz"
        ACT_URL="https://github.com/nektos/act/releases/download/v${ACT_VERSION}/${ACT_TARBALL}"

        command -v curl >/dev/null 2>&1 || { echo "::error::curl is required to download act"; exit 1; }
        command -v sha256sum >/dev/null 2>&1 || { echo "::error::sha256sum is required to verify act"; exit 1; }
        command -v tar >/dev/null 2>&1 || { echo "::error::tar is required to unpack act"; exit 1; }
        command -v sudo >/dev/null 2>&1 || { echo "::error::sudo is required to install act into /usr/local/bin"; exit 1; }
        command -v install >/dev/null 2>&1 || { echo "::error::install is required to install act into /usr/local/bin"; exit 1; }
        command -v mktemp >/dev/null 2>&1 || { echo "::error::mktemp is required to download act"; exit 1; }

        # A new directory of this step's own: nothing else on the machine can swap the archive
        # between the checksum and the install, as it could at a fixed path in /tmp.
        work=$(mktemp -d "${RUNNER_TEMP:?}/act.XXXXXX")
        echo "Downloading act v${ACT_VERSION}..."
        curl --proto '=https' --tlsv1.2 -fsSL "${ACT_URL}" -o "${work}/${ACT_TARBALL}"

        echo "Verifying checksum..."
        ACTUAL_CHECKSUM="$(sha256sum "${work}/${ACT_TARBALL}" | awk '{print $1}')"
        if [ "${ACTUAL_CHECKSUM}" != "${EXPECTED_CHECKSUM}" ]; then
          echo "::error::Checksum mismatch for act ${ACT_VERSION}: expected ${EXPECTED_CHECKSUM}, got ${ACTUAL_CHECKSUM}"
          rm -rf "$work"
          exit 1
        fi
        echo "Checksum verified successfully"

        echo "Installing act..."
        tar -xzf "${work}/${ACT_TARBALL}" -C "$work" act
        sudo install -m 755 "${work}/act" /usr/local/bin/act
        rm -rf "$work"

        echo "Verifying act installation..."
        command -v act >/dev/null 2>&1 || { echo "::error::act is not on PATH after its install"; exit 1; }
        act --version

    - name: Check Docker for act
      if: inputs.install-act == 'true'
      shell: sh
      run: |
        set -eu
        # act pulls the runner image _tests/run-tests.sh pins by digest when it first runs.
        command -v docker >/dev/null 2>&1 || { echo "::error::docker is required to run act"; exit 1; }
        docker ps > /dev/null 2>&1 || { echo "::error::Docker is not running"; exit 1; }

    - name: Verify tools
      shell: sh
      env:
        INSTALL_ACT: ${{ inputs.install-act }}
      run: |
        set -eu
        command -v shellspec >/dev/null 2>&1 || { echo "::error::shellspec is not on PATH"; exit 1; }
        command -v jq >/dev/null 2>&1 || { echo "::error::jq is not on PATH"; exit 1; }
        command -v uv >/dev/null 2>&1 || { echo "::error::uv is not on PATH"; exit 1; }
        command -v shfmt >/dev/null 2>&1 || { echo "::error::shfmt is not on PATH"; exit 1; }
        shellspec --version
        jq --version
        uv --version
        shfmt --version
        if [ "$INSTALL_ACT" = "true" ]; then
          command -v act >/dev/null 2>&1 || { echo "::error::act is not on PATH"; exit 1; }
          command -v docker >/dev/null 2>&1 || { echo "::error::docker is not on PATH"; exit 1; }
          act --version
          docker --version
        fi
