---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Action Security

on:
  push:
    branches:
      - main
    # The actions and the workflows the scan lints, and the configs it reads. One glob covers every config
    # name jactionlint takes (jactionlint.yaml, jactionlint.yml, actionlint.yaml, actionlint.yml): a filter
    # must match a file that exists, which action-validator checks.
    paths:
      - '**/action.yml'
      - 'security-scan/**'
      - '.github/workflows/**'
      - '.github/*actionlint.y*ml'
      - '.gitleaks.toml'
  pull_request:
    paths:
      - '**/action.yml'
      - 'security-scan/**'
      - '.github/workflows/**'
      - '.github/*actionlint.y*ml'
      - '.gitleaks.toml'
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: Analyze Action Security
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      actions: read
      security-events: write
      # For the comment on the inline gitleaks:allow comments a pull request adds
      pull-requests: write

    outputs:
      critical_issues: ${{ steps.security-scan.outputs.critical_issues }}
      total_issues: ${{ steps.security-scan.outputs.total_issues }}
      has_trivy_results: ${{ steps.security-scan.outputs.has_trivy_results }}
      has_gitleaks_results: ${{ steps.security-scan.outputs.has_gitleaks_results }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Security Scan
        id: security-scan
        uses: ./security-scan
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # In a job of its own, so that the job running the scan, which on a pull request is the pull
  # request's own copy of the action, holds only the scopes the scan uses, and not issues: write.
  notify:
    name: Notify on Critical Issues
    needs: analyze
    if: failure() && needs.analyze.outputs.critical_issues != '' && needs.analyze.outputs.critical_issues != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      issues: write

    steps:
      - name: Open an issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CRITICAL_ISSUES: ${{ needs.analyze.outputs.critical_issues }}
          TOTAL_ISSUES: ${{ needs.analyze.outputs.total_issues }}
          HAS_TRIVY_RESULTS: ${{ needs.analyze.outputs.has_trivy_results }}
          HAS_GITLEAKS_RESULTS: ${{ needs.analyze.outputs.has_gitleaks_results }}
        with:
          script: |-
            const { repo, owner } = context.repo;
            const critical = process.env.CRITICAL_ISSUES;
            // Empty when a scanner left no report to count; the critical count is then a floor.
            const total = process.env.TOTAL_ISSUES;
            const outOf = total ? `(out of ${total} total)` : '(not every scanner left a report, so there is no total)';
            const trivyStatus = process.env.HAS_TRIVY_RESULTS === 'true' ? 'Completed' : 'Skipped/Failed';
            const gitleaksStatus = process.env.HAS_GITLEAKS_RESULTS === 'true' ? 'Completed' : 'Skipped/Failed';

            const body = `🚨 Critical security issues found in GitHub Actions

            ${critical} critical security issues ${outOf} were found during the security scan.

            ### Scan Results
            - Trivy: ${trivyStatus}
            - Gitleaks: ${gitleaksStatus}

            [View detailed scan results](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})

            Please address these issues immediately.

            > Note: A scanner marked Skipped/Failed left no report. Check the workflow run for details.`;

            await github.rest.issues.create({
              owner,
              repo,
              title: '🚨 Critical Security Issues in Actions',
              body,
              labels: ['security', 'critical', 'actions'],
              assignees: ['ivuorinen']
            });
