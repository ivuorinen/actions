---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build Testing Docker Image

on:
  push:
    branches:
      - main
    paths:
      - '_tools/docker-testing-tools/**'
      - '.github/workflows/build-testing-image.yml'
  pull_request:
    branches:
      - main
    paths:
      - '_tools/docker-testing-tools/**'
      - '.github/workflows/build-testing-image.yml'
  # checkov:skip=CKV_GHA_7:tag input is a choice that feeds docker/metadata-action only, never shell
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag'
        required: false
        default: 'latest'
        type: choice
        options:
          - latest

permissions: {}

jobs:
  build-and-push:
    name: Build and Push Testing Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        env:
          # buildx runs the BuildKit daemon from this image with --privileged, so it is pinned by
          # digest, the same image docker-build and docker-publish pin.
          # renovate: datasource=docker depName=moby/buildkit
          BUILDKIT_IMAGE_TAG: 'v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe'
        with:
          # A no-op flag that has to stay non-empty: an empty value restores setup-buildx's
          # defaults, which allow insecure entitlements on the daemon.
          buildkitd-flags: '--oci-worker=auto'
          driver-opts: |
            image=moby/buildkit:${{ env.BUILDKIT_IMAGE_TAG }}

      # A pull request run builds without pushing, so it needs no registry credentials.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/actions
          tags: |
            type=ref,event=branch,suffix=-testing-tools
            type=ref,event=pr,suffix=-testing-tools
            type=raw,value=testing-tools,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: _tools/docker-testing-tools
          file: _tools/docker-testing-tools/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      # By the digest this run pushed: the tag can already name another run's image, or main's
      # image on a dispatch from another branch.
      - name: Test image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/actions@${{ steps.build.outputs.digest }}
        run: |
          set -eu
          command -v docker >/dev/null 2>&1 || { echo "::error::docker is required to test the image"; exit 1; }
          docker run --rm "$IMAGE" shellspec --version
          docker run --rm "$IMAGE" act --version
          docker run --rm "$IMAGE" trivy --version

      - name: Generate image summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "## 🐋 Docker Image Built Successfully"
            echo ""
            echo "**Image**: \`ghcr.io/${REPOSITORY_OWNER}/actions:testing-tools\`"
            echo "**Tags**: ${STEPS_META_OUTPUTS_TAGS}"
            echo ""
            echo "### Usage in GitHub Actions"
            echo ""
            echo "\`\`\`yaml"
            echo "jobs:"
            echo "  test:"
            echo "    runs-on: ubuntu-latest"
            echo "    container: ghcr.io/${REPOSITORY_OWNER}/actions:testing-tools"
            echo "    steps:"
            echo "      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1"
            echo "      - run: shellspec _tests/unit/your-action/"
            echo "\`\`\`"
            echo ""
            echo "### Pre-installed Tools"
            echo "- ShellSpec, shfmt, nektos/act, Trivy, TruffleHog, actionlint and GitHub CLI, at the versions the Dockerfile pins"
            echo "- shellcheck, jq, kcov"
            echo "- Node.js LTS, Python 3, build tools"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          STEPS_META_OUTPUTS_TAGS: ${{ steps.meta.outputs.tags }}
