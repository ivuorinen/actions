---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Docs Drift Check

on:
  pull_request:
    # Every input of make docs: the actions, the READMEs, the tooling, and what the generator
    # and its post-processing read (the input examples come from _validation/).
    paths:
      - '**/action.yml'
      - '**/README.md'
      - .nvmrc
      - package.json
      - package-lock.json
      - Makefile
      - .gh-action-readme.yaml
      - .prettierrc.yml
      - _tools/fix-generated-readme.py
      - _validation/kit.py
      - _validation/spec.py

permissions: {}

jobs:
  docs-drift:
    name: Action README drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned tooling
        # No package in the lock needs an install script.
        run: |
          set -eu
          command -v npm >/dev/null 2>&1 || { echo "::error::npm is required to install the tooling"; exit 1; }
          npm ci --ignore-scripts

      - name: Regenerate action documentation
        run: |
          set -eu
          # npm ci installed the pinned prettier, which also formats the tables.
          # `make docs` additionally downloads the pinned, checksum-verified
          # gh-action-readme binary, generates each action README and formats it
          # in place, so its output is the committed style and this gate stays
          # reproducible.
          make docs

      - name: Check for action README drift
        # bash with pipefail: under the default shell a failing find would leave the
        # pipeline's status at 0 and the check would pass.
        shell: bash
        run: |
          set -eu
          # Only generated action READMEs (dirs that contain an action.yml) are
          # gated; formatting drift in other docs is out of scope for this check.
          # git status also names a README the pull request deleted, which make docs
          # wrote back as an untracked file; git diff would pass it.
          drift=$(find . -mindepth 2 -maxdepth 2 -name action.yml \
            | sed 's|/action.yml|/README.md|' \
            | while IFS= read -r readme; do
                [ -z "$(git status --porcelain -- "$readme")" ] || printf '%s\n' "$readme"
              done)
          if [ -n "$drift" ]; then
            echo "::error::Action README(s) are out of date. Run 'make docs' and commit the result." >&2
            printf 'Stale: %s\n' "$drift" >&2
            exit 1
          fi
          echo "All action READMEs are up to date."
