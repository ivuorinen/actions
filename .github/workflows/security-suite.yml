---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: PR Security Analysis

on:
  pull_request:
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '**/Dockerfile'
      - '**/*.py'
      - '**/*.js'
      - '**/*.yml'
      - '**/*.yaml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-analysis:
    name: Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The analysis comment on the pull request; the issues comment API accepts this scope.
      pull-requests: write

    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Fetch PR Base
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          # The token stays off the command line, where any process can read argv: the empty
          # helper drops any configured one, and the next answers git's credential request from
          # the environment.
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: credential.helper
          GIT_CONFIG_VALUE_1: '!f() { test "$1" = get || return 0; echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
        run: |
          set -eu
          # Fetch the base ref from base repository with authentication (works for private repos and forked PRs)
          # Using ref instead of SHA because git fetch requires ref names, not raw commit IDs
          # Authenticate to avoid 403/404 on private repositories
          # Fetch full history: a shallow base tip has no merge base with the PR
          # head, which breaks the base...HEAD diff below once the base branch
          # moves ahead and stops TruffleHog from resolving its scan range.
          git fetch --no-tags \
            "https://github.com/${PR_BASE_REPO}" \
            "${PR_BASE_REF}:refs/remotes/origin-base/${PR_BASE_REF}"
          # Record the base commit for diffing without checking it out
          # Keep PR head checked out so scanners analyze the new changes
          BASE_REF="refs/remotes/origin-base/${PR_BASE_REF}"
          printf 'BASE_REF=%s\n' "${BASE_REF}" >> "$GITHUB_ENV"
          printf 'Base ref: %s\n' "${BASE_REF}"
          git log -1 --oneline "${BASE_REF}"

      # The analysis below takes reports/dependency-check-report.json as the sign that the scan
      # ran, so a report the pull request commits must not stand in for one.
      - name: Remove reports from the checkout
        if: github.event_name == 'pull_request'
        run: |
          set -eu
          rm -rf reports

      - name: OWASP Dependency Check
        # Only run on pull_request, not pull_request_target to prevent executing
        # untrusted third-party code against PR head from forks.
        # Dependency-Check_Action ran this image at its floating latest tag, and dropped the
        # out and args inputs it does not define. latest is the image's only tag, rebuilt with
        # a fresh vulnerability database (the scan runs with --noupdate), so it is pinned by
        # digest. On its schedule, Renovate raises a reviewable pull request that moves the
        # digest to the newest rebuild; .github/renovate.json lets that update through.
        if: github.event_name == 'pull_request'
        uses: docker://owasp/dependency-check-action:latest@sha256:5422d3a56a8c37dd020414b257bca81a01c3ce99557e0c065821cd5973ebdaf3
        with:
          args: >-
            --project "PR Security Analysis" --scan . --format JSON --out /github/workspace/reports --noupdate
            --enableRetired --enableExperimental --failOnCVSS 0
        continue-on-error: true

      - name: Opengrep Static Analysis
        id: opengrep
        # Opengrep is the open-source (LGPL) fork of Semgrep CE and runs the same
        # Semgrep-compatible rules. Installed from the pinned release binary,
        # verified by SHA-256, rather than a floating install-script ref — this
        # keeps the pin-everything trust root (a release tag is mutable; the
        # digest is not). 'p/default' is the public registry ruleset resolvable
        # without an account token. It is fetched on each run, so its rules move
        # with the registry: coverage can change without a change here. Update
        # OPENGREP_SHA256 with OPENGREP_VERSION.
        # The binary goes in a new directory of this step's own, so nothing else
        # on the runner can swap it between the checksum and the run, as it could
        # at a fixed path in /tmp.
        env:
          # renovate: datasource=github-releases depName=opengrep/opengrep
          OPENGREP_VERSION: v1.22.0
          OPENGREP_SHA256: 45bcd58440e397ed52c50e953ccf5948909ea77087c9186fc7d277216f62e319
        run: |
          set -eu
          tools=$(mktemp -d "${RUNNER_TEMP:?}/opengrep.XXXXXX")
          curl --proto '=https' --tlsv1.2 -fsSL -o "${tools}/opengrep" \
            "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          printf '%s  %s\n' "$OPENGREP_SHA256" "${tools}/opengrep" | sha256sum -c -
          chmod +x "${tools}/opengrep"
          # The report goes outside the checkout, where a committed symlink of its name
          # would redirect the write.
          "${tools}/opengrep" scan --config p/default --sarif-output="${RUNNER_TEMP}/opengrep.sarif" .
        continue-on-error: true

      - name: TruffleHog Secret Scan
        id: trufflehog
        # The upstream action scans inside `docker run` and leaves its results only
        # in the log, so the analysis below could never read them. Installed from
        # the pinned release archive, verified by SHA-256, as Opengrep is above.
        # Update TRUFFLEHOG_SHA256 with TRUFFLEHOG_VERSION.
        env:
          # renovate: datasource=github-releases depName=trufflesecurity/trufflehog extractVersion=^v(?<version>.+)$
          TRUFFLEHOG_VERSION: 3.99.7
          TRUFFLEHOG_SHA256: bdbea0508e439b144f49de14e775908de5f902f3d14ea7ae8354bae72b0b72ef
        run: |
          set -eu
          tools=$(mktemp -d "${RUNNER_TEMP:?}/trufflehog.XXXXXX")
          archive="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "${tools}/${archive}" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/${archive}"
          printf '%s  %s\n' "$TRUFFLEHOG_SHA256" "${tools}/${archive}" | sha256sum -c -
          tar -xzf "${tools}/${archive}" -C "$tools" trufflehog
          # TruffleHog scans a clone, which has no refs/remotes, so the base goes in
          # as a commit hash. Without --fail-on-scan-errors, a scan that cannot
          # resolve its range exits 0 having scanned nothing.
          base_sha=$(git rev-parse "$BASE_REF")
          "${tools}/trufflehog" git "file://${PWD}" --since-commit "$base_sha" --branch HEAD \
            --only-verified --json --no-update --fail-on-scan-errors \
            > "${RUNNER_TEMP}/trufflehog_output.json"
        continue-on-error: true

      - name: Analyze Security Results
        id: analyze
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OPENGREP_OUTCOME: ${{ steps.opengrep.outcome }}
          TRUFFLEHOG_OUTCOME: ${{ steps.trufflehog.outcome }}
        with:
          script: |-
            const fs = require('fs');
            const path = require('path');

            // Unique marker to identify our bot comment
            const SECURITY_COMMENT_MARKER = '<!-- security-analysis-bot-comment -->';

            const findings = {
              permissions: [],
              actions: [],
              secrets: [],
              vulnerabilities: [],
              dependencies: []
            };

            // Analyze GitHub Actions permission changes
            // git runs with an argument list, not a shell command line: a changed file's name
            // comes from the pull request.
            const { execFileSync } = require('child_process');
            const baseRef = process.env.BASE_REF;
            try {
              const changedWorkflows = execFileSync('git', ['diff', '--name-only', `${baseRef}...HEAD`], { encoding: 'utf8' })
                .split('\n')
                .filter((file) => /\.github\/workflows\/.*\.ya?ml$/.test(file));

              for (const workflow of changedWorkflows) {
                try {
                  // A workflow the pull request adds has no base version: everything in it is new.
                  let oldContent = '';
                  try {
                    oldContent = execFileSync('git', ['show', `${baseRef}:${workflow}`], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] });
                  } catch {
                    oldContent = '';
                  }
                  const newContent = fs.readFileSync(workflow, 'utf8');

                  // Simple permission extraction (could be enhanced with YAML parsing)
                  const oldPerms = oldContent.match(/permissions:\s*\n([\s\S]*?)(?=\n\w|\n$|$)/);
                  const newPerms = newContent.match(/permissions:\s*\n([\s\S]*?)(?=\n\w|\n$|$)/);

                  if (oldPerms?.[1] !== newPerms?.[1]) {
                    findings.permissions.push({
                      file: workflow,
                      old: oldPerms?.[1]?.trim() || 'None',
                      new: newPerms?.[1]?.trim() || 'None'
                    });
                  }

                  // Check for new actions
                  const oldActions = [...oldContent.matchAll(/uses:\s*([^\s\n]+)/g)].map(m => m[1]);
                  const newActions = [...newContent.matchAll(/uses:\s*([^\s\n]+)/g)].map(m => m[1]);
                  const addedActions = newActions.filter(action => !oldActions.includes(action));

                  if (addedActions.length > 0) {
                    findings.actions.push({
                      file: workflow,
                      added: addedActions
                    });
                  }
                } catch (error) {
                  console.log(`Could not analyze ${workflow}: ${error.message}`);
                }
              }
            } catch (error) {
              console.log('No workflow changes detected');
            }

            // Parse OWASP Dependency Check results
            try {
              const owaspResults = JSON.parse(fs.readFileSync('reports/dependency-check-report.json', 'utf8'));
              if (owaspResults.dependencies) {
                owaspResults.dependencies.forEach(dep => {
                  if (dep.vulnerabilities && dep.vulnerabilities.length > 0) {
                    dep.vulnerabilities.forEach(vuln => {
                      findings.dependencies.push({
                        file: dep.fileName || 'Unknown',
                        cve: vuln.name,
                        severity: vuln.severity || 'Unknown',
                        description: vuln.description || 'No description'
                      });
                    });
                  }
                });
              }
            } catch (error) {
              console.log('No OWASP results found');
            }

            // Parse Opengrep SARIF results
            const opengrepSarif = `${process.env.RUNNER_TEMP}/opengrep.sarif`;
            try {
              if (fs.existsSync(opengrepSarif)) {
                const sarifContent = JSON.parse(fs.readFileSync(opengrepSarif, 'utf8'));
                if (sarifContent.runs && sarifContent.runs[0] && sarifContent.runs[0].results) {
                  const run = sarifContent.runs[0];
                  const rules = run.tool?.driver?.rules || [];
                  run.results.forEach(result => {
                    const rule = rules.find(r => r.id === result.ruleId);
                    findings.vulnerabilities.push({
                      file: result.locations?.[0]?.physicalLocation?.artifactLocation?.uri || 'Unknown',
                      line: result.locations?.[0]?.physicalLocation?.region?.startLine || 0,
                      rule: result.ruleId,
                      severity: result.level?.toUpperCase() || 'INFO',
                      message: result.message?.text || rule?.shortDescription?.text || 'No description'
                    });
                  });
                }
              }
            } catch (error) {
              core.warning(`Failed to parse opengrep.sarif: ${error.message}`);
            }

            // Parse TruffleHog results (NDJSON format - one JSON object per line)
            try {
              const truffleFile = `${process.env.RUNNER_TEMP}/trufflehog_output.json`;
              const truffleOutput = fs.existsSync(truffleFile) ? fs.readFileSync(truffleFile, 'utf8') : '';
              const truffleLines = truffleOutput.trim().split('\n').filter(line => line.length > 0);

              truffleLines.forEach((line, index) => {
                try {
                  const result = JSON.parse(line);
                  findings.secrets.push({
                    file: result.SourceMetadata?.Data?.Git?.file || 'Unknown',
                    line: result.SourceMetadata?.Data?.Git?.line || 0,
                    detector: result.DetectorName,
                    verified: result.Verified || false
                  });
                } catch (parseError) {
                  // Log only safe metadata to avoid leaking secrets
                  console.log('Failed to parse TruffleHog line at index', index, '- Error:', parseError.message, '(line length:', line.length, 'chars)');
                }
              });

              if (truffleLines.length === 0) {
                console.log('No secrets detected');
              }
            } catch (error) {
              console.log('No TruffleHog output file found');
            }

            // Generate clean comment sections
            const sections = [];

            // A scanner that did not complete reports nothing, which must not read
            // as a clean result. OWASP exits non-zero when it finds anything
            // (--failOnCVSS 0), so its report, not its outcome, shows it ran. It also
            // writes the report when an analyzer fails, listing the failures in
            // scanInfo.analysisExceptions, so a report with any of those is incomplete too.
            const incompleteScans = [];
            let owaspComplete = false;
            try {
              const owaspReport = JSON.parse(fs.readFileSync('reports/dependency-check-report.json', 'utf8'));
              owaspComplete = (owaspReport.scanInfo?.analysisExceptions ?? []).length === 0;
            } catch {
              owaspComplete = false;
            }
            if (!owaspComplete) incompleteScans.push('OWASP Dependency Check');
            if (process.env.OPENGREP_OUTCOME !== 'success') incompleteScans.push('Opengrep');
            if (process.env.TRUFFLEHOG_OUTCOME !== 'success') incompleteScans.push('TruffleHog');
            core.setOutput('incomplete_scans', incompleteScans.join(', '));
            if (incompleteScans.length > 0) {
              sections.push(`## ⚠️ Incomplete Scans\n\nThese scanners did not complete, so their results are missing from this report: ${incompleteScans.join(', ')}. See the workflow log.`);
            }

            // GitHub Actions Permissions Changes
            if (findings.permissions.length > 0) {
              const permSection = ['## 🔐 GitHub Actions Permissions Changes'];
              findings.permissions.forEach(change => {
                permSection.push(`\n**${change.file}**:`);

                // Parse permissions into lines
                const oldLines = (change.old === 'None' ? [] : change.old.split('\n').map(l => l.trim()).filter(Boolean));
                const newLines = (change.new === 'None' ? [] : change.new.split('\n').map(l => l.trim()).filter(Boolean));

                // Create sets for comparison
                const oldSet = new Set(oldLines);
                const newSet = new Set(newLines);

                // Find added, removed, and unchanged
                const removed = oldLines.filter(l => !newSet.has(l));
                const added = newLines.filter(l => !oldSet.has(l));
                const unchanged = oldLines.filter(l => newSet.has(l));

                // Only show diff if there are actual changes
                if (removed.length > 0 || added.length > 0) {
                  permSection.push('```diff');

                  // Show removed permissions
                  removed.forEach(line => permSection.push(`- ${line}`));

                  // Show added permissions
                  added.forEach(line => permSection.push(`+ ${line}`));

                  permSection.push('```');

                  // Summary for context
                  if (unchanged.length > 0 && unchanged.length <= 3) {
                    permSection.push(`<details><summary>Unchanged (${unchanged.length})</summary>\n\n${unchanged.map(l => `- ${l}`).join('\n')}\n</details>`);
                  } else if (unchanged.length > 3) {
                    permSection.push(`<sub>*${unchanged.length} permissions unchanged*</sub>`);
                  }
                }
              });
              sections.push(permSection.join('\n'));
            }

            // New/Changed Actions
            if (findings.actions.length > 0) {
              const actionSection = ['## 🎯 New GitHub Actions'];
              findings.actions.forEach(change => {
                actionSection.push(`**${change.file}**:`);
                change.added.forEach(action => {
                  actionSection.push(`- \`${action}\``);
                });
              });
              sections.push(actionSection.join('\n'));
            }

            // Secrets Detected
            if (findings.secrets.length > 0) {
              const secretSection = ['## 🔑 Secrets Detected'];
              findings.secrets.forEach(secret => {
                const verified = secret.verified ? '🚨 **VERIFIED**' : '⚠️ Potential';
                secretSection.push(`- ${verified} ${secret.detector} in \`${secret.file}:${secret.line}\``);
              });
              sections.push(secretSection.join('\n'));
            }

            // Security Vulnerabilities
            if (findings.vulnerabilities.length > 0) {
              const vulnSection = ['## ⚠️ Security Vulnerabilities'];
              const groupedBySeverity = findings.vulnerabilities.reduce((acc, vuln) => {
                const sev = vuln.severity.toUpperCase();
                if (!acc[sev]) acc[sev] = [];
                acc[sev].push(vuln);
                return acc;
              }, {});

              ['ERROR', 'WARNING', 'INFO'].forEach(severity => {
                if (groupedBySeverity[severity]) {
                  vulnSection.push(`\n**${severity} Severity:**`);
                  groupedBySeverity[severity].forEach(vuln => {
                    vulnSection.push(`- \`${vuln.file}:${vuln.line}\` - ${vuln.message}`);
                    vulnSection.push(`  - Rule: \`${vuln.rule}\``);
                  });
                }
              });
              sections.push(vulnSection.join('\n'));
            }

            // Dependency Issues
            if (findings.dependencies.length > 0) {
              const depSection = ['## 📦 Dependency Vulnerabilities'];
              const groupedBySeverity = findings.dependencies.reduce((acc, dep) => {
                const sev = dep.severity.toUpperCase();
                if (!acc[sev]) acc[sev] = [];
                acc[sev].push(dep);
                return acc;
              }, {});

              ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW'].forEach(severity => {
                if (groupedBySeverity[severity]) {
                  depSection.push(`\n**${severity} Severity:**`);
                  groupedBySeverity[severity].forEach(dep => {
                    depSection.push(`- **${dep.cve}** in \`${dep.file}\``);
                    depSection.push(`  - ${dep.description.substring(0, 100)}...`);
                  });
                }
              });
              sections.push(depSection.join('\n'));
            }

            // Count critical issues for output
            const criticalCount =
              findings.secrets.filter(s => s.verified).length +
              (findings.vulnerabilities.filter(v => v.severity.toUpperCase() === 'ERROR').length || 0) +
              (findings.dependencies.filter(d => d.severity.toUpperCase() === 'CRITICAL').length || 0);

            // Export critical count as output
            core.setOutput('critical_issues', criticalCount.toString());

            // Generate final comment with unique marker
            let comment = `${SECURITY_COMMENT_MARKER}\n## ✅ Security Analysis\n\n`;
            if (sections.length === 0) {
              comment += 'No security issues detected in this PR.';
            } else {
              comment += sections.join('\n\n');
            }

            // Find existing security comment using unique marker
            // Every page: the API returns 30 comments at a time, and a long pull request
            // would otherwise get a second bot comment.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });

            const existingComment = comments.find(comment =>
              comment.body && comment.body.includes(SECURITY_COMMENT_MARKER)
            );

            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

      - name: Check Critical Issues
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CRITICAL_COUNT: ${{ steps.analyze.outputs.critical_issues || '0' }}
          INCOMPLETE_SCANS: ${{ steps.analyze.outputs.incomplete_scans }}
        with:
          script: |-
            const criticalCount = parseInt(process.env.CRITICAL_COUNT || '0', 10);
            const incompleteScans = process.env.INCOMPLETE_SCANS || '';

            if (incompleteScans) {
              core.setFailed(`These scanners did not complete: ${incompleteScans}. See the workflow log.`);
            }

            if (criticalCount > 0) {
              core.setFailed(`Found ${criticalCount} critical security issue(s). Please review and address them before merging.`);
            } else if (!incompleteScans) {
              console.log('No critical security issues found.');
            }
