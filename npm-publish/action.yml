# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
# permissions:
#   - packages: write  # Required for publishing to GitHub Packages
#   - contents: read   # Required for checking out repository
---
name: Publish to NPM
description: 'Publishes the package to the NPM registry with configurable scope and registry URL.'
author: 'Ismo Vuorinen'

branding:
  icon: package
  color: green

inputs:
  npm_token:
    description: 'NPM token, in any format the registry issues. Must not contain whitespace or control characters. Publish commands read it from NODE_AUTH_TOKEN; it is not written to disk or left for later steps. A committed .npmrc gets it from ${NODE_AUTH_TOKEN}, not ${NPM_TOKEN}.'
    required: true
  registry-url:
    description: 'Registry URL for publishing. Must be https:// (http:// only for localhost or 127.0.0.1), with no credentials, query, or fragment.'
    required: false
    default: 'https://registry.npmjs.org/'
  scope:
    description: 'Package scope to use.'
    required: false
    default: '@ivuorinen'
  package-version:
    description: 'The version to publish: X.Y.Z or vX.Y.Z, optionally with -prerelease and +build. Must match package.json.'
    required: false
    default: ${{ github.event.release.tag_name }}
  token:
    description: 'GitHub token for authentication'
    required: false
    default: ''

outputs:
  registry-url:
    description: 'Registry URL for publishing.'
    value: ${{ inputs.registry-url }}
  scope:
    description: 'Package scope to use.'
    value: ${{ inputs.scope }}
  package-version:
    description: 'The version to publish.'
    value: ${{ inputs.package-version }}

runs:
  using: composite
  steps:
    - name: Validate Inputs
      shell: sh
      working-directory: ${{ github.action_path }}
      env:
        INPUT_NPM_TOKEN: ${{ inputs.npm_token }}
        INPUT_PACKAGE_VERSION: ${{ inputs.package-version }}
        INPUT_REGISTRY_URL: ${{ inputs.registry-url }}
        INPUT_SCOPE: ${{ inputs.scope }}
        INPUT_TOKEN: ${{ inputs.token }}
      run: |
        set -eu
        if ! command -v python3 >/dev/null 2>&1; then
          echo "::error::python3 is required to validate inputs"
          exit 1
        fi
        python3 validate.py

    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ inputs.token || github.token }}
        persist-credentials: false

    - name: Validate Checkout
      shell: sh
      run: |
        set -eu

        # Validate package.json exists after checkout
        if [ ! -f "package.json" ]; then
          echo "::error::package.json not found in current directory"
          exit 1
        fi

    - name: Detect Package Manager
      id: detect-pm
      shell: sh
      run: |
        set -eu

        # Detect package manager from lockfiles
        if [ -f bun.lock ] || [ -f bun.lockb ]; then
          package_manager="bun"
        elif [ -f pnpm-lock.yaml ]; then
          package_manager="pnpm"
        elif [ -f yarn.lock ]; then
          package_manager="yarn"
        else
          package_manager="npm"
        fi

        printf 'package-manager=%s\n' "$package_manager" >> "$GITHUB_OUTPUT"
        echo "Detected package manager: $package_manager"

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        package-manager-cache: false

    - name: Enable Corepack
      shell: sh
      run: |
        set -eu
        corepack enable

    - name: Install Package Manager
      id: install-pm
      shell: sh
      env:
        PACKAGE_MANAGER: ${{ steps.detect-pm.outputs.package-manager }}
        # renovate: datasource=npm depName=pnpm
        PNPM_VERSION: '12.18.0'
        # renovate: datasource=npm depName=@yarnpkg/cli-dist
        YARN_VERSION: '4.18.1'
      run: |
        set -eu

        case "$PACKAGE_MANAGER" in
          pnpm)
            corepack prepare "pnpm@$PNPM_VERSION" --activate
            ;;
          yarn)
            corepack prepare "yarn@$YARN_VERSION" --activate
            ;;
          bun|npm)
            # Bun installed separately, npm built-in
            ;;
        esac

    - name: Setup Bun
      if: steps.detect-pm.outputs.package-manager == 'bun'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      env:
        # renovate: datasource=github-releases depName=oven-sh/bun extractVersion=^bun-v(?<version>.+)$
        BUN_VERSION: '1.4.4'
      with:
        bun-version: ${{ env.BUN_VERSION }}
        no-cache: true

    # Always a clean install from the lockfile: this job holds publish credentials,
    # so it must not run anything restored from the Actions cache.
    - name: Install Dependencies
      shell: sh
      env:
        PACKAGE_MANAGER: ${{ steps.detect-pm.outputs.package-manager }}
      run: |
        set -eu

        echo "Installing dependencies using $PACKAGE_MANAGER..."

        case "$PACKAGE_MANAGER" in
          "pnpm")
            command -v pnpm >/dev/null 2>&1 || { echo "::error::pnpm is required to install dependencies"; exit 1; }
            pnpm install --frozen-lockfile
            ;;
          "yarn")
            command -v yarn >/dev/null 2>&1 || { echo "::error::yarn is required to install dependencies"; exit 1; }
            if [ -f ".yarnrc.yml" ]; then
              yarn install --immutable
            else
              yarn install --frozen-lockfile
            fi
            ;;
          "bun")
            command -v bun >/dev/null 2>&1 || { echo "::error::bun is required to install dependencies"; exit 1; }
            bun install --frozen-lockfile
            ;;
          "npm"|*)
            command -v npm >/dev/null 2>&1 || { echo "::error::npm is required to install dependencies"; exit 1; }
            npm ci
            ;;
        esac

        echo "✅ Dependencies installed successfully"

    # timeout-minutes is set at the calling workflow level
    - name: Publish Package
      id: publish
      shell: sh
      env:
        REGISTRY_URL: ${{ inputs.registry-url }}
        PACKAGE_SCOPE: ${{ inputs.scope }}
        PACKAGE_VERSION: ${{ inputs.package-version }}
        NODE_AUTH_TOKEN: ${{ inputs.npm_token }}
      run: |-
        set -eu

        command -v node >/dev/null 2>&1 || { echo "::error::node is required to read the package version"; exit 1; }
        command -v mktemp >/dev/null 2>&1 || { echo "::error::mktemp is required to write the npm config"; exit 1; }
        command -v npm >/dev/null 2>&1 || { echo "::error::npm is required to publish"; exit 1; }

        pkg_version=$(node -p "require('./package.json').version")
        input_version="$PACKAGE_VERSION"
        # Strip leading v/V and whitespace from input version
        sanitized_version=$(echo "$input_version" | sed -E 's/^[[:space:]]*[vV]//' | sed -E 's/[[:space:]]*$//')

        if [ "$pkg_version" != "$sanitized_version" ]; then
          echo "::error::Version mismatch: package.json ($pkg_version) != input (sanitized: $sanitized_version, original: $input_version)"
          exit 1
        fi

        # Determine dist-tag: use prerelease label (e.g. "beta" from "1.0.0-beta.1") or "latest"
        prerelease_label=$(printf '%s' "$sanitized_version" | sed -E 's/^[^-]*-([^.]*).*/\1/')
        if [ "$prerelease_label" != "$sanitized_version" ] && [ -n "$prerelease_label" ]; then
          dist_tag="$prerelease_label"
        else
          dist_tag="latest"
        fi

        # The key npm derives from the registry URL (@npmcli/config nerf-dart): no
        # scheme, credentials, query, fragment or default port, a lowercase host, and
        # the path up to its last slash. npm finds the token by walking the request
        # URL's path upward, which always reaches this key.
        rest="${REGISTRY_URL#*://}"
        rest="${rest%%[?#]*}"
        host="${rest%%/*}"
        path="${rest#"$host"}"
        host="${host##*@}"
        case "$REGISTRY_URL" in
        https://*) host="${host%:443}" ;;
        http://*) host="${host%:80}" ;;
        esac
        host="$(printf '%s' "$host" | tr '[:upper:]' '[:lower:]')"

        # npm expands the placeholder from this step's env, so the token is never written to
        # a file. The config lasts as long as this step: later steps get no npm credentials.
        npmrc="$(mktemp)"
        trap 'rm -f "$npmrc"' EXIT
        printf '//%s%s/:_authToken=${NODE_AUTH_TOKEN}\n' "$host" "${path%/*}" > "$npmrc"
        export NPM_CONFIG_USERCONFIG="$npmrc"

        # Dry run first
        npm publish \
          --registry "$REGISTRY_URL" \
          --dry-run \
          --tag "$dist_tag" \
          --scope "$PACKAGE_SCOPE"

        npm publish \
          --registry "$REGISTRY_URL" \
          --verbose \
          --tag "$dist_tag" \
          --scope "$PACKAGE_SCOPE"
