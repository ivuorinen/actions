# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
# permissions:
#   - contents: read  # Required for checking out the repository
#   - pull-requests: write  # Required for the MegaLinter and dependency review PR comments
---
# MegaLinter GitHub Action configuration file
# More info at https://megalinter.io
name: PR Lint
description: Runs MegaLinter against pull requests. Refuses pull_request_target and workflow_run.
author: Ismo Vuorinen

branding:
  icon: check-circle
  color: green

inputs:
  token:
    description: 'GitHub token for authentication'
    required: false
    default: ''
  username:
    description: 'GitHub username for commits'
    required: false
    default: 'github-actions'
  email:
    description: 'GitHub email for commits'
    required: false
    default: 'github-actions@github.com'

outputs:
  validation_status:
    description: 'Overall validation status (success/failure)'
    value: ${{ steps.ml.outputs.has_updated_sources == '1' && 'failure' || 'success' }}
  errors_found:
    description: 'Number of linting errors found'
    value: ${{ steps.ml.outputs.has_updated_sources }}

runs:
  using: composite
  steps:
    - name: Validate Inputs
      shell: sh
      working-directory: ${{ github.action_path }}
      env:
        INPUT_EMAIL: ${{ inputs.email }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_USERNAME: ${{ inputs.username }}
      run: |
        set -eu
        if ! command -v python3 >/dev/null 2>&1; then
          echo "::error::python3 is required to validate inputs"
          exit 1
        fi
        python3 validate.py

    # MegaLinter reads its configuration from the checkout, so hardened install
    # flags alone cannot make these triggers safe.
    - name: Refuse Privileged Triggers
      id: guard-trigger
      shell: sh
      run: |
        set -eu

        case "$GITHUB_EVENT_NAME" in
          pull_request_target | workflow_run)
            printf '::error::pr-lint refuses to run on %s, which grants secrets and a write token to code it would install and lint. Run it on pull_request, with a read-only token and no secrets for untrusted pull requests.\n' "$GITHUB_EVENT_NAME"
            exit 1
            ;;
        esac

    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ inputs.token || github.token }}
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false

    #   ╭──────────────────────────────────────────────────────────╮
    #   │               Install packages for linting               │
    #   ╰──────────────────────────────────────────────────────────╯

    # Node.js tests if package.json exists
    - name: Detect package.json
      id: detect-node
      shell: sh
      run: |
        set -eu

        if [ -f package.json ]; then
          printf 'found=%s\n' "true" >> "$GITHUB_OUTPUT"

          # Check if packageManager field is set (for corepack)
          if command -v jq >/dev/null 2>&1; then
            has_package_manager=$(jq -r '.packageManager // empty' package.json 2>/dev/null || printf '')
            if [ -n "$has_package_manager" ]; then
              printf 'has-package-manager=%s\n' "true" >> "$GITHUB_OUTPUT"
              # The value comes from the checkout: never print it, the runner would
              # act on a workflow command inside it.
              printf '%s\n' "Found packageManager field in package.json"
            else
              printf 'has-package-manager=%s\n' "false" >> "$GITHUB_OUTPUT"
            fi
          else
            # Fallback: check with grep if jq not available
            # Use robust pattern to verify non-empty value
            if grep -Eq '"packageManager"[[:space:]]*:[[:space:]]*"[^"]+"' package.json 2>/dev/null; then
              printf 'has-package-manager=%s\n' "true" >> "$GITHUB_OUTPUT"
              printf '%s\n' "Found packageManager field in package.json"
            else
              printf 'has-package-manager=%s\n' "false" >> "$GITHUB_OUTPUT"
            fi
          fi
        else
          # Explicitly set has-package-manager to false when package.json doesn't exist
          printf 'has-package-manager=%s\n' "false" >> "$GITHUB_OUTPUT"
        fi

    - name: Detect Package Manager
      if: steps.detect-node.outputs.found == 'true'
      id: detect-pm
      shell: sh
      run: |
        set -eu

        # Detect package manager from lockfiles
        if [ -f bun.lockb ]; then
          package_manager="bun"
        elif [ -f pnpm-lock.yaml ]; then
          package_manager="pnpm"
        elif [ -f yarn.lock ]; then
          package_manager="yarn"
        else
          package_manager="npm"
        fi

        printf 'package-manager=%s\n' "$package_manager" >> "$GITHUB_OUTPUT"
        printf 'Detected package manager: %s\n' "$package_manager"

    - name: Setup Node.js
      if: steps.detect-node.outputs.found == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'

    - name: Enable Corepack
      if: steps.detect-node.outputs.found == 'true' && steps.detect-node.outputs.has-package-manager == 'true'
      shell: sh
      run: |
        set -eu
        corepack enable
        printf '%s\n' "Corepack enabled - package manager will be installed automatically from package.json"

    - name: Install Package Manager (Fallback)
      if: steps.detect-node.outputs.found == 'true' && steps.detect-node.outputs.has-package-manager == 'false'
      shell: sh
      env:
        PACKAGE_MANAGER: ${{ steps.detect-pm.outputs.package-manager }}
        # Otherwise Corepack takes settings from a .corepack.env in the checkout.
        COREPACK_ENV_FILE: '0'
      run: |
        set -eu

        printf 'No packageManager field found, using detected package manager: %s\n' "$PACKAGE_MANAGER"

        case "$PACKAGE_MANAGER" in
          pnpm)
            corepack enable
            corepack prepare pnpm@latest --activate
            ;;
          yarn)
            corepack enable
            corepack prepare yarn@stable --activate
            ;;
          bun|npm)
            # Bun installed separately, npm built-in
            ;;
        esac

    - name: Setup Bun
      if: steps.detect-node.outputs.found == 'true' && steps.detect-pm.outputs.package-manager == 'bun'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: latest

    - name: Cache Node Dependencies
      if: steps.detect-node.outputs.found == 'true'
      id: node-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: ${{ runner.os }}-pr-lint-${{ steps.detect-pm.outputs.package-manager }}-${{ hashFiles('package-lock.json', 'yarn.lock', 'pnpm-lock.yaml', 'bun.lockb') }}
        restore-keys: |
          ${{ runner.os }}-pr-lint-${{ steps.detect-pm.outputs.package-manager }}-

    # Installed for linters to read, so no scripts have to run. Yarn's yarnPath and
    # plugins settings still load code from the checkout: `yarn install` has no flag
    # to skip plugins, and ignoring yarnPath breaks projects that pin Yarn with it.
    - name: Install Node Dependencies
      id: install-node
      if: steps.detect-node.outputs.found == 'true' && steps.node-cache.outputs.cache-hit != 'true'
      shell: sh
      env:
        PACKAGE_MANAGER: ${{ steps.detect-pm.outputs.package-manager }}
        # Otherwise Corepack takes settings from a .corepack.env in the checkout.
        COREPACK_ENV_FILE: '0'
      run: |
        set -eu

        printf 'Installing dependencies using %s...\n' "$PACKAGE_MANAGER"

        case "$PACKAGE_MANAGER" in
          "pnpm")
            # pnpm compares the lockfile's pnpmfileChecksum even with the pnpmfile ignored, so
            # a lockfile recording one fails a frozen install. Only for that error, install
            # without the frozen check; that drops the checksum, so put the lockfile back
            # for the steps that lint or commit the tree.
            pnpm_status=0
            pnpm_output=$(pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile 2>&1) || pnpm_status=$?
            printf '%s\n' "$pnpm_output"
            if [ "$pnpm_status" -ne 0 ]; then
              case "$pnpm_output" in
                *ERR_PNPM_LOCKFILE_CONFIG_MISMATCH*) ;;
                *) exit "$pnpm_status" ;;
              esac
              pnpm install --no-frozen-lockfile --ignore-scripts --ignore-pnpmfile
              git checkout -- pnpm-lock.yaml
            fi
            ;;
          "yarn")
            # Detect Yarn version by checking actual version output: each generation
            # names its lockfile and script-skipping flags differently.
            yarn_version=$(yarn --version 2>/dev/null || printf '1.0.0')
            case "$yarn_version" in
              1.*)
                yarn install --frozen-lockfile --ignore-scripts
                ;;
              2.*)
                yarn install --immutable --skip-builds
                ;;
              *)
                yarn install --immutable --mode=skip-build
                ;;
            esac
            ;;
          "bun")
            bun install --frozen-lockfile --ignore-scripts
            ;;
          "npm"|*)
            npm ci --ignore-scripts
            ;;
        esac

        printf '✅ Dependencies installed successfully\n'

    # PHP tests if composer.json exists
    - name: Detect composer.json
      id: detect-php
      shell: sh
      run: |
        set -eu

        if [ -f composer.json ]; then
          printf 'found=%s\n' "true" >> "$GITHUB_OUTPUT"
        fi

    - name: Detect PHP Version
      if: steps.detect-php.outputs.found == 'true'
      id: php-version
      shell: sh
      env:
        ACTION_PATH: ${{ github.action_path }}
        DEFAULT_VERSION: '8.4'
      run: |
        set -eu
        command -v python3 >/dev/null 2>&1 || { echo "::error::python3 is required to validate detected versions"; exit 1; }

        # Repository files are untrusted: the rule lives in _validation/kit.py and ships in
        # validate.py. Run from the action directory so the checkout cannot steer python3.
        validate_version() {
          (cd "$ACTION_PATH" && python3 validate.py --detected-version "$1")
        }

        # Function to clean version string
        clean_version() {
          printf '%s' "$1" | sed 's/^[vV]//' | tr -d ' \n\r'
        }

        detected_version=""

        # Parse .tool-versions file
        if [ -f .tool-versions ]; then
          printf 'Checking .tool-versions for php...\n' >&2
          version=$(awk '/^php[[:space:]]/ {gsub(/#.*/, ""); print $2; exit}' .tool-versions 2>/dev/null || echo "")
          if [ -n "$version" ]; then
            version=$(clean_version "$version")
            if validate_version "$version"; then
              printf 'Found PHP version in .tool-versions: %s\n' "$version" >&2
              detected_version="$version"
            fi
          fi
        fi

        # Parse Dockerfile
        if [ -z "$detected_version" ] && [ -f Dockerfile ]; then
          printf 'Checking Dockerfile for php...\n' >&2
          version=$(grep -iF "FROM" Dockerfile | grep -F "php:" | head -1 | \
            sed -n -E "s/.*php:([0-9]+(\.[0-9]+)*)(-[^:]*)?.*/\1/p" || echo "")
          if [ -n "$version" ]; then
            version=$(clean_version "$version")
            if validate_version "$version"; then
              printf 'Found PHP version in Dockerfile: %s\n' "$version" >&2
              detected_version="$version"
            fi
          fi
        fi

        # Parse devcontainer.json
        if [ -z "$detected_version" ] && [ -f .devcontainer/devcontainer.json ]; then
          printf 'Checking devcontainer.json for php...\n' >&2
          if command -v jq >/dev/null 2>&1; then
            version=$(jq -r '.image // empty' .devcontainer/devcontainer.json 2>/dev/null | sed -n -E "s/.*php:([0-9]+(\.[0-9]+)*)(-[^:]*)?.*/\1/p" || echo "")
            if [ -n "$version" ]; then
              version=$(clean_version "$version")
              if validate_version "$version"; then
                printf 'Found PHP version in devcontainer: %s\n' "$version" >&2
                detected_version="$version"
              fi
            fi
          else
            printf 'jq not found; skipping devcontainer.json parsing\n' >&2
          fi
        fi

        # Parse .php-version file
        if [ -z "$detected_version" ] && [ -f .php-version ]; then
          printf 'Checking .php-version...\n' >&2
          version=$(tr -d '\r' < .php-version | head -1)
          if [ -n "$version" ]; then
            version=$(clean_version "$version")
            if validate_version "$version"; then
              printf 'Found PHP version in .php-version: %s\n' "$version" >&2
              detected_version="$version"
            fi
          fi
        fi

        # Parse composer.json
        if [ -z "$detected_version" ] && [ -f composer.json ]; then
          printf 'Checking composer.json...\n' >&2
          if command -v jq >/dev/null 2>&1; then
            version=$(jq -r '.require.php // empty' composer.json 2>/dev/null | sed -n 's/[^0-9]*\([0-9]\+\.[0-9]\+\(\.[0-9]\+\)\?\).*/\1/p')
            if [ -z "$version" ]; then
              version=$(jq -r '.config.platform.php // empty' composer.json 2>/dev/null | sed -n 's/[^0-9]*\([0-9]\+\.[0-9]\+\(\.[0-9]\+\)\?\).*/\1/p')
            fi
            if [ -n "$version" ]; then
              version=$(clean_version "$version")
              if validate_version "$version"; then
                printf 'Found PHP version in composer.json: %s\n' "$version" >&2
                detected_version="$version"
              fi
            fi
          else
            printf 'jq not found; skipping composer.json parsing\n' >&2
          fi
        fi

        # Use default version if nothing detected
        if [ -z "$detected_version" ]; then
          detected_version="$DEFAULT_VERSION"
          printf 'Using default PHP version: %s\n' "$detected_version" >&2
        fi

        # Set output
        printf 'detected-version=%s\n' "$detected_version" >> "$GITHUB_OUTPUT"
        printf 'Final detected PHP version: %s\n' "$detected_version" >&2

    - name: Setup PHP
      if: steps.detect-php.outputs.found == 'true'
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: ${{ steps.php-version.outputs.detected-version }}
        tools: composer
        coverage: none
      env:
        GITHUB_TOKEN: ${{ inputs.token || github.token }}

    - name: Setup problem matchers for PHP
      if: steps.detect-php.outputs.found == 'true'
      shell: sh
      env:
        RUNNER_TOOL_CACHE: ${{ runner.tool_cache }}
      run: |
        set -eu

        matcher_path=$(printf '%s' "$RUNNER_TOOL_CACHE/php.json" | tr -d '\n\r')
        printf '%s\n' "::add-matcher::$matcher_path"

    - name: Install PHP dependencies
      id: install-php
      if: steps.detect-php.outputs.found == 'true'
      shell: sh
      run: |
        set -eu

        composer install --no-progress --prefer-dist --no-interaction --no-scripts --no-plugins

    # Python dependencies are deliberately not installed here. MegaLinter's Python
    # linters run in their own venvs inside its container, which cannot see packages
    # installed on the runner. Use PRE_COMMANDS with `venv:` in .mega-linter.yml for
    # a linter that has to import project dependencies.

    # Go tests if go.mod exists
    - name: Detect go.mod
      id: detect-go
      shell: sh
      run: |
        set -eu

        if [ -f go.mod ]; then
          printf 'found=%s\n' "true" >> "$GITHUB_OUTPUT"
        fi

    - name: Detect Go Version
      if: steps.detect-go.outputs.found == 'true'
      id: go-version
      shell: sh
      env:
        ACTION_PATH: ${{ github.action_path }}
        DEFAULT_VERSION: '1.25'
      run: |
        set -eu
        command -v python3 >/dev/null 2>&1 || { echo "::error::python3 is required to validate detected versions"; exit 1; }

        # Repository files are untrusted: the rule lives in _validation/kit.py and ships in
        # validate.py. Run from the action directory so the checkout cannot steer python3.
        validate_version() {
          (cd "$ACTION_PATH" && python3 validate.py --detected-version "$1")
        }

        # Function to clean version string
        clean_version() {
          printf '%s' "$1" | sed 's/^[vV]//' | tr -d ' \n\r'
        }

        detected_version=""

        # Parse .tool-versions file
        if [ -f .tool-versions ]; then
          printf 'Checking .tool-versions for golang...\n' >&2
          version=$(awk '/^golang[[:space:]]/ {gsub(/#.*/, ""); print $2; exit}' .tool-versions 2>/dev/null || echo "")
          if [ -n "$version" ]; then
            version=$(clean_version "$version")
            if validate_version "$version"; then
              printf 'Found Go version in .tool-versions: %s\n' "$version" >&2
              detected_version="$version"
            fi
          fi
        fi

        # Parse Dockerfile
        if [ -z "$detected_version" ] && [ -f Dockerfile ]; then
          printf 'Checking Dockerfile for golang...\n' >&2
          version=$(grep -iF "FROM" Dockerfile | grep -F "golang:" | head -1 | \
            sed -n -E "s/.*golang:([0-9]+(\.[0-9]+)*)(-[^:]*)?.*/\1/p" || echo "")
          if [ -n "$version" ]; then
            version=$(clean_version "$version")
            if validate_version "$version"; then
              printf 'Found Go version in Dockerfile: %s\n' "$version" >&2
              detected_version="$version"
            fi
          fi
        fi

        # Parse devcontainer.json
        if [ -z "$detected_version" ] && [ -f .devcontainer/devcontainer.json ]; then
          printf 'Checking devcontainer.json for golang...\n' >&2
          if command -v jq >/dev/null 2>&1; then
            version=$(jq -r '.image // empty' .devcontainer/devcontainer.json 2>/dev/null | sed -n -E "s/.*golang:([0-9]+(\.[0-9]+)*)(-[^:]*)?.*/\1/p" || echo "")
            if [ -n "$version" ]; then
              version=$(clean_version "$version")
              if validate_version "$version"; then
                printf 'Found Go version in devcontainer: %s\n' "$version" >&2
                detected_version="$version"
              fi
            fi
          else
            printf 'jq not found; skipping devcontainer.json parsing\n' >&2
          fi
        fi

        # Parse .go-version file
        if [ -z "$detected_version" ] && [ -f .go-version ]; then
          printf 'Checking .go-version...\n' >&2
          version=$(tr -d '\r' < .go-version | head -1)
          if [ -n "$version" ]; then
            version=$(clean_version "$version")
            if validate_version "$version"; then
              printf 'Found Go version in .go-version: %s\n' "$version" >&2
              detected_version="$version"
            fi
          fi
        fi

        # Parse go.mod
        if [ -z "$detected_version" ] && [ -f go.mod ]; then
          printf 'Checking go.mod...\n' >&2
          version=$(grep -E '^go[[:space:]]+[0-9]' go.mod | awk '{print $2}' | head -1 || echo "")
          if [ -n "$version" ]; then
            version=$(clean_version "$version")
            if validate_version "$version"; then
              printf 'Found Go version in go.mod: %s\n' "$version" >&2
              detected_version="$version"
            fi
          fi
        fi

        # Use default version if nothing detected
        if [ -z "$detected_version" ]; then
          detected_version="$DEFAULT_VERSION"
          printf 'Using default Go version: %s\n' "$detected_version" >&2
        fi

        # Set output
        printf 'detected-version=%s\n' "$detected_version" >> "$GITHUB_OUTPUT"
        printf 'Final detected Go version: %s\n' "$detected_version" >&2

    - name: Setup Go
      if: steps.detect-go.outputs.found == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ steps.go-version.outputs.detected-version }}
        cache: true

    #   ╭──────────────────────────────────────────────────────────╮
    #   │                    Dependency Review                     │
    #   ╰──────────────────────────────────────────────────────────╯
    - name: Check Repository Visibility
      id: repo-visibility
      if: github.event_name == 'pull_request'
      shell: sh
      run: |
        set -eu

        is_private=$(jq -r '.repository.private' "$GITHUB_EVENT_PATH")

        if [ "$is_private" = "false" ]; then
          printf 'is-public=%s\n' "true" >> "$GITHUB_OUTPUT"
        fi

    - name: Dependency Review
      id: dependency-review
      continue-on-error: true
      if: >-
        steps.repo-visibility.outputs.is-public == 'true'
        && github.event_name == 'pull_request'
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      with:
        comment-summary-in-pr: always
        fail-on-severity: critical

    #   ╭──────────────────────────────────────────────────────────╮
    #   │                        MegaLinter                        │
    #   ╰──────────────────────────────────────────────────────────╯
    - name: MegaLinter
      # You can override MegaLinter flavor used to have faster performances
      # More info at https://megalinter.io/latest/flavors/
      uses: oxsecurity/megalinter/flavors/cupcake@f2fe8c1cba37091848df3e524066c8c23ef353ed # v10.2.0
      id: ml

      # All available variables are described in documentation
      # https://megalinter.io/latest/configuration/
      env:
        # Validates all source when push on main, else just the git diff with
        # main. Override with true if you always want to lint all sources
        #
        # To validate the entire codebase, set to:
        # VALIDATE_ALL_CODEBASE: true
        #
        # To validate only diff with main, set to:
        # VALIDATE_ALL_CODEBASE: >-
        #   ${{
        #     github.event_name == 'push' &&
        #     contains(fromJSON('["refs/heads/main", "refs/heads/master"]'), github.ref)
        #   }}
        VALIDATE_ALL_CODEBASE: false

        GITHUB_TOKEN: ${{ inputs.token || github.token }}

        # Apply linter fixes configuration
        #
        # When active, APPLY_FIXES must also be defined as environment variable
        # (in .github/workflows/mega-linter.yml or other CI tool)
        APPLY_FIXES: none

        # Decide which event triggers application of fixes in a commit or a PR
        # (pull_request, push, all)
        APPLY_FIXES_EVENT: pull_request

        # If APPLY_FIXES is used, defines if the fixes are directly committed (commit)
        # or posted in a PR (pull_request)
        APPLY_FIXES_MODE: commit

        # ADD YOUR CUSTOM ENV VARIABLES HERE OR DEFINE THEM IN A FILE
        # .mega-linter.yml AT THE ROOT OF YOUR REPOSITORY

        # Uncomment to disable copy-paste and spell checks
        DISABLE: COPYPASTE,SPELL

    # Upload MegaLinter artifacts
    - name: Archive production artifacts
      if: success() || failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: MegaLinter reports
        include-hidden-files: 'true'
        path: |
          megalinter-reports
          mega-linter.log

    - name: Fail if dependency review found critical issues
      if: steps.dependency-review.outcome == 'failure'
      shell: sh
      run: |
        set -eu
        printf '%s\n' "Dependency review found critical issues" >&2
        exit 1
