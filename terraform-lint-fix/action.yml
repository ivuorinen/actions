# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
# permissions:
#   - contents: write  # Required for committing fixes
#   - security-events: write  # Required for uploading SARIF reports
---
name: Terraform Lint and Fix
description: 'Lints and fixes Terraform files with advanced validation and security checks.'
author: 'Ismo Vuorinen'

branding:
  icon: server
  color: green

inputs:
  terraform-version:
    description: 'Terraform version to use (empty: the version pinned in this action, "latest": the newest release)'
    required: false
    default: ''
  tflint-version:
    description: 'TFLint version to use (empty: the version pinned in this action, "latest": the newest release)'
    required: false
    default: ''
  working-directory:
    description: 'Directory containing Terraform files'
    required: false
    default: '.'
  config-file:
    description: >-
      Path to TFLint config file, relative to working-directory. Without the default file, TFLint's own config lookup
      and built-in rules apply; a path other than the default must exist
    required: false
    default: '.tflint.hcl'
  fail-on-error:
    description: 'Fail the workflow when issues are found; a run that could not lint fails either way (lowercase true or false)'
    required: false
    default: 'true'
  max-retries:
    description: >-
      Deprecated: has no effect, because the action does not retry its installs. A value set here must still be a
      number from 1 to 10.
    deprecationMessage: 'This input has no effect. terraform-lint-fix does not retry its installs.'
    required: false
    default: '3'
  auto-fix:
    description: 'Automatically fix issues when possible (lowercase true or false)'
    required: false
    default: 'true'
  format:
    description: 'Output format (compact, json, checkstyle, junit, sarif)'
    required: false
    default: 'sarif'
  token:
    description: 'GitHub token for authentication. Stays in git config after checkout only when auto-fix is true. Defaults to the workflow token.'
    required: false
    default: ''
  username:
    description: 'GitHub username for commits'
    required: false
    default: 'github-actions'
  email:
    description: 'GitHub email for commits'
    required: false
    default: 'github-actions@github.com'

outputs:
  error-count:
    description: 'Number of errors found'
    value: ${{ steps.lint.outputs.error_count }}
  fixed-count:
    description: 'Number of issues fixed'
    value: ${{ steps.fix.outputs.fixed_count }}
  sarif-file:
    description: 'Path to SARIF report file'
    value: ${{ steps.lint.outputs.sarif_file }}

runs:
  using: composite
  steps:
    - name: Validate Inputs
      shell: sh
      working-directory: ${{ github.action_path }}
      env:
        INPUT_AUTO_FIX: ${{ inputs.auto-fix }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_EMAIL: ${{ inputs.email }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_MAX_RETRIES: ${{ inputs.max-retries }}
        INPUT_TERRAFORM_VERSION: ${{ inputs.terraform-version }}
        INPUT_TFLINT_VERSION: ${{ inputs.tflint-version }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -eu
        if ! command -v python3 >/dev/null 2>&1; then
          echo "::error::python3 is required to validate inputs"
          exit 1
        fi
        python3 validate.py

    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ inputs.token || github.token }}
        # The token reaches git only in the step that pushes, from that step's environment, so
        # code that runs before it finds none in .git/config.
        persist-credentials: false

    - name: Check for Terraform Files
      id: check-files
      shell: sh
      # Inputs are gated by the "Validate Inputs" step above, which fails the
      # action on invalid input before this step runs; passing them through an
      # env: block (never inline in run:) keeps the values injection-safe.
      env:
        VALIDATED_WORKING_DIR: ${{ inputs.working-directory }}
      run: |
        set -eu
        # Use validated environment variable
        WORKING_DIRECTORY="$VALIDATED_WORKING_DIR"

        cd -- "$WORKING_DIRECTORY"

        # Check for Terraform files
        if ! find . \( -name "*.tf" -o -name "*.tfvars" \) | grep -q .; then
          echo "No Terraform files found. Skipping lint and fix."
          printf 'found=%s\n' "false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        printf 'found=%s\n' "true" >> "$GITHUB_OUTPUT"

    - name: Setup Terraform
      if: steps.check-files.outputs.found == 'true'
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      env:
        # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.+)$
        DEFAULT_TERRAFORM_VERSION: '1.17.1'
      with:
        terraform_version: ${{ inputs.terraform-version || env.DEFAULT_TERRAFORM_VERSION }}
        terraform_wrapper: false

    - name: Validate Terraform Syntax
      id: syntax
      if: steps.check-files.outputs.found == 'true'
      shell: sh
      env:
        VALIDATED_WORKING_DIR: ${{ inputs.working-directory }}
      run: |
        set -eu
        cd -- "$VALIDATED_WORKING_DIR"
        echo "Validating Terraform file syntax..."
        command -v terraform >/dev/null 2>&1 || { echo "::error::terraform is required to check the formatting"; exit 1; }
        find . \( -name "*.tf" -o -name "*.tfvars" \) -exec sh -c '
          file="$1"
          if ! terraform fmt -check=true "$file" >/dev/null 2>&1; then
            # A repository filename is untrusted: control characters (a newline in
            # particular) could start a new workflow command in the log, so drop them.
            safe_name=$(printf "%s" "$file" | tr -d "\000-\037\177")
            printf "::warning::Invalid Terraform syntax in %s\n" "$safe_name"
          fi
        ' _ {} \;

    - name: Setup TFLint
      if: steps.check-files.outputs.found == 'true'
      uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      env:
        # renovate: datasource=github-releases depName=terraform-linters/tflint
        DEFAULT_TFLINT_VERSION: 'v0.65.0'
      with:
        tflint_version: ${{ inputs.tflint-version || env.DEFAULT_TFLINT_VERSION }}

    # Without a TFLINT_PLUGIN_DIR, TFLint installs plugins under the runner user's home, which
    # self-hosted runners share between jobs. The Initialize and Run steps get a new directory of
    # the action's own, with a name nothing could know in advance, so nothing could make it or fill
    # it with plugin executables before TFLint loads them, as it could a fixed path; Cleanup can
    # delete it safely, and a step output keeps it out of the caller's later steps. A plugin_dir set in the TFLint config still
    # takes precedence, as TFLint documents, and those plugins stay where the config put them.
    - name: Isolate TFLint Plugins
      id: plugin-dir
      if: steps.check-files.outputs.found == 'true'
      shell: sh
      run: |
        set -eu
        command -v mktemp >/dev/null 2>&1 || { echo "::error::mktemp is required to isolate TFLint plugins"; exit 1; }
        dir=$(mktemp -d "${RUNNER_TEMP:?}/terraform-lint-fix-plugins.XXXXXX")
        printf 'dir=%s\n' "$dir" >> "$GITHUB_OUTPUT"

    - name: Initialize TFLint
      if: steps.check-files.outputs.found == 'true'
      id: init
      shell: sh
      env:
        VALIDATED_WORKING_DIR: ${{ inputs.working-directory }}
        # An empty config-file is the default, as the input's own default.
        VALIDATED_CONFIG: ${{ inputs.config-file || '.tflint.hcl' }}
        TFLINT_PLUGIN_DIR: ${{ steps.plugin-dir.outputs.dir }}
      run: |
        set -eu

        cd -- "$VALIDATED_WORKING_DIR"

        # Install the plugins of the config that Run TFLint reads. The default config may be
        # absent, and TFLint then uses its own lookup and built-in rules; any other path must be
        # there, rather than TFLint linting with rules the caller did not name.
        command -v tflint >/dev/null 2>&1 || { echo "::error::tflint is required to install its plugins"; exit 1; }
        if [ -f "$VALIDATED_CONFIG" ]; then
          tflint --init --config "$VALIDATED_CONFIG"
        elif [ "$VALIDATED_CONFIG" = ".tflint.hcl" ]; then
          tflint --init
        else
          echo "::error::config-file $VALIDATED_CONFIG does not exist"
          exit 1
        fi

    - name: Run TFLint
      if: steps.check-files.outputs.found == 'true'
      id: lint
      shell: sh
      env:
        VALIDATED_WORKING_DIR: ${{ inputs.working-directory }}
        VALIDATED_CONFIG: ${{ inputs.config-file || '.tflint.hcl' }}
        VALIDATED_FORMAT: ${{ inputs.format }}
        TFLINT_PLUGIN_DIR: ${{ steps.plugin-dir.outputs.dir }}
      run: |
        set -eu
        # Use validated environment variables
        WORKING_DIRECTORY="$VALIDATED_WORKING_DIR"
        CONFIG_FILE="$VALIDATED_CONFIG"
        FORMAT="$VALIDATED_FORMAT"

        cd -- "$WORKING_DIRECTORY"

        # Keep the reports outside the workspace: a repository can commit
        # 'reports' as a symlink, which would redirect the writes and the cleanup.
        command -v mktemp >/dev/null 2>&1 || { echo "::error::mktemp is required to create the reports directory"; exit 1; }
        command -v tflint >/dev/null 2>&1 || { echo "::error::tflint is required to lint"; exit 1; }
        reports_dir=$(mktemp -d "$RUNNER_TEMP/terraform-lint-fix.XXXXXX")
        printf 'reports_dir=%s\n' "$reports_dir" >> "$GITHUB_OUTPUT"

        # Without a config, TFLint falls back to its own lookup and built-in rules.
        # The action generates no config, so the configured path is only ever read.
        set -- --format "$FORMAT" --no-color
        if [ -f "$CONFIG_FILE" ]; then
          set -- --config "$CONFIG_FILE" "$@"
        fi

        # Run TFLint with configured format
        tflint_output="$reports_dir/tflint.$FORMAT"
        tflint_status=0
        tflint "$@" > "$tflint_output" || tflint_status=$?

        # TFLint exits 2 when it found issues and 1 when it could not lint, as with a bad config
        # or a missing plugin. That fails the step whatever fail-on-error says, with no report to
        # upload: an incomplete one would close the alerts of the issues it did not see.
        if [ "$tflint_status" -ne 0 ] && [ "$tflint_status" -ne 2 ]; then
          cat "$tflint_output" >&2
          echo "::error::TFLint failed with exit status $tflint_status"
          exit "$tflint_status"
        fi

        # TFLint marks an error differently in each format, and in junit and compact the case
        # differs between lint issues and configuration errors. A finished run's report is counted
        # whatever its status: with force set in the TFLint config, it exits 0 with findings.
        case "$FORMAT" in
          json) error_pattern='"severity": *"error"' ;;
          checkstyle) error_pattern='severity="error"' ;;
          junit) error_pattern='type="[Ee]rror"' ;;
          compact) error_pattern=': [Ee]rror - ' ;;
          *) error_pattern='"level": *"error"' ;;
        esac
        error_count=$(grep -oE "$error_pattern" "$tflint_output" | wc -l | tr -d ' ')

        printf 'error_count=%s\n' "$error_count" >> "$GITHUB_OUTPUT"
        printf 'sarif_file=%s\n' "$tflint_output" >> "$GITHUB_OUTPUT"

        # Issues end the job in Fail on Issues, after the formatting fixes are committed and the
        # report is uploaded; failing here would skip both.
        if [ "$tflint_status" -eq 2 ]; then
          printf 'issues=%s\n' "true" >> "$GITHUB_OUTPUT"
        fi

    - name: Run Terraform Format
      if: steps.check-files.outputs.found == 'true' && inputs.auto-fix == 'true'
      id: fix
      shell: sh
      env:
        VALIDATED_WORKING_DIR: ${{ inputs.working-directory }}
      run: |
        set -eu
        # Use validated environment variable
        WORKING_DIRECTORY="$VALIDATED_WORKING_DIR"

        cd -- "$WORKING_DIRECTORY"

        # Track fixed files
        fixed_count=0
        command -v mktemp >/dev/null 2>&1 || { echo "::error::mktemp is required to track the fixed files"; exit 1; }
        _fixed_list=$(mktemp)
        trap 'rm -f "$_fixed_list"' EXIT

        # Format Terraform files
        command -v terraform >/dev/null 2>&1 || { echo "::error::terraform is required to format the files"; exit 1; }
        find . \( -name "*.tf" -o -name "*.tfvars" \) -exec sh -c '
          file="$1"
          fixed_list="$2"
          if ! terraform fmt -check "$file" >/dev/null 2>&1; then
            terraform fmt "$file"
            printf "%s\n" "$file" >> "$fixed_list"
          fi
        ' _ {} "$_fixed_list" \;

        fixed_count=$(wc -l < "$_fixed_list" | tr -d ' ')
        rm -f "$_fixed_list"

        printf 'fixed_count=%s\n' "$fixed_count" >> "$GITHUB_OUTPUT"

    - name: Commit Fixes
      if: steps.check-files.outputs.found == 'true' && inputs.auto-fix == 'true' && fromJSON(steps.fix.outputs.fixed_count) > 0
      uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
      env:
        GH_TOKEN: ${{ inputs.token || github.token }}
        # The empty helper drops any configured one, and the next answers git's credential request
        # from this step's environment.
        GIT_CONFIG_COUNT: '2'
        GIT_CONFIG_KEY_0: credential.helper
        GIT_CONFIG_VALUE_0: ''
        GIT_CONFIG_KEY_1: credential.helper
        GIT_CONFIG_VALUE_1: '!f() { test "$1" = get || return 0; echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
      with:
        commit_message: 'style: apply terraform formatting fixes'
        commit_user_name: ${{ inputs.username }}
        commit_user_email: ${{ inputs.email }}
        file_pattern: '*.tf *.tfvars'

    # Also after a formatting or commit step failed. Run TFLint names a report only after a run
    # that finished: an incomplete one must not close open alerts.
    - name: Upload SARIF Report
      if: always() && steps.check-files.outputs.found == 'true' && inputs.format == 'sarif' && steps.lint.outputs.sarif_file != ''
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: ${{ steps.lint.outputs.sarif_file }}
        category: terraform-lint

    - name: Fail on Issues
      if: steps.lint.outputs.issues == 'true' && inputs.fail-on-error == 'true'
      shell: sh
      env:
        ERROR_COUNT: ${{ steps.lint.outputs.error_count }}
      run: |
        set -eu
        echo "::error::TFLint found issues ($ERROR_COUNT at error level)"
        exit 1

    - name: Cleanup
      id: cleanup
      if: always()
      shell: sh
      env:
        REPORTS_DIR: ${{ steps.lint.outputs.reports_dir }}
        # The directory Isolate TFLint Plugins made, never TFLINT_PLUGIN_DIR: a caller may have set that
        PLUGIN_DIR: ${{ steps.plugin-dir.outputs.dir }}
      run: |-
        set -eu

        # Remove temporary files; each is empty when its step never ran. Nothing
        # here creates .terraform, so the workspace is left alone.
        if [ -n "$REPORTS_DIR" ]; then
          rm -rf "$REPORTS_DIR"
        fi
        if [ -n "$PLUGIN_DIR" ]; then
          rm -rf "$PLUGIN_DIR"
        fi
