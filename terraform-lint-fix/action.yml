# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
# permissions:
#   - contents: write  # Required for committing fixes
#   - security-events: write  # Required for uploading SARIF reports
---
name: Terraform Lint and Fix
description: 'Lints and fixes Terraform files with advanced validation and security checks.'
author: 'Ismo Vuorinen'

branding:
  icon: server
  color: green

inputs:
  terraform-version:
    description: 'Terraform version to use'
    required: false
    default: 'latest'
  tflint-version:
    description: 'TFLint version to use'
    required: false
    default: 'latest'
  working-directory:
    description: 'Directory containing Terraform files'
    required: false
    default: '.'
  config-file:
    description: "Path to TFLint config file, relative to working-directory. TFLint's own config lookup and built-in rules apply when this path is not a regular file."
    required: false
    default: '.tflint.hcl'
  fail-on-error:
    description: 'Fail workflow if issues are found (lowercase true or false)'
    required: false
    default: 'true'
  auto-fix:
    description: 'Automatically fix issues when possible (lowercase true or false)'
    required: false
    default: 'true'
  max-retries:
    description: 'Maximum number of retry attempts (1-10, must not be empty)'
    required: false
    default: '3'
  format:
    description: 'Output format (compact, json, checkstyle, junit, sarif)'
    required: false
    default: 'sarif'
  token:
    description: 'GitHub token for authentication. Stays in git config after checkout only when auto-fix is true.'
    required: false
    default: ''
  username:
    description: 'GitHub username for commits'
    required: false
    default: 'github-actions'
  email:
    description: 'GitHub email for commits'
    required: false
    default: 'github-actions@github.com'

outputs:
  error-count:
    description: 'Number of errors found'
    value: ${{ steps.lint.outputs.error_count }}
  fixed-count:
    description: 'Number of issues fixed'
    value: ${{ steps.fix.outputs.fixed_count }}
  sarif-file:
    description: 'Path to SARIF report file'
    value: ${{ steps.lint.outputs.sarif_file }}

runs:
  using: composite
  steps:
    - name: Validate Inputs
      shell: sh
      working-directory: ${{ github.action_path }}
      env:
        INPUT_AUTO_FIX: ${{ inputs.auto-fix }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_EMAIL: ${{ inputs.email }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_MAX_RETRIES: ${{ inputs.max-retries }}
        INPUT_TERRAFORM_VERSION: ${{ inputs.terraform-version }}
        INPUT_TFLINT_VERSION: ${{ inputs.tflint-version }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -eu
        if ! command -v python3 >/dev/null 2>&1; then
          echo "::error::python3 is required to validate inputs"
          exit 1
        fi
        python3 validate.py

    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ inputs.token || github.token }}
        # Only auto-fix pushes; git-auto-commit-action authenticates with the
        # credentials actions/checkout leaves in git config.
        persist-credentials: ${{ inputs.auto-fix == 'true' }}

    - name: Check for Terraform Files
      id: check-files
      shell: sh
      # Inputs are gated by the "Validate Inputs" step above, which fails the
      # action on invalid input before this step runs; passing them through an
      # env: block (never inline in run:) keeps the values injection-safe.
      env:
        VALIDATED_WORKING_DIR: ${{ inputs.working-directory }}
      run: |
        set -eu
        # Use validated environment variable
        WORKING_DIRECTORY="$VALIDATED_WORKING_DIR"

        cd -- "$WORKING_DIRECTORY"

        # Check for Terraform files
        if ! find . \( -name "*.tf" -o -name "*.tfvars" \) | grep -q .; then
          echo "No Terraform files found. Skipping lint and fix."
          printf 'found=%s\n' "false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        printf 'found=%s\n' "true" >> "$GITHUB_OUTPUT"

    - name: Setup Terraform
      if: steps.check-files.outputs.found == 'true'
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - name: Validate Terraform Syntax
      if: steps.check-files.outputs.found == 'true'
      shell: sh
      env:
        VALIDATED_WORKING_DIR: ${{ inputs.working-directory }}
      run: |
        set -eu
        cd "$VALIDATED_WORKING_DIR"
        echo "Validating Terraform file syntax..."
        find . \( -name "*.tf" -o -name "*.tfvars" \) -exec sh -c '
          file="$1"
          if ! terraform fmt -check=true "$file" >/dev/null 2>&1; then
            echo "::warning::Invalid Terraform syntax in $file"
          fi
        ' _ {} \;

    - name: Setup TFLint
      if: steps.check-files.outputs.found == 'true'
      uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      with:
        tflint_version: ${{ inputs.tflint-version }}

    - name: Initialize TFLint
      if: steps.check-files.outputs.found == 'true'
      id: init
      shell: sh
      env:
        VALIDATED_WORKING_DIR: ${{ inputs.working-directory }}
        VALIDATED_CONFIG: ${{ inputs.config-file }}
      run: |
        set -eu

        cd "$VALIDATED_WORKING_DIR"

        # Install the plugins of the config that Run TFLint reads
        if [ -f "$VALIDATED_CONFIG" ]; then
          tflint --init --config "$VALIDATED_CONFIG"
        else
          tflint --init
        fi

    - name: Run TFLint
      if: steps.check-files.outputs.found == 'true'
      id: lint
      shell: sh
      env:
        VALIDATED_WORKING_DIR: ${{ inputs.working-directory }}
        VALIDATED_CONFIG: ${{ inputs.config-file }}
        VALIDATED_FORMAT: ${{ inputs.format }}
        VALIDATED_FAIL: ${{ inputs.fail-on-error }}
      run: |
        set -eu
        # Use validated environment variables
        WORKING_DIRECTORY="$VALIDATED_WORKING_DIR"
        CONFIG_FILE="$VALIDATED_CONFIG"
        FORMAT="$VALIDATED_FORMAT"
        FAIL_ON_ERROR="$VALIDATED_FAIL"

        cd -- "$WORKING_DIRECTORY"

        # Keep the reports outside the workspace: a repository can commit
        # 'reports' as a symlink, which would redirect the writes and the cleanup.
        reports_dir=$(mktemp -d "$RUNNER_TEMP/terraform-lint-fix.XXXXXX")
        printf 'reports_dir=%s\n' "$reports_dir" >> "$GITHUB_OUTPUT"

        # Without a config, TFLint falls back to its own lookup and built-in rules.
        # The action generates no config, so the configured path is only ever read.
        set -- --format "$FORMAT" --no-color
        if [ -f "$CONFIG_FILE" ]; then
          set -- --config "$CONFIG_FILE" "$@"
        fi

        # Run TFLint with configured format
        tflint_output="$reports_dir/tflint.$FORMAT"
        if ! tflint "$@" > "$tflint_output"; then
          error_count=$(grep -c "level\": \"error\"" "$tflint_output" || echo 0)
          printf 'error_count=%s\n' "$error_count" >> "$GITHUB_OUTPUT"

          if [ "$FAIL_ON_ERROR" = "true" ]; then
            echo "::error::Found $error_count linting errors"
            exit 1
          fi
        fi

        printf 'sarif_file=%s\n' "$tflint_output" >> "$GITHUB_OUTPUT"

    - name: Run Terraform Format
      if: steps.check-files.outputs.found == 'true' && inputs.auto-fix == 'true'
      id: fix
      shell: sh
      env:
        VALIDATED_WORKING_DIR: ${{ inputs.working-directory }}
      run: |
        set -eu
        # Use validated environment variable
        WORKING_DIRECTORY="$VALIDATED_WORKING_DIR"

        cd -- "$WORKING_DIRECTORY"

        # Track fixed files
        fixed_count=0
        _fixed_list=$(mktemp)
        trap 'rm -f "$_fixed_list"' EXIT

        # Format Terraform files
        find . \( -name "*.tf" -o -name "*.tfvars" \) -exec sh -c '
          file="$1"
          fixed_list="$2"
          if ! terraform fmt -check "$file" >/dev/null 2>&1; then
            terraform fmt "$file"
            printf "%s\n" "$file" >> "$fixed_list"
          fi
        ' _ {} "$_fixed_list" \;

        fixed_count=$(wc -l < "$_fixed_list" | tr -d ' ')
        rm -f "$_fixed_list"

        printf 'fixed_count=%s\n' "$fixed_count" >> "$GITHUB_OUTPUT"

    - name: Commit Fixes
      if: steps.check-files.outputs.found == 'true' && inputs.auto-fix == 'true' && fromJSON(steps.fix.outputs.fixed_count) > 0
      uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
      with:
        commit_message: 'style: apply terraform formatting fixes'
        commit_user_name: ${{ inputs.username }}
        commit_user_email: ${{ inputs.email }}
        file_pattern: '*.tf *.tfvars'

    - name: Upload SARIF Report
      if: steps.check-files.outputs.found == 'true' && inputs.format == 'sarif'
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: ${{ steps.lint.outputs.sarif_file }}
        category: terraform-lint

    - name: Cleanup
      if: always()
      shell: sh
      env:
        REPORTS_DIR: ${{ steps.lint.outputs.reports_dir }}
      run: |-
        set -eu

        # Remove temporary files; empty when the lint step never ran. Nothing
        # here creates .terraform, so the workspace is left alone.
        if [ -n "$REPORTS_DIR" ]; then
          rm -rf "$REPORTS_DIR"
        fi

        # Clean up TFLint cache
        rm -rf ~/.tflint.d/
