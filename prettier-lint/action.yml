# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
# permissions:
#   - contents: write         # Required for fix mode to push changes
---
name: Prettier Lint
description: 'Run Prettier in check or fix mode'
author: Ismo Vuorinen

branding:
  icon: check-circle
  color: green

inputs:
  mode:
    description: 'Mode to run (check or fix)'
    required: false
    default: 'check'
  working-directory:
    description: 'Directory containing files to format'
    required: false
    default: '.'
  prettier-version:
    description: >-
      Prettier version to run when the repository has no copy of its own. Empty: the version in this action's
      package-lock.json, installed with its whole dependency tree locked. A version or "latest": installed from the
      registry without lifecycle scripts, with its dependencies unlocked. When plugins installs Prettier as their peer
      dependency, the repository has a copy, unlocked, and that copy runs.
    required: false
    default: ''
  config-file:
    description: 'Path to Prettier config file (a path other than the default must exist)'
    required: false
    default: '.prettierrc'
  ignore-file:
    description: >-
      Path to Prettier ignore file. The default reads .gitignore and .prettierignore, as Prettier does; another
      path must exist and is read with .gitignore in place of .prettierignore.
    required: false
    default: '.prettierignore'
  file-pattern:
    description: 'Files to include (glob pattern)'
    required: false
    default: '**/*.{js,jsx,ts,tsx,css,scss,json,md,yaml,yml}'
  cache:
    description: 'Enable Prettier caching (lowercase true or false)'
    required: false
    default: 'true'
  fail-on-error:
    description: 'Fail workflow if issues are found (check mode only; lowercase true or false)'
    required: false
    default: 'true'
  max-retries:
    description: 'Maximum number of retry attempts (1-10, must not be empty)'
    required: false
    default: '3'
  plugins:
    description: >-
      Comma-separated list of Prettier plugins to install (name or name@version; separate entries with commas only).
      Installed without running lifecycle scripts and without changing package.json or the lockfile. The package
      manager may also install Prettier itself as the plugins' peer dependency, at a version no lockfile holds, and
      the action then runs that copy.
    required: false
    default: ''
  token:
    description: 'GitHub token for authentication. Stays in git config after checkout in fix mode only.'
    required: false
    default: ''
  username:
    description: 'GitHub username for commits (fix mode only)'
    required: false
    default: 'github-actions'
  email:
    description: 'GitHub email for commits (fix mode only)'
    required: false
    default: 'github-actions@github.com'

outputs:
  status:
    description: 'Overall status (success/failure)'
    value: ${{ steps.check.outputs.status || steps.fix.outputs.status || steps.ensure-prettier.outputs.status }}
  files-checked:
    description: >-
      Number of files with an extension named in file-pattern (check mode only). Directories in the pattern and
      ignore files are not applied, so it can differ from the files Prettier checked.
    value: ${{ steps.check.outputs.files_checked }}
  unformatted-files:
    description: 'Number of files with formatting issues (check mode only)'
    value: ${{ steps.check.outputs.unformatted_files }}
  files-changed:
    description: 'Number of files changed (fix mode only)'
    value: ${{ steps.fix.outputs.files_changed }}

runs:
  using: composite
  steps:
    - name: Validate Inputs
      shell: sh
      working-directory: ${{ github.action_path }}
      env:
        INPUT_CACHE: ${{ inputs.cache }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_EMAIL: ${{ inputs.email }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        INPUT_FILE_PATTERN: ${{ inputs.file-pattern }}
        INPUT_IGNORE_FILE: ${{ inputs.ignore-file }}
        INPUT_MAX_RETRIES: ${{ inputs.max-retries }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_PLUGINS: ${{ inputs.plugins }}
        INPUT_PRETTIER_VERSION: ${{ inputs.prettier-version }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -eu
        if ! command -v python3 >/dev/null 2>&1; then
          echo "::error::python3 is required to validate inputs"
          exit 1
        fi
        python3 validate.py

    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ inputs.token || github.token }}
        # Only fix mode pushes; git-auto-commit-action authenticates with the
        # credentials actions/checkout leaves in git config.
        persist-credentials: ${{ inputs.mode == 'fix' }}

    - name: Detect Package Manager
      id: detect-pm
      shell: sh
      run: |
        set -eu

        # Detect package manager from lockfiles
        if [ -f bun.lock ] || [ -f bun.lockb ]; then
          package_manager="bun"
        elif [ -f pnpm-lock.yaml ]; then
          package_manager="pnpm"
        elif [ -f yarn.lock ]; then
          package_manager="yarn"
        else
          package_manager="npm"
        fi

        printf 'package-manager=%s\n' "$package_manager" >> "$GITHUB_OUTPUT"
        echo "Detected package manager: $package_manager"

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'

    - name: Enable Corepack
      shell: sh
      run: |
        set -eu
        command -v corepack >/dev/null 2>&1 || { echo "::error::corepack is required to enable the package manager"; exit 1; }
        corepack enable

    - name: Install Package Manager
      id: install-pm
      shell: sh
      env:
        PACKAGE_MANAGER: ${{ steps.detect-pm.outputs.package-manager }}
        # renovate: datasource=npm depName=pnpm
        PNPM_VERSION: '12.18.0'
        # renovate: datasource=npm depName=@yarnpkg/cli-dist
        YARN_VERSION: '4.18.1'
      run: |
        set -eu

        case "$PACKAGE_MANAGER" in
          pnpm)
            command -v corepack >/dev/null 2>&1 || { echo "::error::corepack is required to install pnpm"; exit 1; }
            corepack prepare "pnpm@$PNPM_VERSION" --activate
            ;;
          yarn)
            command -v corepack >/dev/null 2>&1 || { echo "::error::corepack is required to install Yarn"; exit 1; }
            corepack prepare "yarn@$YARN_VERSION" --activate
            ;;
          bun|npm)
            # Bun installed separately, npm built-in
            ;;
        esac

    - name: Setup Bun
      if: steps.detect-pm.outputs.package-manager == 'bun'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      env:
        # renovate: datasource=github-releases depName=oven-sh/bun extractVersion=^bun-v(?<version>.+)$
        BUN_VERSION: '1.4.4'
      with:
        bun-version: ${{ env.BUN_VERSION }}

    - name: Cache Node Dependencies
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: ${{ runner.os }}-prettier-lint-${{ inputs.mode }}-${{ steps.detect-pm.outputs.package-manager }}-${{ hashFiles('package-lock.json', 'yarn.lock', 'pnpm-lock.yaml', 'bun.lock*') }}
        restore-keys: |
          ${{ runner.os }}-prettier-lint-${{ inputs.mode }}-${{ steps.detect-pm.outputs.package-manager }}-
          ${{ runner.os }}-prettier-lint-${{ inputs.mode }}-

    - name: Install Dependencies
      id: install-deps
      if: steps.cache.outputs.cache-hit != 'true'
      shell: sh
      env:
        PACKAGE_MANAGER: ${{ steps.detect-pm.outputs.package-manager }}
      run: |
        set -eu

        echo "Installing dependencies using $PACKAGE_MANAGER..."

        case "$PACKAGE_MANAGER" in
          "pnpm")
            command -v pnpm >/dev/null 2>&1 || { echo "::error::pnpm is required to install dependencies"; exit 1; }
            pnpm install --frozen-lockfile
            ;;
          "yarn")
            command -v yarn >/dev/null 2>&1 || { echo "::error::yarn is required to install dependencies"; exit 1; }
            if [ -f ".yarnrc.yml" ]; then
              yarn install --immutable
            else
              yarn install --frozen-lockfile
            fi
            ;;
          "bun")
            command -v bun >/dev/null 2>&1 || { echo "::error::bun is required to install dependencies"; exit 1; }
            bun install --frozen-lockfile
            ;;
          "npm"|*)
            # A repository with no package.json has nothing to install, and npm ci would fail
            # for it; Prettier then comes from this action's lockfile.
            if [ ! -f package.json ]; then
              echo "No package.json: no dependencies to install"
              exit 0
            fi
            command -v npm >/dev/null 2>&1 || { echo "::error::npm is required to install dependencies"; exit 1; }
            npm ci
            ;;
        esac

        echo "✅ Dependencies installed successfully"

    - name: Install Prettier Plugins
      id: install-plugins
      if: inputs.plugins != ''
      shell: sh
      env:
        PACKAGE_MANAGER: ${{ steps.detect-pm.outputs.package-manager }}
        PLUGINS: ${{ inputs.plugins }}
      run: |
        set -eu

        printf 'Installing Prettier plugins: %s\n' "$PLUGINS"

        # Convert comma-separated list to space-separated
        plugins_list=$(printf '%s\n' "$PLUGINS" | tr ',' ' ')

        # Deliberate split into one argument per plugin; set -f keeps glob
        # characters in a version range such as plugin@* literal.
        set -f
        set -- $plugins_list
        set +f

        # Install for this run only: no lifecycle scripts, and package.json and
        # the lockfile stay as committed, because the auto-commit step stages
        # every tracked file that changed. npm and bun have --no-save; pnpm and
        # yarn have no equivalent, so their manifests are restored on exit, also
        # when the install fails partway.
        command -v mktemp >/dev/null 2>&1 || { echo "::error::mktemp is required to back up the manifests"; exit 1; }
        backup=$(mktemp -d "$RUNNER_TEMP/prettier-lint-manifests.XXXXXX")
        restore_manifests() {
          for f in package.json pnpm-lock.yaml yarn.lock; do
            if [ -f "$backup/$f" ]; then cp -p "$backup/$f" "$f"; fi
          done
          rm -rf "$backup"
        }
        trap restore_manifests EXIT
        for f in package.json pnpm-lock.yaml yarn.lock; do
          if [ -f "$f" ]; then cp -p "$f" "$backup/$f"; fi
        done

        case "$PACKAGE_MANAGER" in
          "pnpm")
            command -v pnpm >/dev/null 2>&1 || { echo "::error::pnpm is required to install the plugins"; exit 1; }
            pnpm add -D --ignore-scripts "$@"
            ;;
          "yarn")
            command -v yarn >/dev/null 2>&1 || { echo "::error::yarn is required to install the plugins"; exit 1; }
            # The running Yarn decides the flags: a Yarn 2+ project needs no .yarnrc.yml.
            # Yarn 2+ has no --ignore-scripts; enableScripts off stops lifecycle scripts,
            # and --mode=skip-build (Yarn 3+) also skips builds a repository's
            # dependenciesMeta turns back on with built: true.
            case "$(yarn --version)" in
              1.*) yarn add -D --ignore-scripts "$@" ;;
              2.*) YARN_ENABLE_SCRIPTS=false yarn add -D "$@" ;;
              *) YARN_ENABLE_SCRIPTS=false yarn add -D --mode=skip-build "$@" ;;
            esac
            ;;
          "bun")
            command -v bun >/dev/null 2>&1 || { echo "::error::bun is required to install the plugins"; exit 1; }
            bun add --no-save --ignore-scripts "$@"
            ;;
          "npm"|*)
            command -v npm >/dev/null 2>&1 || { echo "::error::npm is required to install the plugins"; exit 1; }
            npm install --no-save --ignore-scripts "$@"
            ;;
        esac

        echo "✅ Plugins installed successfully"

    - name: Ensure Prettier
      id: ensure-prettier
      shell: sh
      working-directory: ${{ inputs.working-directory }}
      env:
        ACTION_PATH: ${{ github.action_path }}
        CONFIG_FILE: ${{ inputs.config-file }}
        IGNORE_FILE: ${{ inputs.ignore-file }}
        PACKAGE_MANAGER: ${{ steps.detect-pm.outputs.package-manager }}
        REQUESTED_VERSION: ${{ inputs.prettier-version }}
      run: |
        set -eu

        # However this step fails, it writes status=failure, which the action's status output
        # falls back to when neither check nor fix mode runs after it.
        failure_status() {
          printf 'status=%s\n' "failure" >> "$GITHUB_OUTPUT"
        }
        trap '[ "$?" -eq 0 ] || failure_status' EXIT

        # A config or ignore file other than the default must be there, for check and fix mode
        # alike, rather than Prettier formatting by whatever it finds instead.
        if [ -n "$CONFIG_FILE" ] && [ "$CONFIG_FILE" != ".prettierrc" ] && [ ! -f "$CONFIG_FILE" ]; then
          echo "::error::config-file $CONFIG_FILE does not exist"
          exit 1
        fi
        if [ -n "$IGNORE_FILE" ] && [ "$IGNORE_FILE" != ".prettierignore" ] && [ ! -f "$IGNORE_FILE" ]; then
          echo "::error::ignore-file $IGNORE_FILE does not exist"
          exit 1
        fi

        command -v jq >/dev/null 2>&1 || { echo "::error::jq is required to read package.json"; exit 1; }

        # The repository's own copy wins, so it formats the way the repository expects. Running
        # it cannot tell, because npx --no-install and pnpm exec also find a global install, so
        # ownership is read from node_modules, or from package.json for Yarn Plug'n'Play, which has
        # none, here and in each parent up to the checkout: Node resolves packages through those,
        # so a working directory below the project root still has the root's copy.
        # The same check as eslint-lint's Ensure ESLint step: each action is self-contained.
        # owns sets found_in to node_modules or package.json, saying how it found the copy,
        # found_dir to the directory it found it in, and manifest_dir to the nearest directory
        # with a package.json, whose package Yarn 2 and later resolve binaries for.
        owns() {
          _dir=$PWD
          manifest_dir=
          while :; do
            found_dir=$_dir
            if [ -z "$manifest_dir" ] && [ -f "$_dir/package.json" ]; then
              manifest_dir=$_dir
            fi
            if [ -d "$_dir/node_modules/$1" ]; then
              found_in=node_modules
              return 0
            fi
            if [ -f "$_dir/package.json" ] && jq -e --arg name "$1" \
              '(.dependencies // {}) + (.devDependencies // {}) | has($name)' "$_dir/package.json" >/dev/null; then
              found_in=package.json
              return 0
            fi
            case "$_dir" in "${GITHUB_WORKSPACE:-$PWD}" | /) return 1 ;; esac
            _dir=$(dirname -- "$_dir")
          done
        }

        if owns prettier; then
          # The package manager resolves it; npx --no-install cannot under Plug'n'Play. None of these
          # fetches a package, so a copy that is not installed fails the run. Yarn 2 and later run a
          # package.json script before a binary of the same name, so they are told to run the
          # binary. They only see binaries of the nearest package's own dependencies, so a copy
          # that the root workspace declares for a child one is run with --top-level, which
          # resolves it from the root and still runs it in this directory. Yarn 1 cannot skip
          # the script: a node_modules install runs through npx --no-install instead, and a
          # Plug'n'Play one, which that cannot load, through Yarn as before.
          case "$PACKAGE_MANAGER" in
            "pnpm")
              command -v pnpm >/dev/null 2>&1 || { echo "::error::pnpm is required to run Prettier"; exit 1; }
              set -- pnpm exec prettier
              ;;
            "yarn")
              command -v yarn >/dev/null 2>&1 || { echo "::error::yarn is required to run Prettier"; exit 1; }
              case "$(yarn --version)" in
                1.*)
                  if [ "$found_in" = node_modules ]; then
                    command -v npx >/dev/null 2>&1 || { echo "::error::running Prettier requires npx"; exit 1; }
                    set -- npx --no-install prettier
                  else
                    set -- yarn prettier
                  fi
                  ;;
                *)
                  if [ -n "$manifest_dir" ] && [ "$found_dir" != "$manifest_dir" ]; then
                    set -- yarn run --top-level --binaries-only prettier
                  else
                    set -- yarn run --binaries-only prettier
                  fi
                  ;;
              esac
              ;;
            "bun")
              command -v bunx >/dev/null 2>&1 || { echo "::error::running Prettier requires bunx"; exit 1; }
              set -- bunx --no-install prettier
              ;;
            "npm"|*)
              command -v npx >/dev/null 2>&1 || { echo "::error::running Prettier requires npx"; exit 1; }
              set -- npx --no-install prettier
              ;;
          esac
        else
          set --
        fi
        printf 'command=%s\n' "$*" >> "$GITHUB_OUTPUT"

        # Without a copy of its own, the repository gets this action's package-lock.json: npm ci
        # installs each package of the tree at its locked version and integrity hash, with no
        # lifecycle scripts. It goes to a prefix of its own, outside the checkout, and runs by
        # path, so no other copy on PATH can stand in for it. A version the caller names is not
        # in the lockfile: it comes from the registry without lifecycle scripts, and its
        # dependencies resolve to whatever their ranges allow. Each prefix is a new directory
        # under RUNNER_TEMP, which the runner empties between jobs except for files it cannot
        # delete, so nothing an earlier job left there, such as an .npmrc npm reads from the
        # prefix, takes part. The same locked install as eslint-lint's and biome-lint's: each
        # action is self-contained.
        bin=
        if [ -z "$*" ]; then
          command -v npm >/dev/null 2>&1 || { echo "::error::npm is required to install Prettier"; exit 1; }
          command -v mktemp >/dev/null 2>&1 || { echo "::error::mktemp is required to create the install prefix"; exit 1; }
          # The validator reads a version of only spaces as left out, and so does this step;
          # npm would read it as any version.
          case "$REQUESTED_VERSION" in *[![:space:]]*) ;; *) REQUESTED_VERSION= ;; esac
          if [ -n "$REQUESTED_VERSION" ]; then
            prefix=$(mktemp -d "$RUNNER_TEMP/prettier-lint-requested.XXXXXX")
            npm install --prefix "$prefix" --no-package-lock --no-audit --no-fund --ignore-scripts \
              "prettier@$REQUESTED_VERSION"
          else
            prefix=$(mktemp -d "$RUNNER_TEMP/prettier-lint-tools.XXXXXX")
            cp "$ACTION_PATH/package.json" "$ACTION_PATH/package-lock.json" "$prefix/"
            npm ci --prefix "$prefix" --ignore-scripts --no-audit --no-fund
          fi
          bin="$prefix/node_modules/.bin/prettier"
          [ -x "$bin" ] || { echo "::error::prettier is not at $bin after its install"; exit 1; }
          version=$("$bin" --version) || { echo "::error::prettier at $bin does not run"; exit 1; }
          printf 'Running Prettier %s from %s\n' "$version" "$bin"
        fi
        printf 'bin=%s\n' "$bin" >> "$GITHUB_OUTPUT"

    - name: Run Prettier Check
      if: inputs.mode == 'check'
      id: check
      shell: sh
      working-directory: ${{ inputs.working-directory }}
      env:
        PRETTIER_BIN: ${{ steps.ensure-prettier.outputs.bin }}
        PRETTIER_COMMAND: ${{ steps.ensure-prettier.outputs.command }}
        CONFIG_FILE: ${{ inputs.config-file }}
        IGNORE_FILE: ${{ inputs.ignore-file }}
        CACHE: ${{ inputs.cache }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        FILE_PATTERN: ${{ inputs.file-pattern }}
      run: |
        set -eu

        echo "Running Prettier check mode..."

        # The copy this action installed runs by its path, which may hold spaces.
        # PRETTIER_COMMAND, the repository's own copy through its package manager, is several
        # words, so it is split on purpose.
        set -f
        if [ -n "$PRETTIER_BIN" ]; then
          set -- "$PRETTIER_BIN" --check
        else
          set -- $PRETTIER_COMMAND --check
        fi
        set +f

        # A config or ignore file other than the default is passed on; the ensure step has made
        # sure it is there. Prettier 3 reads .gitignore and .prettierignore by default, and
        # --ignore-path replaces both, so another ignore file is read with .gitignore. Prettier 2
        # reads only the last --ignore-path, which is the file named here, as it never read
        # .gitignore.
        if [ -n "$CONFIG_FILE" ] && [ "$CONFIG_FILE" != ".prettierrc" ]; then
          set -- "$@" --config "$CONFIG_FILE"
        fi
        if [ -n "$IGNORE_FILE" ] && [ "$IGNORE_FILE" != ".prettierignore" ]; then
          set -- "$@" --ignore-path .gitignore --ignore-path "$IGNORE_FILE"
        fi

        # Add cache option
        if [ "$CACHE" = "true" ]; then
          set -- "$@" --cache
        fi

        # Run Prettier and capture results
        prettier_exit_code=0
        files_checked=0
        unformatted_files=0

        # The output goes to a new file outside the checkout, so no later step finds it there and
        # nothing left at a fixed path can take the write, and is shown in the log. Prettier names
        # each unformatted file on a [warn] line and adds one summary [warn] line, which is not a
        # file.
        command -v mktemp >/dev/null 2>&1 || {
          echo "::error::mktemp is required to hold Prettier's output"
          printf 'status=%s\n' "failure" >> "$GITHUB_OUTPUT"
          exit 1
        }
        output=$(mktemp "$RUNNER_TEMP/prettier-lint-output.XXXXXX")
        tool_error=
        # GitHub Actions sets CI, which makes Prettier color its [warn] and [error] tags, and a
        # caller can set FORCE_COLOR. NO_COLOR keeps them plain for Prettier 3, FORCE_COLOR=0 for
        # Prettier 2, whose bundled Chalk ignores NO_COLOR.
        if NO_COLOR=1 FORCE_COLOR=0 "$@" -- "$FILE_PATTERN" > "$output" 2>&1; then
          prettier_exit_code=0
          printf 'status=%s\n' "success" >> "$GITHUB_OUTPUT"
        else
          prettier_exit_code=$?
          # The summary line, Prettier 3's or Prettier 2's, is matched whole, so a file whose name
          # starts like it still counts.
          unformatted_files=$(grep '^\[warn\] ' "$output" |
            grep -c -v -E '^\[warn\] Code style issues (found|fixed) in (the above file|[0-9]+ files)\.( Run Prettier with --write to fix\.| Forgot to run Prettier\?)?$' || true)
          printf 'status=%s\n' "failure" >> "$GITHUB_OUTPUT"
          # Status 2 is Prettier failing to check. So is status 1 with an [error] line, as when it
          # cannot load a plugin or its config, where a formatting difference prints only [warn].
          if [ "$prettier_exit_code" -gt 1 ] || grep -q '^\[error\] ' "$output"; then
            tool_error=yes
          fi
        fi
        cat "$output"

        # Count all files matching the pattern (total checked, not just unformatted).
        # Handles both brace globs (**/*.{js,ts}) and plain globs (**/*.js).
        case "$FILE_PATTERN" in
          *\{*\}*)
            _pattern_exts=$(printf '%s' "$FILE_PATTERN" | sed -E 's/.*\{([^}]*)}.*/\1/' | tr ',' '\n')
            ;;
          *)
            _pattern_exts=$(printf '%s' "$FILE_PATTERN" | sed -E 's/.*\*\.([a-zA-Z0-9]*).*/\1/')
            ;;
        esac
        if [ -n "$_pattern_exts" ]; then
          files_checked=$(printf '%s\n' "$_pattern_exts" | while IFS= read -r _ext; do
            [ -n "$_ext" ] && find . -not -path '*/.git/*' -not -path '*/node_modules/*' -name "*.$_ext" -type f 2>/dev/null
          done | wc -l | tr -d ' ' || echo "0")
        else
          files_checked="0"
        fi

        printf 'files_checked=%s\n' "$files_checked" >> "$GITHUB_OUTPUT"
        printf 'unformatted_files=%s\n' "$unformatted_files" >> "$GITHUB_OUTPUT"

        echo "✅ Prettier check completed: $unformatted_files unformatted files out of $files_checked checked"

        # Unformatted files are for fail-on-error to decide about. Prettier failing to check fails
        # the step either way. The counts above are written first, as eslint-lint writes its own.
        if [ -n "$tool_error" ]; then
          echo "::error::Prettier could not check the files (exit status $prettier_exit_code; see its [error] lines above)"
          exit "$prettier_exit_code"
        fi
        if [ "$FAIL_ON_ERROR" = "true" ]; then
          exit "$prettier_exit_code"
        fi

    - name: Run Prettier Fix
      if: inputs.mode == 'fix'
      id: fix
      shell: sh
      working-directory: ${{ inputs.working-directory }}
      env:
        PRETTIER_BIN: ${{ steps.ensure-prettier.outputs.bin }}
        PRETTIER_COMMAND: ${{ steps.ensure-prettier.outputs.command }}
        CONFIG_FILE: ${{ inputs.config-file }}
        IGNORE_FILE: ${{ inputs.ignore-file }}
        FILE_PATTERN: ${{ inputs.file-pattern }}
      run: |
        set -eu

        echo "Running Prettier fix mode..."

        command -v git >/dev/null 2>&1 || {
          echo "::error::git is required to count the files Prettier changes"
          printf 'status=%s\n' "failure" >> "$GITHUB_OUTPUT"
          exit 1
        }

        # The same command, config file and ignore file as check mode: by path for the copy this
        # action installed, split on purpose for the repository's own.
        set -f
        if [ -n "$PRETTIER_BIN" ]; then
          set -- "$PRETTIER_BIN" --write
        else
          set -- $PRETTIER_COMMAND --write
        fi
        set +f
        if [ -n "$CONFIG_FILE" ] && [ "$CONFIG_FILE" != ".prettierrc" ]; then
          set -- "$@" --config "$CONFIG_FILE"
        fi
        if [ -n "$IGNORE_FILE" ] && [ "$IGNORE_FILE" != ".prettierignore" ]; then
          set -- "$@" --ignore-path .gitignore --ignore-path "$IGNORE_FILE"
        fi

        # Count files before fix
        files_before=$(git status --porcelain | wc -l | tr -d ' ')

        # prettier --write leaves no findings to report: it exits non-zero (2) only when it could
        # not format, as for a file it cannot parse, a bad configuration or a crash. So any
        # failure fails the step instead of committing a partial run as a success.
        prettier_exit_code=0
        "$@" -- "$FILE_PATTERN" || prettier_exit_code=$?
        if [ "$prettier_exit_code" -ne 0 ]; then
          echo "::error::Prettier failed with exit status $prettier_exit_code"
          printf 'status=%s\n' "failure" >> "$GITHUB_OUTPUT"
          exit "$prettier_exit_code"
        fi

        # Count files after fix
        files_after=$(git status --porcelain | wc -l | tr -d ' ')
        files_changed=$((files_after - files_before))

        printf 'files_changed=%s\n' "$files_changed" >> "$GITHUB_OUTPUT"
        printf 'status=%s\n' "success" >> "$GITHUB_OUTPUT"

        echo "✅ Prettier fix completed. Files changed: $files_changed"

    - name: Commit and Push Fixes
      if: inputs.mode == 'fix' && success()
      uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
      with:
        commit_message: 'style: autofix Prettier formatting'
        commit_user_name: ${{ inputs.username }}
        commit_user_email: ${{ inputs.email }}
        add_options: '-u'
