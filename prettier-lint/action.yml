# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
# permissions:
#   - contents: write         # Required for fix mode to push changes
#   - security-events: write  # Required for check mode to upload SARIF
---
name: Prettier Lint
description: 'Run Prettier in check or fix mode with advanced configuration and reporting'
author: Ismo Vuorinen

branding:
  icon: check-circle
  color: green

inputs:
  mode:
    description: 'Mode to run (check or fix)'
    required: false
    default: 'check'
  working-directory:
    description: 'Directory containing files to format'
    required: false
    default: '.'
  prettier-version:
    description: 'Prettier version to install when the repository has no copy of its own (empty: the version pinned in this action, "latest": the newest release)'
    required: false
    default: ''
  config-file:
    description: 'Path to Prettier config file'
    required: false
    default: '.prettierrc'
  ignore-file:
    description: 'Path to Prettier ignore file'
    required: false
    default: '.prettierignore'
  file-pattern:
    description: 'Files to include (glob pattern)'
    required: false
    default: '**/*.{js,jsx,ts,tsx,css,scss,json,md,yaml,yml}'
  cache:
    description: 'Enable Prettier caching (lowercase true or false)'
    required: false
    default: 'true'
  fail-on-error:
    description: 'Fail workflow if issues are found (check mode only; lowercase true or false)'
    required: false
    default: 'true'
  report-format:
    description: 'Output format for check mode (json, sarif)'
    required: false
    default: 'sarif'
  max-retries:
    description: 'Maximum number of retry attempts (1-10, must not be empty)'
    required: false
    default: '3'
  plugins:
    description: 'Comma-separated list of Prettier plugins to install'
    required: false
    default: ''
  token:
    description: 'GitHub token for authentication. Stays in git config after checkout in fix mode only.'
    required: false
    default: ''
  username:
    description: 'GitHub username for commits (fix mode only)'
    required: false
    default: 'github-actions'
  email:
    description: 'GitHub email for commits (fix mode only)'
    required: false
    default: 'github-actions@github.com'

outputs:
  status:
    description: 'Overall status (success/failure)'
    value: ${{ steps.check.outputs.status || steps.fix.outputs.status }}
  files-checked:
    description: 'Number of files with an extension named in file-pattern (check mode only). Directories in the pattern and ignore files are not applied, so it can differ from the files Prettier checked.'
    value: ${{ steps.check.outputs.files_checked }}
  unformatted-files:
    description: 'Number of files with formatting issues (check mode only)'
    value: ${{ steps.check.outputs.unformatted_files }}
  sarif-file:
    description: 'Path to SARIF report file (check mode only)'
    value: ${{ steps.check.outputs.sarif_file }}
  files-changed:
    description: 'Number of files changed (fix mode only)'
    value: ${{ steps.fix.outputs.files_changed }}

runs:
  using: composite
  steps:
    - name: Validate Inputs
      shell: sh
      working-directory: ${{ github.action_path }}
      env:
        INPUT_CACHE: ${{ inputs.cache }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_EMAIL: ${{ inputs.email }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        INPUT_FILE_PATTERN: ${{ inputs.file-pattern }}
        INPUT_IGNORE_FILE: ${{ inputs.ignore-file }}
        INPUT_MAX_RETRIES: ${{ inputs.max-retries }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_PLUGINS: ${{ inputs.plugins }}
        INPUT_PRETTIER_VERSION: ${{ inputs.prettier-version }}
        INPUT_REPORT_FORMAT: ${{ inputs.report-format }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -eu
        if ! command -v python3 >/dev/null 2>&1; then
          echo "::error::python3 is required to validate inputs"
          exit 1
        fi
        python3 validate.py

    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ inputs.token || github.token }}
        # Only fix mode pushes; git-auto-commit-action authenticates with the
        # credentials actions/checkout leaves in git config.
        persist-credentials: ${{ inputs.mode == 'fix' }}

    - name: Detect Package Manager
      id: detect-pm
      shell: sh
      run: |
        set -eu

        # Detect package manager from lockfiles
        if [ -f bun.lockb ]; then
          package_manager="bun"
        elif [ -f pnpm-lock.yaml ]; then
          package_manager="pnpm"
        elif [ -f yarn.lock ]; then
          package_manager="yarn"
        else
          package_manager="npm"
        fi

        printf 'package-manager=%s\n' "$package_manager" >> "$GITHUB_OUTPUT"
        echo "Detected package manager: $package_manager"

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'

    - name: Enable Corepack
      shell: sh
      run: |
        set -eu
        corepack enable

    - name: Install Package Manager
      id: install-pm
      shell: sh
      env:
        PACKAGE_MANAGER: ${{ steps.detect-pm.outputs.package-manager }}
        # renovate: datasource=npm depName=pnpm
        PNPM_VERSION: '12.18.0'
        # renovate: datasource=npm depName=@yarnpkg/cli-dist
        YARN_VERSION: '4.18.1'
      run: |
        set -eu

        case "$PACKAGE_MANAGER" in
          pnpm)
            corepack prepare "pnpm@$PNPM_VERSION" --activate
            ;;
          yarn)
            corepack prepare "yarn@$YARN_VERSION" --activate
            ;;
          bun|npm)
            # Bun installed separately, npm built-in
            ;;
        esac

    - name: Setup Bun
      if: steps.detect-pm.outputs.package-manager == 'bun'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      env:
        # renovate: datasource=github-releases depName=oven-sh/bun extractVersion=^bun-v(?<version>.+)$
        BUN_VERSION: '1.4.4'
      with:
        bun-version: ${{ env.BUN_VERSION }}

    - name: Cache Node Dependencies
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: ${{ runner.os }}-prettier-lint-${{ inputs.mode }}-${{ steps.detect-pm.outputs.package-manager }}-${{ hashFiles('package-lock.json', 'yarn.lock', 'pnpm-lock.yaml', 'bun.lockb') }}
        restore-keys: |
          ${{ runner.os }}-prettier-lint-${{ inputs.mode }}-${{ steps.detect-pm.outputs.package-manager }}-
          ${{ runner.os }}-prettier-lint-${{ inputs.mode }}-

    - name: Install Dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: sh
      env:
        PACKAGE_MANAGER: ${{ steps.detect-pm.outputs.package-manager }}
      run: |
        set -eu

        echo "Installing dependencies using $PACKAGE_MANAGER..."

        case "$PACKAGE_MANAGER" in
          "pnpm")
            pnpm install --frozen-lockfile
            ;;
          "yarn")
            if [ -f ".yarnrc.yml" ]; then
              yarn install --immutable
            else
              yarn install --frozen-lockfile
            fi
            ;;
          "bun")
            bun install --frozen-lockfile
            ;;
          "npm"|*)
            npm ci
            ;;
        esac

        echo "✅ Dependencies installed successfully"

    - name: Install Prettier Plugins
      id: install-plugins
      if: inputs.plugins != ''
      shell: sh
      env:
        PACKAGE_MANAGER: ${{ steps.detect-pm.outputs.package-manager }}
        PLUGINS: ${{ inputs.plugins }}
      run: |
        set -eu

        printf 'Installing Prettier plugins: %s\n' "$PLUGINS"

        # Convert comma-separated list to space-separated
        plugins_list=$(printf '%s\n' "$PLUGINS" | tr ',' ' ')

        # Deliberate split into one argument per plugin; set -f keeps glob
        # characters in a version range such as plugin@* literal.
        set -f
        set -- $plugins_list
        set +f

        case "$PACKAGE_MANAGER" in
          "pnpm")
            pnpm add -D "$@"
            ;;
          "yarn")
            yarn add -D "$@"
            ;;
          "bun")
            bun add -D "$@"
            ;;
          "npm"|*)
            npm install --save-dev "$@"
            ;;
        esac

        echo "✅ Plugins installed successfully"

    - name: Ensure Prettier
      id: ensure-prettier
      shell: sh
      working-directory: ${{ inputs.working-directory }}
      env:
        PACKAGE_MANAGER: ${{ steps.detect-pm.outputs.package-manager }}
        REQUESTED_VERSION: ${{ inputs.prettier-version }}
        # renovate: datasource=npm depName=prettier
        DEFAULT_PRETTIER_VERSION: '3.9.10'
      run: |
        set -eu

        command -v jq >/dev/null 2>&1 || { echo "::error::jq is required to read package.json"; exit 1; }

        # The repository's own copy wins, so it formats the way the repository expects. Running
        # it cannot tell, because npx --no-install and pnpm exec also find a global install, so
        # ownership is read from node_modules, or from package.json for Yarn Plug'n'Play, which has
        # none, here and in each parent up to the checkout: Node resolves packages through those,
        # so a working directory below the project root still has the root's copy.
        # The same check as eslint-lint's Ensure ESLint step: each action is self-contained.
        # owns sets found_in to node_modules or package.json, saying how it found the copy.
        owns() {
          _dir=$PWD
          while :; do
            if [ -d "$_dir/node_modules/$1" ]; then
              found_in=node_modules
              return 0
            fi
            if [ -f "$_dir/package.json" ] && jq -e --arg name "$1" \
              '(.dependencies // {}) + (.devDependencies // {}) | has($name)' "$_dir/package.json" >/dev/null; then
              found_in=package.json
              return 0
            fi
            case "$_dir" in "${GITHUB_WORKSPACE:-$PWD}" | /) return 1 ;; esac
            _dir=$(dirname -- "$_dir")
          done
        }

        if owns prettier; then
          # The package manager resolves it; npx --no-install cannot under Plug'n'Play. None of these
          # fetches a package, so a copy that is not installed fails the run. Yarn 2 and later run a
          # package.json script before a binary of the same name, so they are told to run the
          # binary. Yarn 1 cannot be: a node_modules install runs through npx --no-install
          # instead, and a Plug'n'Play one, which that cannot load, through Yarn as before.
          case "$PACKAGE_MANAGER" in
            "pnpm") set -- pnpm exec prettier ;;
            "yarn")
              case "$(yarn --version)" in
                1.*)
                  if [ "$found_in" = node_modules ]; then
                    set -- npx --no-install prettier
                  else
                    set -- yarn prettier
                  fi
                  ;;
                *) set -- yarn run --binaries-only prettier ;;
              esac
              ;;
            "bun") set -- bunx --no-install prettier ;;
            "npm"|*) set -- npx --no-install prettier ;;
          esac
        else
          npm install -g "prettier@${REQUESTED_VERSION:-$DEFAULT_PRETTIER_VERSION}"
          set -- prettier
        fi
        printf 'command=%s\n' "$*" >> "$GITHUB_OUTPUT"

    - name: Run Prettier Check
      if: inputs.mode == 'check'
      id: check
      shell: sh
      working-directory: ${{ inputs.working-directory }}
      env:
        PRETTIER_COMMAND: ${{ steps.ensure-prettier.outputs.command }}
        CONFIG_FILE: ${{ inputs.config-file }}
        CACHE: ${{ inputs.cache }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        FILE_PATTERN: ${{ inputs.file-pattern }}
      run: |
        set -eu

        echo "Running Prettier check mode..."

        # PRETTIER_COMMAND is several words, so it is split on purpose
        set -f
        set -- $PRETTIER_COMMAND --check
        set +f

        # Add config file if specified and exists
        if [ "$CONFIG_FILE" != ".prettierrc" ] && [ -f "$CONFIG_FILE" ]; then
          set -- "$@" --config "$CONFIG_FILE"
        fi

        # Add cache option
        if [ "$CACHE" = "true" ]; then
          set -- "$@" --cache
        fi

        # Run Prettier and capture results
        prettier_exit_code=0
        files_checked=0
        unformatted_files=0

        if "$@" -- "$FILE_PATTERN" > prettier-output.txt 2>&1; then
          prettier_exit_code=0
          printf 'status=%s\n' "success" >> "$GITHUB_OUTPUT"
        else
          prettier_exit_code=$?
          unformatted_files=$(grep -c "^\[warn\]" prettier-output.txt || true)
          printf 'status=%s\n' "failure" >> "$GITHUB_OUTPUT"
        fi

        # Count all files matching the pattern (total checked, not just unformatted).
        # Handles both brace globs (**/*.{js,ts}) and plain globs (**/*.js).
        case "$FILE_PATTERN" in
          *\{*\}*)
            _pattern_exts=$(printf '%s' "$FILE_PATTERN" | sed -E 's/.*\{([^}]*)}.*/\1/' | tr ',' '\n')
            ;;
          *)
            _pattern_exts=$(printf '%s' "$FILE_PATTERN" | sed -E 's/.*\*\.([a-zA-Z0-9]*).*/\1/')
            ;;
        esac
        if [ -n "$_pattern_exts" ]; then
          files_checked=$(printf '%s\n' "$_pattern_exts" | while IFS= read -r _ext; do
            [ -n "$_ext" ] && find . -not -path '*/.git/*' -not -path '*/node_modules/*' -name "*.$_ext" -type f 2>/dev/null
          done | wc -l | tr -d ' ' || echo "0")
        else
          files_checked="0"
        fi

        printf 'files_checked=%s\n' "$files_checked" >> "$GITHUB_OUTPUT"
        printf 'unformatted_files=%s\n' "$unformatted_files" >> "$GITHUB_OUTPUT"
        printf 'sarif_file=%s\n' "prettier-results.sarif" >> "$GITHUB_OUTPUT"

        echo "✅ Prettier check completed: $unformatted_files unformatted files out of $files_checked checked"

        # Exit with prettier's exit code if fail-on-error is true
        if [ "$FAIL_ON_ERROR" = "true" ]; then
          exit "$prettier_exit_code"
        fi

    - name: Run Prettier Fix
      if: inputs.mode == 'fix'
      id: fix
      shell: sh
      working-directory: ${{ inputs.working-directory }}
      env:
        PRETTIER_COMMAND: ${{ steps.ensure-prettier.outputs.command }}
        FILE_PATTERN: ${{ inputs.file-pattern }}
      run: |
        set -eu

        echo "Running Prettier fix mode..."

        # Count files before fix
        files_before=$(git status --porcelain | wc -l | tr -d ' ')

        # Run Prettier fix. PRETTIER_COMMAND is several words, so it is split on purpose
        set -f
        $PRETTIER_COMMAND --write -- "$FILE_PATTERN" || true
        set +f

        # Count files after fix
        files_after=$(git status --porcelain | wc -l | tr -d ' ')
        files_changed=$((files_after - files_before))

        printf 'files_changed=%s\n' "$files_changed" >> "$GITHUB_OUTPUT"
        printf 'status=%s\n' "success" >> "$GITHUB_OUTPUT"

        echo "✅ Prettier fix completed. Files changed: $files_changed"

    - name: Commit and Push Fixes
      if: inputs.mode == 'fix' && success()
      uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
      with:
        commit_message: 'style: autofix Prettier formatting'
        commit_user_name: ${{ inputs.username }}
        commit_user_email: ${{ inputs.email }}
        add_options: '-u'
