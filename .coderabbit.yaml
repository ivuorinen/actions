---
# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
# Reviews here otherwise run on this repository's CodeRabbit UI settings, which leave automatic
# approvals off. This file turns them on and inherits every other setting.
inheritance: true
reviews:
  auto_approvals:
    enabled: true
    allow_author_approval: false
  # Generated files are not reviewed: their sources are. The Generated Files workflow's checks
  # (Validator drift, Action README drift) fail when a file these filters skip is not one the
  # generator writes, or differs from what it writes, and both run on every pull request, so the
  # branch ruleset can require them. A new pattern needs its own check there;
  # _validation/tests/test_spec.py pins this list.
  # The plan's per-review file limit counts only the files these filters leave, so a change that
  # regenerates every validator still gets a review. Exclusions only: an include pattern would
  # turn the list into an allowlist.
  path_filters:
    # Each action's validator, generated from _validation/ (make update-validators).
    - '!*/validate.py'
    # Each action's README, generated from its action.yml (make docs). The pattern matches every
    # top-level directory not starting with _ or a dot, which today are the actions. The READMEs
    # of _tests/, _validation/ and the deeper directories, and the repository README, stay in
    # review.
    - '![!_.]*/README.md'
