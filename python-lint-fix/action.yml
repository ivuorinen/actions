# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
# permissions:
#   - contents: write  # Required for committing and pushing lint fixes
#   - security-events: write  # Required for uploading SARIF reports
---
name: Python Lint and Fix
description: 'Lints and fixes Python files, commits changes, and uploads SARIF report.'
author: 'Ismo Vuorinen'

branding:
  icon: 'code'
  color: 'yellow'

inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.11'
  flake8-version:
    description: 'Flake8 version to use'
    required: false
    default: '7.0.0'
  autopep8-version:
    description: 'Autopep8 version to use'
    required: false
    default: '2.2.0'
  max-retries:
    description: 'Maximum number of retry attempts for installations and linting (1-10, must not be empty)'
    required: false
    default: '3'
  working-directory:
    description: 'Directory containing Python files to lint'
    required: false
    default: '.'
  fail-on-error:
    description: 'Whether to fail the action if linting errors are found (lowercase true or false)'
    required: false
    default: 'true'
  token:
    description: 'GitHub token for authentication'
    required: false
  username:
    description: 'GitHub username for commits'
    required: false
    default: 'github-actions'
  email:
    description: 'GitHub email for commits'
    required: false
    default: 'github-actions@github.com'

outputs:
  lint-result:
    description: 'Result of the linting process (success/failure)'
    value: ${{ steps.lint.outputs.result }}
  fixed-files:
    description: 'Number of files that were fixed'
    value: ${{ steps.fix.outputs.fixed_count }}
  error-count:
    description: 'Number of errors found'
    value: ${{ steps.lint.outputs.error_count }}

runs:
  using: composite
  steps:
    - name: Validate Inputs
      shell: sh
      working-directory: ${{ github.action_path }}
      env:
        INPUT_AUTOPEP8_VERSION: ${{ inputs.autopep8-version }}
        INPUT_EMAIL: ${{ inputs.email }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        INPUT_FLAKE8_VERSION: ${{ inputs.flake8-version }}
        INPUT_MAX_RETRIES: ${{ inputs.max-retries }}
        INPUT_PYTHON_VERSION: ${{ inputs.python-version }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -eu
        if ! command -v python3 >/dev/null 2>&1; then
          echo "::error::python3 is required to validate inputs"
          exit 1
        fi
        python3 validate.py

    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ inputs.token || github.token }}
        # git-auto-commit-action pushes the auto-fix commit using the token that
        # actions/checkout persists in .git/config; persist-credentials must stay
        # true or the "Commit Fixes" step cannot authenticate its push.
        persist-credentials: true # zizmor: ignore[artipacked]

    - name: Detect Python Version
      id: python-version
      shell: sh
      env:
        ACTION_PATH: ${{ github.action_path }}
        DEFAULT_VERSION: "${{ inputs.python-version || '3.11' }}"
      run: |
        set -eu
        command -v python3 >/dev/null 2>&1 || { echo "::error::python3 is required to validate detected versions"; exit 1; }

        # Repository files are untrusted: the rule lives in _validation/kit.py and ships in
        # validate.py. Run from the action directory so the checkout cannot steer python3.
        validate_version() {
          (cd "$ACTION_PATH" && python3 validate.py --detected-version "$1")
        }

        # Function to clean version string
        clean_version() {
          printf '%s' "$1" | sed -E 's/^[vV]//' | tr -d ' \n\r'
        }

        detected_version=""

        # Parse .tool-versions file
        if [ -f .tool-versions ]; then
          echo "Checking .tool-versions for python..." >&2
          version=$(awk '/^python[[:space:]]/ {gsub(/#.*/, ""); print $2; exit}' .tool-versions 2>/dev/null || echo "")
          if [ -n "$version" ]; then
            version=$(clean_version "$version")
            if validate_version "$version"; then
              echo "Found Python version in .tool-versions: $version" >&2
              detected_version="$version"
            fi
          fi
        fi

        # Parse Dockerfile
        if [ -z "$detected_version" ] && [ -f Dockerfile ]; then
          echo "Checking Dockerfile for python..." >&2
          version=$(grep -iF "FROM" Dockerfile | grep -F "python:" | head -1 | \
            sed -n -E "s/.*python:([0-9]+(\.[0-9]+)*)(-[^:]*)?.*/\1/p" || echo "")
          if [ -n "$version" ]; then
            version=$(clean_version "$version")
            if validate_version "$version"; then
              echo "Found Python version in Dockerfile: $version" >&2
              detected_version="$version"
            fi
          fi
        fi

        # Parse devcontainer.json
        if [ -z "$detected_version" ] && [ -f .devcontainer/devcontainer.json ]; then
          echo "Checking devcontainer.json for python..." >&2
          if command -v jq >/dev/null 2>&1; then
            version=$(jq -r '.image // empty' .devcontainer/devcontainer.json 2>/dev/null | sed -n -E "s/.*python:([0-9]+(\.[0-9]+)*)(-[^:]*)?.*/\1/p" || echo "")
            if [ -n "$version" ]; then
              version=$(clean_version "$version")
              if validate_version "$version"; then
                echo "Found Python version in devcontainer: $version" >&2
                detected_version="$version"
              fi
            fi
          else
            echo "jq not found; skipping devcontainer.json parsing" >&2
          fi
        fi

        # Parse .python-version file
        if [ -z "$detected_version" ] && [ -f .python-version ]; then
          echo "Checking .python-version..." >&2
          version=$(tr -d '\r' < .python-version | head -1)
          if [ -n "$version" ]; then
            version=$(clean_version "$version")
            if validate_version "$version"; then
              echo "Found Python version in .python-version: $version" >&2
              detected_version="$version"
            fi
          fi
        fi

        # Parse pyproject.toml
        if [ -z "$detected_version" ] && [ -f pyproject.toml ]; then
          echo "Checking pyproject.toml..." >&2
          if grep -q '^\[project\]' pyproject.toml; then
            version=$(grep -A 20 '^\[project\]' pyproject.toml | grep -E '^[[:space:]]*requires-python[[:space:]]*=' | sed -n -E 's/[^0-9]*([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/p' | head -1)
            if [ -n "$version" ]; then
              version=$(clean_version "$version")
              if validate_version "$version"; then
                echo "Found Python version in pyproject.toml: $version" >&2
                detected_version="$version"
              fi
            fi
          fi
        fi

        # Use default version if nothing detected
        if [ -z "$detected_version" ]; then
          detected_version="$DEFAULT_VERSION"
          echo "Using default Python version: $detected_version" >&2
        fi

        # Set output
        printf 'detected-version=%s\n' "$detected_version" >> "$GITHUB_OUTPUT"
        echo "Final detected Python version: $detected_version" >&2

    - name: Detect Package Manager
      id: package-manager
      shell: sh
      run: |
        set -eu

        # Detect Python package manager based on lock files and config
        package_manager="pip"

        if [ -f "uv.lock" ]; then
          # uv uses pip-compatible caching, so we use 'pip' as cache type
          package_manager="pip"
          echo "Detected uv (using pip-compatible caching)" >&2
        elif [ -f "poetry.lock" ]; then
          package_manager="poetry"
          echo "Detected Poetry" >&2
        elif [ -f "Pipfile.lock" ] || [ -f "Pipfile" ]; then
          package_manager="pipenv"
          echo "Detected Pipenv" >&2
        elif [ -f "requirements.txt" ] || [ -f "requirements-dev.txt" ] || [ -f "setup.py" ] || [ -f "pyproject.toml" ]; then
          package_manager="pip"
          echo "Detected pip" >&2
        else
          package_manager="pip"
          echo "No package manager detected, defaulting to pip" >&2
        fi

        printf 'package-manager=%s\n' "$package_manager" >> "$GITHUB_OUTPUT"
        echo "Using package manager: $package_manager" >&2

    - name: Setup Python (pip)
      if: steps.package-manager.outputs.package-manager == 'pip'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ steps.python-version.outputs.detected-version }}
        cache: 'pip'
        cache-dependency-path: |
          **/requirements.txt
          **/requirements-dev.txt
          **/pyproject.toml
          **/setup.py
          **/uv.lock

    - name: Setup Python (pipenv)
      if: steps.package-manager.outputs.package-manager == 'pipenv'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ steps.python-version.outputs.detected-version }}
        cache: 'pipenv'
        cache-dependency-path: |
          **/Pipfile
          **/Pipfile.lock

    - name: Setup Python (poetry)
      if: steps.package-manager.outputs.package-manager == 'poetry'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ steps.python-version.outputs.detected-version }}
        cache: 'poetry'
        cache-dependency-path: |
          **/poetry.lock
          **/pyproject.toml

    - name: Check for Python Files
      id: check-files
      shell: sh
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -eu

        cd -- "$WORKING_DIRECTORY"
        if ! find . -name "*.py" -type f -not -path "*/\.*" | grep -q .; then
          echo "No Python files found. Skipping lint and fix."
          printf 'result=%s\n' "skipped" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        printf 'result=%s\n' "found" >> "$GITHUB_OUTPUT"

    - name: Install Dependencies
      if: steps.check-files.outputs.result == 'found'
      id: install
      shell: sh
      env:
        MAX_RETRIES: ${{ inputs.max-retries }}
        FLAKE8_VERSION: ${{ inputs.flake8-version }}
        AUTOPEP8_VERSION: ${{ inputs.autopep8-version }}
      run: |
        set -eu

        # Keep the virtual environment and the reports outside the workspace, where
        # flake8 would lint the installed packages and the commit step's '*.py'
        # pathspec would stage them. The runner empties RUNNER_TEMP after the job.
        work_dir=$(mktemp -d "$RUNNER_TEMP/python-lint-fix.XXXXXX")
        printf 'work_dir=%s\n' "$work_dir" >> "$GITHUB_OUTPUT"

        # -I keeps the checked-out repository off sys.path: plain `python -m` would
        # import a venv module from it, as this step runs in the workspace.
        python -I -m venv "$work_dir/venv"
        . "$work_dir/venv/bin/activate"

        # Install dependencies (pip has built-in retry logic)
        pip install "flake8==$FLAKE8_VERSION"
        pip install "autopep8==$AUTOPEP8_VERSION"

        # Verify installations
        flake8 --version || exit 1
        autopep8 --version || exit 1

    - name: Run flake8
      if: steps.check-files.outputs.result == 'found'
      id: lint
      shell: sh
      env:
        ACTION_PATH: ${{ github.action_path }}
        WORK_DIR: ${{ steps.install.outputs.work_dir }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
      run: |
        set -eu

        . "$WORK_DIR/venv/bin/activate"
        cd -- "$WORKING_DIRECTORY"

        # flake8 has no SARIF output of its own; flake8_to_sarif.py records why it
        # converts this format instead of using a plugin. %a escapes each field into
        # an ASCII literal, so any file name stays on one line.
        results_file="$WORK_DIR/flake8-results.txt"
        sarif_file="$WORK_DIR/flake8.sarif"
        : > "$results_file"
        flake8_status=0
        flake8 --no-show-source --output-file="$results_file" \
          --format='(%(row)d, %(col)d, %(code)a, %(path)a, %(text)a)' . || flake8_status=$?

        error_count=$(python "$ACTION_PATH/flake8_to_sarif.py" "$results_file" "$sarif_file" "$GITHUB_WORKSPACE")
        printf 'error_count=%s\n' "$error_count" >> "$GITHUB_OUTPUT"

        # A failure with no results means flake8 did not lint: its config or a plugin
        # failed, or a 'quiet' setting replaced the format. Uploading the empty log
        # would close the repository's open alerts, so no report is published.
        if [ "$flake8_status" -ne 0 ] && [ "$error_count" -eq 0 ]; then
          echo "::error::flake8 exited with status $flake8_status without reporting any results"
          printf 'result=%s\n' "failure" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        printf 'sarif_file=%s\n' "$sarif_file" >> "$GITHUB_OUTPUT"

        if [ "$error_count" -gt 0 ]; then
          echo "Found $error_count linting errors"

          if [ "$FAIL_ON_ERROR" = "true" ]; then
            echo "::error::Linting failed with $error_count errors"
            printf 'result=%s\n' "failure" >> "$GITHUB_OUTPUT"
            exit 1
          fi
        fi

        printf 'result=%s\n' "success" >> "$GITHUB_OUTPUT"

    - name: Run autopep8 Fix
      if: steps.check-files.outputs.result == 'found'
      id: fix
      shell: sh
      env:
        WORK_DIR: ${{ steps.install.outputs.work_dir }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -eu

        . "$WORK_DIR/venv/bin/activate"
        cd -- "$WORKING_DIRECTORY"

        # Create temporary file for tracking changes
        _changed_files=$(mktemp)

        # Run autopep8 with change detection
        find . -name "*.py" -type f -not -path "*/\.*" | while read -r file; do
          # autopep8 prints nothing when it has no fix. Its failure has to stop this step.
          file_diff=$(autopep8 --diff "$file")
          if [ -n "$file_diff" ]; then
            autopep8 --in-place "$file"
            echo "$file" >> "$_changed_files"
          fi
        done

        # Count fixed files
        fixed_count=$(wc -l < "$_changed_files" || echo 0)
        echo "Fixed $fixed_count files"
        printf 'fixed_count=%s\n' "$fixed_count" >> "$GITHUB_OUTPUT"

        # Cleanup
        rm -f "$_changed_files"

    - name: Commit Fixes
      # The count is empty when no Python files were found, and fromJSON fails on it.
      if: steps.check-files.outputs.result == 'found' && fromJSON(steps.fix.outputs.fixed_count) > 0
      uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
      with:
        commit_message: 'style: apply python lint fixes'
        commit_user_name: ${{ inputs.username }}
        commit_user_email: ${{ inputs.email }}
        file_pattern: '*.py'

    - name: Upload SARIF Report
      # Findings fail the lint step by default, and that is when they must be uploaded.
      if: always() && steps.lint.outputs.sarif_file != ''
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: ${{ steps.lint.outputs.sarif_file }}
        category: 'python-lint'
